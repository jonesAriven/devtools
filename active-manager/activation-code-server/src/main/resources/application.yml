server:
  port: 8080
  servlet:
    session:
      timeout: 1h

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tools?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: tools
    password: toolsmarschat
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: ActivationCodeHikariCP

  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

activation:
  rsa:
    private-key-path: rsa_keys/private_key.pem
    public-key-path: rsa_keys/public_key.pem
    key-size: 2048

# 版本校验策略配置
version-check:
  enabled: false          # 是否启用版本校验
  mode: none             # 校验模式: none=不校验, required=必须传版本号, minimum=最低版本号要求
  min-version: "0.0.0"   # 最低版本号（mode=minimum时生效）
  download-url: "https://tools.marschat.online/activecode/downloads.html"  # 版本过低时的下载提示链接

download:
  base-dir: /app/downloads
