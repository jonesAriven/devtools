server:
  port: 8080
  servlet:
    session:
      timeout: 1h

spring:
  application:
    name: activecode
  # 🔴 Phase 13（2026-10-06）首次引入 auth-core 2.2.0，必须显式排除 4 个会冲突的自动装配：
  #   - AuthJwtAutoConfig   ：会装配 TokenProvider（构造要求 marschat.auth.secret>=32B）。
  #                           本应用无该配置、也不用自己的 JWT 签发体系 → 不排除会**启动失败**。
  #   - AuthWebAutoConfig   ：会注册 @MarsUser 参数解析器，本应用无此用法。
  #   - AuthzAutoConfig     ：会创建第二个权限检查器，与本应用自有的 PermissionInterceptor 重复拦截。
  #   - MenuReportAutoConfig：本应用**已有自有 MenuRegistryReporter**（读 marschat.menu.report.*），
  #                           不排除会**重复上报**菜单与权限点。
  # 只保留 MarschatBffAutoConfig（由 marschat.bff.enabled 控制）。
  # 另：AuthFeignAutoConfig 条件为类路径存在 feign.RequestInterceptor —— 本应用无 OpenFeign，不会激活。
  autoconfigure:
    exclude:
      - com.marschat.auth.AuthJwtAutoConfig
      - com.marschat.auth.AuthWebAutoConfig
      - com.marschat.auth.authz.AuthzAutoConfig
      - com.marschat.auth.menu.MenuReportAutoConfig
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    # MySQL GR 集群多主 failover（3节点随机负载均衡 + 自动故障转移）
    url: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/tools?loadBalanceStrategy=random&loadBalanceHostRemoval=true&failOverReadOnly=false&retriesAllDown=3&connectTimeout=5000&socketTimeout=30000&autoReconnect=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: tools
    password: toolsmarschat
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      pool-name: ActivationCodeHikariCP

  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

activation:
  rsa:
    private-key-path: rsa_keys/private_key.pem
    public-key-path: rsa_keys/public_key.pem
    key-size: 2048

# 版本校验策略配置
version-check:
  enabled: false          # 是否启用版本校验
  mode: none             # 校验模式: none=不校验, required=必须传版本号, minimum=最低版本号要求
  min-version: "0.0.0"   # 最低版本号（mode=minimum时生效）
  download-url: "https://tools.marschat.online/activecode/downloads.html"  # 版本过低时的下载提示链接

download:
  base-dir: /app/downloads

# 统一认证平台（Phase 7）：账号映射上报——启动时把 admin_user 账号全量登记到中心
# app_account_mapping，由中心自动认领统一身份。secret 经 compose 注入
# MARSCHAT_MENU_REPORT_SECRET（与 apps-registry.yml 的 menu-report-secret 同值）。
marschat:
  # 管理代理（BFF，Phase 13 配置化接入）：把 /activecode/api/admin/** 代理到 auth-center /admin/**，
  # 以**调用者本人**的中心令牌转发（绝不服务账号兜底）。白名单见 classpath:bff-whitelist.yml。
  # 本项同时接管原 marschat.account.report（账号上报改由 BffAccountSource + MarschatBffAccountReporter 承担）。
  # ⚠️ 凭据解析用**自定义 BffCredentialResolver**（config/MarschatBffConfig）——
  #    本应用无 Spring Security，用户名在 HttpSession 属性而非 getUserPrincipal()，
  #    故 credential-mode 的内置三模式在此不适用（Bean 覆盖优先）。
  bff:
    enabled: ${MARSCHAT_BFF_ENABLED:true}
    client-id: marschat-activecode
    # 本应用部署在独立主机（内网 Debian 192.168.31.182），只挂自己的 compose 网络，
    # **不能**用容器名 auth-center；必须走宿主 LAN 地址（与下方 auth-center.base 同口径）。
    auth-center-base: ${MARSCHAT_AUTH_CENTER_BASE:http://192.168.31.105:8085}
    # 本应用无 context-path，控制器直接映射完整路径 /activecode/api/admin/**
    path-prefix: /activecode/api/admin
    # 上报凭据（与菜单上报同值）；账号上报开关
    report-secret: ${MARSCHAT_ACCOUNT_REPORT_SECRET:${MARSCHAT_MENU_REPORT_SECRET:}}
    account-report-enabled: ${MARSCHAT_ACCOUNT_REPORT_ENABLED:true}
  # 菜单/权限点上报（Phase 11，2026-09-15）：启动时把 classpath menu-registry.yml 全量覆盖
  # 上报到 auth-center PUT /internal/clients/{client-id}/menus，凭据走 X-Client-Secret
  # （与 account.report 同一个 client secret，由 compose 注入 MARSCHAT_MENU_REPORT_SECRET）。
  # 上报基址复用下方 auth-center.base（独立主机，必须走宿主 LAN 地址）。
  menu:
    report:
      enabled: ${MARSCHAT_MENU_REPORT_ENABLED:true}
      client-id: marschat-activecode
      report-secret: ${MARSCHAT_MENU_REPORT_SECRET:}
  # 统一认证中心服务端互调基址（L1，2026-09-15）：邮箱验证码登录 / 忘记密码由本服务代理转发。
  # ⚠️ activecode 部署在独立主机（内网 Debian 192.168.31.182），只挂自己的 compose 网络，
  #    **不能**用容器名 auth-center；必须走宿主 LAN 地址（与 account.report.issuer 同口径）。
  auth-center:
    base: ${MARSCHAT_AUTH_CENTER_BASE:http://192.168.31.105:8085}
  # ── 接口级权限闸门（P0-3，2026-09-16）────────────────────────────────────
  # 改造前 activecode「有权限点、零闸门」：写接口只认证不鉴权，且 generate /
  # config/default-expire 被整条排除出鉴权（匿名可达）。现在：命中 rules 的**写方法**
  # 必须持有 marschat-activecode:api:<perm> 权限点；读方法、未命中路径、匿名单点一律不受影响。
  # 判定实现 config/PermissionInterceptor.java（Spring MVC，范式同 kb-gateway 的 WebFlux filter）；
  # 权限点在 menu-registry.yml 的 apis 段上报。
  # 应急开关：MARSCHAT_AUTHZ_ENABLED=false 即回到旧行为（只认证不鉴权），便于回滚。
  authz:
    enabled: ${MARSCHAT_AUTHZ_ENABLED:true}
    # 中心不可达时的姿态：false=拒绝（接口=动作，判定不了就不放行动作）。
    # 只影响命中的写请求；读请求与未命中路径完全不受影响。
    fail-open: ${MARSCHAT_AUTHZ_FAIL_OPEN:false}
    # 服务端互调走宿主 LAN 地址（activecode 在独立主机 .182，禁走容器名/公网域名）。
    issuer: ${MARSCHAT_AUTHZ_ISSUER:http://192.168.31.105:8085}
    client-id: marschat-activecode
    cache-ttl-ms: ${MARSCHAT_AUTHZ_CACHE_TTL_MS:60000}
    # 规则表：「方法 + 路径」→ 权限点短码（全码 = marschat-activecode:api:<perm>）。
    # ⚠️ 比 kb-gateway 多一个可选 method 维度：activecode 的受管端点与**匿名**的
    #    POST /activation/verify 同处一层单段路径空间（都匹配 /activation/*），
    #    仅凭路径通配会误伤匿名 verify，故必须按方法精确命中。
    rules:
      - pattern: /activecode/api/activation/generate
        method: POST
        perm: code:generate
      - pattern: /activecode/api/activation/batch
        method: DELETE
        perm: code:batch-delete
      - pattern: /activecode/api/activation/*
        method: DELETE
        perm: code:delete
      - pattern: /activecode/api/activation/*/alias
        method: PUT
        perm: code:alias
      - pattern: /activecode/api/activation/config/default-expire
        method: PUT
        perm: config:expire
      - pattern: /activecode/api/activation/version-check
        method: PUT
        perm: config:version-check
