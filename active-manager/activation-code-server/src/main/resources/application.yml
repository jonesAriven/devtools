server:
  port: 8080
  servlet:
    session:
      timeout: 1h

spring:
  application:
    name: activecode
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    # MySQL GR 集群多主 failover（3节点随机负载均衡 + 自动故障转移）
    url: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/tools?loadBalanceStrategy=random&loadBalanceHostRemoval=true&failOverReadOnly=false&retriesAllDown=3&connectTimeout=5000&socketTimeout=30000&autoReconnect=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: tools
    password: toolsmarschat
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      pool-name: ActivationCodeHikariCP

  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

activation:
  rsa:
    private-key-path: rsa_keys/private_key.pem
    public-key-path: rsa_keys/public_key.pem
    key-size: 2048

# 版本校验策略配置
version-check:
  enabled: false          # 是否启用版本校验
  mode: none             # 校验模式: none=不校验, required=必须传版本号, minimum=最低版本号要求
  min-version: "0.0.0"   # 最低版本号（mode=minimum时生效）
  download-url: "https://tools.marschat.online/activecode/downloads.html"  # 版本过低时的下载提示链接

download:
  base-dir: /app/downloads
