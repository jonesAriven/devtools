<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>激活码生成</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23667eea'/%3E%3Cstop offset='100%25' style='stop-color:%23764ba2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='11' r='7' fill='none' stroke='url(%23g)' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='11' r='2.5' fill='url(%23g)'/%3E%3Cline x1='20.5' y1='15.5' x2='22' y2='17' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='22' y1='17' x2='22' y2='28' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='19' y1='24' x2='25' y2='24' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 600px; width: 100%; overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 24px 32px; }
        .card-header h1 { color: #fff; font-size: 22px; font-weight: 700; }
        .card-header p { color: rgba(255,255,255,0.8); font-size: 13px; margin-top: 6px; }
        .card-body { padding: 28px 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group .hint { font-size: 12px; color: #999; margin-top: 4px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 2px solid #e8e8e8; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #667eea; }
        .expire-tag { display: inline-block; padding: 4px 14px; background: #eef2ff; color: #667eea; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .btn-generate { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
        .btn-generate:hover { opacity: 0.9; }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-box { margin-top: 20px; padding: 16px; border-radius: 8px; display: none; }
        .result-box.success { display: block; background: #f0fdf4; border: 1px solid #bbf7d0; }
        .result-box.error { display: block; background: #fef2f2; border: 1px solid #fecaca; }
        .result-box p { font-size: 13px; margin-bottom: 6px; line-height: 1.6; }
        .result-box .rl { color: #666; font-weight: 500; }
        .result-box .rv { color: #333; word-break: break-all; }
        .code-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin-top: 10px; word-break: break-all; font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; line-height: 1.6; color: #333; position: relative; }
        .btn-copy { position: absolute; top: 8px; right: 8px; padding: 4px 12px; background: #667eea; color: #fff; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .btn-copy:hover { opacity: 0.8; }
        .steps { background: #f8f9ff; border-radius: 8px; padding: 16px 20px; margin-bottom: 24px; }
        .steps h3 { font-size: 14px; color: #667eea; margin-bottom: 10px; }
        .steps ol { padding-left: 20px; }
        .steps li { font-size: 13px; color: #555; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="card">
<div class="card-header">
<h1>激活码生成</h1>
<p>输入唯一序列号，生成1个月有效期的激活码</p>
<div style="margin-top:12px;"><a href="/activecode/downloads.html" style="padding:5px 14px;background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.4);border-radius:6px;font-size:13px;text-decoration:none;transition:all 0.2s;">📥 工具下载</a></div>
</div>
        <div class="card-body">
            <div class="steps">
                <h3>使用步骤</h3>
                <ol>
                    <li>打开软件 → 弹窗显示「唯一序列号」→ 复制</li>
                    <li>将唯一序列号粘贴到下方输入框 → 点击生成</li>
                    <li>将生成的激活码粘贴回软件 → 激活成功</li>
                </ol>
            </div>

            <div class="form-group">
                <label>唯一序列号</label>
                <input type="text" id="genSerialNumber" placeholder="粘贴客户端弹窗中的唯一序列号">
                <div class="hint">由客户端软件自动生成，包含设备信息，服务端将自动解析</div>
            </div>

            <div class="form-group">
                <label>有效期</label>
                <span class="expire-tag" id="defaultExpireTag">加载中...</span>
            </div>

            <button class="btn-generate" id="btnGenerate" onclick="generateCode()">生成激活码</button>

            <div id="genResult" class="result-box"></div>
        </div>
    </div>

    <script>
        // Fixed: 1 month = 30 days = 43200 minutes
        // 有效期由后端根据管理页面设置的默认值决定

        // Auto-fill serial number from URL parameter ?sn=xxx
        (function() {
            const params = new URLSearchParams(window.location.search);
            const sn = params.get('sn');
            if (sn) {
                document.getElementById('genSerialNumber').value = sn;
            }
        })();

        function copyText(btn) {
            const codeBox = btn.parentElement;
            const text = codeBox.textContent.replace('复制', '').replace('已复制', '').trim();
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '已复制';
                setTimeout(() => btn.textContent = '复制', 1500);
            });
        }

        function showResult(div, success, html) {
            div.className = 'result-box ' + (success ? 'success' : 'error');
            div.innerHTML = html;
        }

        // 分钟数 → 人性化时长
        function formatExpireMinutes(minutes) {
            if (!minutes || minutes <= 0) return '-';
            if (minutes < 60) return minutes + '分钟';
            if (minutes < 1440) { const h = Math.floor(minutes / 60), m = minutes % 60; return h + '小时' + (m > 0 ? m + '分钟' : ''); }
            if (minutes < 43200) { const d = Math.floor(minutes / 1440), h = minutes % 1440; return d + '天' + (h >= 60 ? Math.floor(h / 60) + '小时' : ''); }
            if (minutes % 525600 === 0) return (minutes / 525600) + '年';
            if (minutes % 43200 === 0) return (minutes / 43200) + '个月';
            const d = Math.floor(minutes / 1440);
            return d + '天';
        }

        async function generateCode() {
            const serialNumber = document.getElementById('genSerialNumber').value.trim();
            const resultDiv = document.getElementById('genResult');
            const btn = document.getElementById('btnGenerate');

            if (!serialNumber) { showResult(resultDiv, false, '<p style="color:#dc2626;">请输入唯一序列号</p>'); return; }

            btn.disabled = true;
            btn.textContent = '生成中...';

            try {
                const resp = await fetch('/activecode/api/activation/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serialNumber })  // 不传expireMinutes，后端使用系统配置的默认值
                });
                const data = await resp.json();
                if (data.success) {
                    const expireDate = new Date(data.expireTime).toLocaleString('zh-CN');
                    let infoHtml = '';
                    if (data.initialSerial) {
                        infoHtml += `<p><span class="rl">初始序列号：</span><span class="rv">${data.initialSerial}</span></p>`;
                    }
                    if (data.machineCode) {
                        infoHtml += `<p><span class="rl">机器码：</span><span class="rv">${data.machineCode}</span></p>`;
                    }
                    showResult(resultDiv, true, `
                        <p><span class="rl">序列号：</span><span class="rv">${data.serialNumber}</span></p>
                        ${infoHtml}
                        <p><span class="rl">设备ID：</span><span class="rv">${data.deviceId || '未绑定'}</span></p>
                        <p><span class="rl">有效期：</span><span class="rv">${data.expireLabel || formatExpireMinutes(data.expireMinutes)}</span></p>
                        <p><span class="rl">过期时间：</span><span class="rv">${expireDate}</span></p>
                        <div class="code-box"><button class="btn-copy" onclick="copyText(this)">复制</button>${data.activationCode}</div>
                    `);
                } else {
                    let html = `<p style="color:#dc2626;font-weight:600;">${data.message}</p>`;
                    // 根据错误码显示不同的辅助信息
                    if (data.errorCode === 'SERIAL_INVALID') {
                        // 序列号无效：显示使用提示，不显示下载链接
                        html += `<div style="margin-top:10px;padding:12px;background:#fefce8;border:1px solid #fde68a;border-radius:8px;">`;
                        html += `<p style="color:#92400e;font-size:13px;margin-bottom:6px;">💡 <b>正确获取序列号的方法：</b></p>`;
                        html += `<ol style="color:#92400e;font-size:12px;padding-left:20px;margin:0;line-height:1.8;">`;
                        html += `<li>打开客户端软件（QRCodeTool）</li>`;
                        html += `<li>等待弹窗显示「唯一序列号」</li>`;
                        html += `<li>点击「复制」按钮完整复制</li>`;
                        html += `<li>粘贴到上方输入框</li>`;
                        html += `</ol></div>`;
                    } else if (data.errorCode === 'VERSION_REJECTED' || data.downloadUrl) {
                        // 版本校验不通过：显示下载链接
                        html += `<div style="margin-top:12px;padding:12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;">`;
                        html += `<p style="color:#dc2626;font-weight:600;margin-bottom:8px;">⚠️ 当前客户端版本过低，无法生成激活码</p>`;
                        html += `<a href="${data.downloadUrl}" target="_blank" style="display:inline-block;padding:8px 20px;background:#dc2626;color:#fff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600;">📥 下载最新版本工具</a>`;
                        html += `</div>`;
                    }
                    if (data.activationCode) {
                        const expireDate = new Date(data.expireTime).toLocaleString('zh-CN');
                        html += `<p><span class="rl">过期时间：</span><span class="rv">${expireDate}</span></p>`;
                        html += `<div class="code-box"><button class="btn-copy" onclick="copyText(this)">复制</button>${data.activationCode}</div>`;
                    }
                    showResult(resultDiv, false, html);
                }
            } catch (e) {
                showResult(resultDiv, false, '<p style="color:#dc2626;">请求失败: ' + e.message + '</p>');
            } finally {
                btn.disabled = false;
                btn.textContent = '生成激活码';
            }
        }
    
        // 页面加载时获取默认有效期配置
        fetch('/activecode/api/activation/config/default-expire')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d.success && document.getElementById('defaultExpireTag')) {
                    document.getElementById('defaultExpireTag').textContent = d.defaultExpireLabel;
                }
            })
            .catch(function() {
                // 读取失败时默认显示1个月
                if (document.getElementById('defaultExpireTag')) {
                    document.getElementById('defaultExpireTag').textContent = '1 个月';
                }
            });
</script>
</body>
</html>
