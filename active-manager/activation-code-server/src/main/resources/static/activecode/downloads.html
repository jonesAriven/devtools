<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>工具下载 - QRCodeTool 二维码工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%234f46e5'/%3E%3Cstop offset='100%25' style='stop-color:%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='11' r='7' fill='none' stroke='url(%23g)' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='11' r='2.5' fill='url(%23g)'/%3E%3Cline x1='20.5' y1='15.5' x2='22' y2='17' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='22' y1='17' x2='22' y2='28' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='19' y1='24' x2='25' y2='24' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"/>
    <link rel="stylesheet" href="assets/app.css">
</head>
<body class="pg-downloads">
    <div class="container">
        <div class="header">
            <div class="header-icon">📥</div>
            <div>
                <h1>工具下载</h1>
                <p>QRCodeTool 二维码扫描与生成工具</p>
            </div>
        </div>

        <div class="body">
            <!-- 返回入口 -->
            <a class="back-link" href="#" onclick="history.back(); return false;">← 返回</a>

            <!-- 工具介绍 -->
            <div class="tool-intro">
                <h2>QRCodeTool <span class="badge">v3.x C++ 版</span></h2>
                <p>轻量级 Windows 二维码生成与识别工具，纯 Win32 API 开发，零运行时依赖，单文件仅 ~1.4MB。</p>
                <div class="feature-tags">
                    <span class="tag">📷 截图识别</span>
                    <span class="tag">📁 图片识别</span>
                    <span class="tag">✨ 文字转二维码</span>
                    <span class="tag">📑 多页二维码</span>
                    <span class="tag">🔐 激活码验证</span>
                    <span class="tag">⌨️ 全局快捷键</span>
                    <span class="tag">🗜️ 仅 1.4MB</span>
                </div>
            </div>

            <!-- 版本列表 -->
            <div class="section-title">📦 可下载版本</div>
            <div id="versionList" class="version-list">
                <div class="loading"><div class="spinner"></div><br>加载版本列表...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadVersions() {
            const container = document.getElementById('versionList');
            try {
                const resp = await fetch('/activecode/api/download/list');
                const data = await resp.json();

                if (!data.success || !data.data || data.data.length === 0) {
                    container.innerHTML = '<div class="empty"><div class="icon">📭</div><p>' + (data.message || '暂无可下载的版本') + '</p></div>';
                    return;
                }

                const versions = data.data;
                container.innerHTML = versions.map((v, i) => {
                    const isLatest = i === 0;
                    const dateStr = new Date(v.lastModified).toLocaleString('zh-CN', {
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit'
                    });
                    return `
                        <div class="version-item ${isLatest ? 'latest' : ''}">
                            <div class="ver-info">
                                <div class="ver-name">
                                    📌 ${v.filename}
                                    ${isLatest ? '<span class="latest-badge">最新版</span>' : ''}
                                </div>
                                <div class="ver-meta">
                                    <span>📦 ${v.sizeFormatted}</span>
                                    <span>🕐 ${dateStr}</span>
                                </div>
                            </div>
                            <a class="btn-download" href="/activecode/api/download/${encodeURIComponent(v.filename)}" onclick="handleDownload(event, this)">
                                ⬇ 下载
                            </a>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                container.innerHTML = '<div class="error-box">加载失败: ' + e.message + '</div>';
            }
        }

        function handleDownload(e, btn) {
            // 显示下载中状态
            const originalText = btn.textContent;
            btn.textContent = '⏳ 准备中...';
            btn.style.pointerEvents = 'none';

            // 恢复按钮（即使下载失败也恢复）
            setTimeout(() => {
                if (btn.textContent === '⏳ 准备中...') {
                    btn.textContent = originalText;
                    btn.style.pointerEvents = '';
                }
            }, 5000);
        }

        // 页面加载时获取版本列表
        loadVersions();
    </script>
</body>
</html>
