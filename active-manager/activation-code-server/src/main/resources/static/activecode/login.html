<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>登录 - 激活码管理系统</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%234f46e5'/%3E%3Cstop offset='100%25' style='stop-color:%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='11' r='7' fill='none' stroke='url(%23g)' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='11' r='2.5' fill='url(%23g)'/%3E%3Cline x1='20.5' y1='15.5' x2='22' y2='17' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='22' y1='17' x2='22' y2='28' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='19' y1='24' x2='25' y2='24' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif; background: linear-gradient(160deg, #18181b 0%, #1e1b4b 48%, #312e81 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; -webkit-font-smoothing: antialiased; }
        .login-card { background: #fff; border-radius: 16px; box-shadow: 0 24px 70px rgba(0,0,0,0.35); width: 400px; overflow: hidden; }
        .login-header { padding: 34px 32px 8px; text-align: center; }
        .login-logo { width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 12px; background: linear-gradient(135deg, #4f46e5, #7c3aed); display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 6px 16px rgba(79,70,229,0.35); }
        .login-header h1 { font-size: 21px; color: #111827; font-weight: 700; letter-spacing: 0.3px; }
        .login-header p { font-size: 13px; color: #9ca3af; margin-top: 7px; }
        .login-body { padding: 22px 32px 32px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 7px; }
        .form-group input { width: 100%; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 9px; font-size: 14px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
        .form-group input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.14); }
        .btn-login { width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s, box-shadow 0.15s; margin-top: 6px; }
        .btn-login:hover { background: #4338ca; box-shadow: 0 4px 14px rgba(79,70,229,0.35); }
        .btn-login:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
        .error-msg { color: #dc2626; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
        .error-msg.show { display: block; }
        .sso-divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; color: #9ca3af; font-size: 12px; }
        .sso-divider::before, .sso-divider::after { content: ''; flex: 1; height: 1px; background: #eceef2; }
        .btn-sso { width: 100%; padding: 12px; background: #fff; color: #4338ca; border: 1px solid #c7d2fe; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s, box-shadow 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-sso:hover { background: #eef2ff; box-shadow: 0 4px 14px rgba(79,70,229,0.18); }
        .btn-sso:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
        .login-footer { text-align: center; padding: 14px; font-size: 12px; color: #c4c9d4; background: #f9fafb; border-top: 1px solid #f0f1f4; }
        /* 静默免登探测期间的启动遮罩：避免"登录框闪一下又被免登跳走"的抖动 */
        .boot-mask { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(24,24,27,0.92); color: #e5e7eb; font-size: 13px; letter-spacing: 0.3px; }
        .boot-mask.hide { display: none; }
        .boot-spinner { width: 34px; height: 34px; border: 3px solid rgba(199,210,254,0.28); border-top-color: #818cf8; border-radius: 50%; animation: bootspin 0.8s linear infinite; }
        @keyframes bootspin { to { transform: rotate(360deg); } }
        .login-card.pending { visibility: hidden; }
    </style>
</head>
<body>
    <!-- 启动遮罩：静默免登探测期间显示；探针返回"无会话"后才露出登录框 -->
    <div class="boot-mask" id="bootMask">
        <div class="boot-spinner"></div>
        <div>正在检查登录状态…</div>
    </div>

    <div class="login-card pending" id="loginCard">
        <div class="login-header">
            <div class="login-logo">🔑</div>
            <h1>激活码管理系统</h1>
            <p>请登录管理后台</p>
        </div>
        <div class="login-body">
            <form id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login" id="btnLogin">登 录</button>
                <div class="error-msg" id="errorMsg"></div>
            </form>
            <div class="sso-divider">或使用统一认证</div>
            <button type="button" class="btn-sso" id="btnSso" onclick="startSsoLogin()">
                <span>🔐</span> 统一认证登录（SSO）
            </button>
        </div>
        <div class="login-footer">仅限管理员使用 · 如需账号请联系系统管理员</div>
    </div>

    <!-- 公共组件：框架无关 UMD 单文件（@marschat/auth-components，见 VENDORED.md） -->
    <script src="marschat-auth-core.umd.js"></script>
    <script src="sso.js"></script>
    <script>
        var SSO_REDIRECT = '/activecode/main.html';

        function showLoginCard() {
            var mask = document.getElementById('bootMask');
            var card = document.getElementById('loginCard');
            if (mask) mask.classList.add('hide');
            if (card) card.classList.remove('pending');
        }

        // 兜底：认证中心抖动/网络异常时不能让登录页一直停在遮罩上（最迟 3s 露出登录框）
        setTimeout(showLoginCard, 3000);

        function ssoFail(err) {
            var btn = document.getElementById('btnSso');
            if (btn) { btn.disabled = false; btn.innerHTML = '<span>🔐</span> 统一认证登录（SSO）'; }
            var errorEl = document.getElementById('errorMsg');
            errorEl.textContent = '发起统一认证失败: ' + (err && err.message ? err.message : err);
            errorEl.classList.add('show');
        }

        function startSsoLogin() {
            const btn = document.getElementById('btnSso');
            if (btn) { btn.disabled = true; btn.textContent = '跳转认证中...'; }
            try {
                const p = ActiveCodeSSO.startSsoLogin(SSO_REDIRECT);
                // login() 会导航离开（正常不会 resolve/reject），仅在发起阶段失败时兜底
                if (p && typeof p.catch === 'function') p.catch(ssoFail);
            } catch (err) {
                ssoFail(err);
            }
        }

        // ===== 静默免登：探测到有效 IdP 会话则直接免密进入，否则正常显示登录框 =====
        (function bootstrap() {
            var qs = new URLSearchParams(location.search);
            // 401 静默重授权仍失败时，main.html 会带 ?reauth=1 回登录页；
            // 此时必须停掉免登探测，否则「免登 → 401 → 免登」会无限弹跳。
            var isReauth = qs.get('reauth') === '1';
            if (isReauth) {
                try { history.replaceState(null, '', location.pathname); } catch (e) {}
                showLoginCard();
                return;
            }
            // SLO 联动登出（任一应用登出 → 本应用被联动踢回登录页）带 ?slo=1：
            // 直接展示登录框并给出提示，跳过免登探测（IdP 会话已销毁）。
            var isSlo = qs.get('slo') === '1';
            if (isSlo) {
                try { history.replaceState(null, '', location.pathname); } catch (e) {}
                showLoginCard();
                var sloEl = document.getElementById('errorMsg');
                if (sloEl) {
                    sloEl.textContent = '您已在其他应用退出登录，请重新登录';
                    sloEl.classList.add('show');
                }
                return;
            }
            try {
                if (!ActiveCodeSSO.ready) {
                    // 组件未加载：不阻塞账号密码登录，仅记录
                    console.error('[activecode] 统一认证组件未加载，已退化为本地账号登录');
                    showLoginCard();
                    return;
                }
                var p = ActiveCodeSSO.bootstrapLoginPage(SSO_REDIRECT);
                if (p && typeof p.then === 'function') {
                    p.then(function (navigated) {
                        // 有会话时页面已导航离开；无会话返回 false → 露出登录框
                        if (!navigated) showLoginCard();
                    }).catch(function (e) {
                        console.warn('[activecode] 静默免登探测失败，回退到账号密码登录', e);
                        showLoginCard();
                    });
                } else {
                    showLoginCard();
                }
            } catch (e) {
                console.warn('[activecode] 静默免登异常，回退到账号密码登录', e);
                showLoginCard();
            }
        })();

        async function handleLogin(e) {
            if (e && e.preventDefault) e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const errorEl = document.getElementById('errorMsg');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                errorEl.textContent = '请输入用户名和密码';
                errorEl.classList.add('show');
                return false;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';
            errorEl.classList.remove('show');

            try {
                const res = await fetch('/activecode/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = '/activecode/main.html';
                } else {
                    errorEl.textContent = data.message || '登录失败';
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请重试';
                errorEl.classList.add('show');
            } finally {
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }

        // 回车提交
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin(e);
        });

        // 表单提交（不用 onsubmit，避免 async 返回 Promise 导致表单默认提交）
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            handleLogin(e);
        });
    </script>
</body>
</html>
