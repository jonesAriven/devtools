<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>统一认证登录中 - 激活码管理系统</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%234f46e5'/%3E%3Cstop offset='100%25' style='stop-color:%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='11' r='7' fill='none' stroke='url(%23g)' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='11' r='2.5' fill='url(%23g)'/%3E%3Cline x1='20.5' y1='15.5' x2='22' y2='17' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='22' y1='17' x2='22' y2='28' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='19' y1='24' x2='25' y2='24' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif; background: linear-gradient(160deg, #18181b 0%, #1e1b4b 48%, #312e81 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; -webkit-font-smoothing: antialiased; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 24px 70px rgba(0,0,0,0.35); width: 420px; padding: 40px 32px; text-align: center; }
        .spinner { width: 42px; height: 42px; margin: 0 auto 18px; border: 4px solid #eef2ff; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .card h1 { font-size: 17px; color: #111827; font-weight: 700; }
        .card p { font-size: 13px; color: #9ca3af; margin-top: 8px; }
        .err { display: none; margin-top: 14px; padding: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 9px; color: #dc2626; font-size: 13px; text-align: left; word-break: break-all; }
        .err.show { display: block; }
        .btn-back { display: none; margin-top: 16px; padding: 10px 22px; background: #4f46e5; color: #fff; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn-back.show { display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">正在完成统一认证登录…</h1>
        <p id="subtitle">请稍候，正在与认证中心交换凭据</p>
        <div class="err" id="errBox"></div>
        <a class="btn-back" id="btnBack" href="/activecode/login.html">返回登录页</a>
    </div>

    <script src="sso.js"></script>
    <script>
        (function () {
            var errBox = document.getElementById('errBox');
            var btnBack = document.getElementById('btnBack');
            var title = document.getElementById('title');
            var subtitle = document.getElementById('subtitle');

            function fail(msg) {
                document.getElementById('spinner').style.display = 'none';
                title.textContent = '统一认证登录失败';
                subtitle.textContent = '无法通过统一认证登录';
                errBox.textContent = msg;
                errBox.classList.add('show');
                btnBack.classList.add('show');
            }

            try {
                ActiveCodeSSO.handleSsoCallback().then(function (result) {
                    title.textContent = '登录成功';
                    subtitle.textContent = '正在进入管理后台…';
                    window.location.replace(result.redirect);
                }).catch(function (e) {
                    fail(e && e.message ? e.message : String(e));
                });
            } catch (e) {
                fail(e && e.message ? e.message : String(e));
            }
        })();
    </script>
</body>
</html>
