<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>激活码生成工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%234f46e5'/%3E%3Cstop offset='100%25' style='stop-color:%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='11' r='7' fill='none' stroke='url(%23g)' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='11' r='2.5' fill='url(%23g)'/%3E%3Cline x1='20.5' y1='15.5' x2='22' y2='17' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='22' y1='17' x2='22' y2='28' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='19' y1='24' x2='25' y2='24' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"/>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
            --primary-ring: rgba(79, 70, 229, 0.14);
            --border: #e5e7eb;
            --border-light: #f0f1f4;
            --text: #111827;
            --text-2: #6b7280;
            --text-3: #9ca3af;
            --green: #059669;
            --green-soft: #ecfdf5;
            --red: #dc2626;
            --red-soft: #fef2f2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif; background: #f6f7f9; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 48px 20px; -webkit-font-smoothing: antialiased; }
        .card { background: #fff; border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 8px 28px rgba(16,24,40,0.07); max-width: 600px; width: 100%; overflow: hidden; border: 1px solid var(--border-light); }
        .card-header { padding: 22px 30px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px; }
        .card-header .logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #4f46e5, #7c3aed); display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none; box-shadow: 0 3px 10px rgba(79,70,229,0.3); }
        .card-header h1 { color: var(--text); font-size: 18px; font-weight: 700; }
        .card-header p { color: var(--text-3); font-size: 12.5px; margin-top: 3px; }
        .card-body { padding: 26px 30px 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 7px; }
        .form-group .hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 9px; font-size: 14px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }
        .expire-presets { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .expire-presets button { padding: 5px 14px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-size: 12px; cursor: pointer; color: var(--text-2); font-weight: 500; transition: all 0.12s; }
        .expire-presets button:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
        .btn-generate { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.15s, box-shadow 0.15s; }
        .btn-generate:hover { background: var(--primary-hover); box-shadow: 0 4px 14px rgba(79,70,229,0.3); }
        .btn-generate:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
        .result-box { margin-top: 20px; padding: 16px; border-radius: 10px; display: none; }
        .result-box.success { display: block; background: var(--green-soft); border: 1px solid #a7f3d0; }
        .result-box.error { display: block; background: var(--red-soft); border: 1px solid #fecaca; }
        .result-box p { font-size: 13px; margin-bottom: 6px; line-height: 1.7; }
        .result-box .rl { color: var(--text-3); font-weight: 500; }
        .result-box .rv { color: var(--text); word-break: break-all; }
        .code-box { background: #f8f9fb; border: 1px solid var(--border-light); border-radius: 8px; padding: 13px 14px; margin-top: 10px; word-break: break-all; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; line-height: 1.7; color: #374151; position: relative; }
        .btn-copy { position: absolute; top: 8px; right: 8px; padding: 4px 13px; background: var(--primary); color: #fff; border: none; border-radius: 5px; font-size: 12px; cursor: pointer; transition: background 0.12s; }
        .btn-copy:hover { background: var(--primary-hover); }
        .steps { background: #f9fafb; border: 1px solid var(--border-light); border-radius: 10px; padding: 15px 18px; margin-bottom: 24px; }
        .steps h3 { font-size: 13px; color: var(--text-2); margin-bottom: 9px; font-weight: 600; }
        .steps ol { padding-left: 20px; }
        .steps li { font-size: 12.5px; color: var(--text-2); line-height: 1.9; }
        .steps li::marker { color: var(--primary); font-weight: 600; }
        .back-link { display: inline-block; margin-bottom: 16px; font-size: 13px; color: var(--primary); text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="logo">🔑</div>
            <div>
                <h1>激活码生成工具</h1>
                <p>为客户端软件生成激活码，绑定设备与有效期</p>
            </div>
        </div>
        <div class="card-body">
            <a class="back-link" href="/activecode/main.html">← 返回管理后台</a>
            <div class="steps">
                <h3>使用步骤</h3>
                <ol>
                    <li>用户打开软件 → 弹窗显示「唯一序列号」→ 复制发给你</li>
                    <li>将唯一序列号粘贴到下方输入框 → 设置有效期 → 生成激活码</li>
                    <li>将生成的激活码发给用户 → 用户粘贴激活 → 软件可用</li>
                </ol>
            </div>

            <div class="form-group">
                <label>唯一序列号</label>
                <input type="text" id="genSerialNumber" placeholder="粘贴客户端弹窗中的唯一序列号">
                <div class="hint">由客户端软件自动生成，包含设备信息，服务端将自动解析</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>有效期</label>
                    <input type="number" id="genExpireMinutes" value="60" min="1" max="43200">
                    <div class="expire-presets">
                        <button onclick="setExpire(5)">5分钟</button>
                        <button onclick="setExpire(60)">1小时</button>
                        <button onclick="setExpire(1440)">1天</button>
                        <button onclick="setExpire(43200)">30天</button>
                    </div>
                    <div class="hint">最长支持30天有效期</div>
                </div>
            </div>

            <button class="btn-generate" id="btnGenerate" onclick="generateCode()">生成激活码</button>

            <div id="genResult" class="result-box"></div>
        </div>
    </div>

    <script>
        function setExpire(minutes) {
            document.getElementById('genExpireMinutes').value = minutes;
        }

        function copyText(btn) {
            const codeBox = btn.parentElement;
            const text = codeBox.textContent.replace('复制', '').trim();
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '已复制';
                setTimeout(() => btn.textContent = '复制', 1500);
            });
        }

        function showResult(div, success, html) {
            div.className = 'result-box ' + (success ? 'success' : 'error');
            div.innerHTML = html;
        }

        async function generateCode() {
            const serialNumber = document.getElementById('genSerialNumber').value.trim();
            const expireMinutes = parseInt(document.getElementById('genExpireMinutes').value);
            const resultDiv = document.getElementById('genResult');
            const btn = document.getElementById('btnGenerate');

            if (!serialNumber) { showResult(resultDiv, false, '<p style="color:#dc2626;">请输入唯一序列号</p>'); return; }
            if (!expireMinutes || expireMinutes <= 0) { showResult(resultDiv, false, '<p style="color:#dc2626;">请输入有效的有效期</p>'); return; }
            if (expireMinutes > 43200) { showResult(resultDiv, false, '<p style="color:#dc2626;">有效期最长30天</p>'); return; }

            btn.disabled = true;
            btn.textContent = '生成中...';

            try {
                const resp = await fetch('/activecode/api/activation/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serialNumber, expireMinutes })
                });
                const data = await resp.json();
                if (data.success) {
                    const expireDate = new Date(data.expireTime).toLocaleString('zh-CN');
                    let infoHtml = '';
                    if (data.initialSerial) {
                        infoHtml += `<p><span class="rl">初始序列号：</span><span class="rv">${data.initialSerial}</span></p>`;
                    }
                    if (data.machineCode) {
                        infoHtml += `<p><span class="rl">机器码：</span><span class="rv">${data.machineCode}</span></p>`;
                    }
                    showResult(resultDiv, true, `
                        <p><span class="rl">序列号：</span><span class="rv">${data.serialNumber}</span></p>
                        ${infoHtml}
                        <p><span class="rl">设备ID：</span><span class="rv">${data.deviceId || '未绑定'}</span></p>
                        <p><span class="rl">过期时间：</span><span class="rv">${expireDate}</span></p>
                        <div class="code-box"><button class="btn-copy" onclick="copyText(this)">复制</button>${data.activationCode}</div>
                    `);
                } else {
                    let html = `<p style="color:#dc2626;">${data.message}</p>`;
                    if (data.activationCode) {
                        const expireDate = new Date(data.expireTime).toLocaleString('zh-CN');
                        html += `<p><span class="rl">过期时间：</span><span class="rv">${expireDate}</span></p>`;
                        html += `<div class="code-box"><button class="btn-copy" onclick="copyText(this)">复制</button>${data.activationCode}</div>`;
                    }
                    showResult(resultDiv, false, html);
                }
            } catch (e) {
                showResult(resultDiv, false, '<p style="color:#dc2626;">请求失败: ' + e.message + '</p>');
            } finally {
                btn.disabled = false;
                btn.textContent = '生成激活码';
            }
        }
    </script>
</body>
</html>
