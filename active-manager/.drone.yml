# ============================================================
# active-manager 项目 CI/CD 配置（被根目录 .drone.yml 引用）
# ============================================================
# 此文件定义 active-manager 项目的构建和部署逻辑
# 根目录 .drone.yml 负责调度，此文件负责具体实现
#
# 项目: 激活码管理系统 (Spring Boot 3.4.5 / Java 21)
# 部署目标: 内网Debian (192.168.31.182)
# 端口映射: 宿主机 18080 → 容器 8080
# 公网访问: https://tools.marschat.online (FRP 端口 18080)
#
# 数据库: 同机 MySQL :3306 (库: tools, 用户: tools)
# Docker 镜像名: activecode
# ============================================================

# Maven 编译配置
MAVEN_IMAGE: maven:3.9-eclipse-temurin-21
MAVEN_OPTS: -Xmx1024m
MAVEN_CMD: |
  cd active-manager/activation-code-server &&
  mvn clean package -DskipTests -B -V -ntp \
    -Dmaven.repo.local=/root/.m2/repository &&
  cd ../.. &&
  echo "=== 编译产物 ===" &&
  ls -lh active-manager/activation-code-server/target/*.jar

# 部署配置
DEPLOY_HOST: 192.168.31.182
DEPLOY_USER: root
DEPLOY_PORT: 22
DEPLOY_SCRIPT: active-manager/deploy.sh
DEPLOY_TIMEOUT: 10m
