spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# MeiliSearch 占位配置（集成测试中 SearchIndexService 被 @MockBean，客户端构建不连接）
meilisearch:
  host: http://localhost:7700
  api-key: test-key

# Redis 事件通道（EventPublisher @Value 占位）
kb:
  event:
    channel: kb:events
  feign:
    auth-url: http://localhost:8081
    file-url: http://localhost:8082

server:
  port: 0

logging:
  level:
    com.kb: WARN
