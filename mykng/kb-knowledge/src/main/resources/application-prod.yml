server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:kb_knowledge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:kb123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      keepalive-time: 60000
      connection-timeout: 5000
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:kb}:${MONGO_PASSWORD:kb123456}@${MONGO_HOST:mongodb}:${MONGO_PORT:27017}/${MONGO_DB:kb_knowledge}?authSource=admin
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms

meilisearch:
  host: ${MEILI_HOST:http://meilisearch:7700}
  key: ${MEILI_KEY:kbMeiliKey2026}

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong!!}

# Feign 客户端配置
kb:
  auth:
    host: ${KB_AUTH_HOST:http://kb-auth:8081}
  file:
    host: ${KB_FILE_HOST:http://kb-file:8082}

logging:
  level:
    com.kb: INFO
    org.springframework: WARN
