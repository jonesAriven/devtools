server:
  port: 8092

spring:
  application:
    name: kb-knowledge
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:platform-nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MeiliSearch 配置
meilisearch:
  host: http://127.0.0.1:7700
  api-key: kbMeiliKey2026!!Secure

# Redis 事件通道
kb:
  event:
    channel: kb:events
  # M5-1: Feign 通过 Nacos 服务发现路由，不再需要硬编码 URL
  # kb.feign.file-url 已废弃，FileClient 去掉 url 参数后自动走服务发现

logging:
  level:
    com.kb.knowledge: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# M6: springdoc-openapi 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false
