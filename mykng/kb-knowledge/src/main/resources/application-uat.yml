server:
  port: 8092
  servlet:
    context-path: ${KB_CONTEXT:/kb}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:kb_knowledge_uat}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:kb123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      keepalive-time: 60000
      connection-timeout: 5000
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:kb}:${MONGO_PASSWORD:kb123456}@${MONGO_HOST:mongodb}:${MONGO_PORT:27017}/${MONGO_DB:kb_knowledge_uat}?authSource=admin
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms

meilisearch:
  host: ${MEILI_HOST:http://meilisearch:7700}
  api-key: ${MEILI_KEY:kbMeiliKey2026!!Secure}

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong!!}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

kb:
  auth:
    host: ${KB_AUTH_HOST:http://kb-auth:8085}
  file:
    host: ${KB_FILE_HOST:http://kb-file:8089}

logging:
  level:
    com.kb: DEBUG
    org.springframework: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
