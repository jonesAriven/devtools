<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码 - 统一认证</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    padding: 36px 28px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header h1 { font-size: 22px; font-weight: 600; color: #303133; margin-bottom: 6px; }
  .header p { font-size: 13px; color: #909399; }
  .steps { display: flex; align-items: center; justify-content: center; margin-bottom: 24px; font-size: 12px; color: #909399; }
  .steps .step { display: flex; align-items: center; gap: 4px; }
  .steps .num {
    width: 18px; height: 18px; border-radius: 50%; background: #e4e7ed; color: #909399;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .steps .step.active .num { background: #409eff; color: #fff; }
  .steps .step.active { color: #409eff; font-weight: 600; }
  .steps .bar { width: 60px; height: 1px; background: #dcdfe6; margin: 0 8px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #606266; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #dcdfe6; border-radius: 6px;
    font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: #409eff; }
  .code-row { display: flex; gap: 8px; }
  .code-row input { flex: 1; }
  .btn {
    width: 100%; padding: 11px; border: none; border-radius: 6px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  .btn-primary { background: #409eff; color: #fff; }
  .btn-primary:hover { background: #337ecc; }
  .btn-primary:disabled { background: #a0cfff; cursor: not-allowed; }
  .btn-send {
    flex-shrink: 0; width: 108px; padding: 10px 8px; background: #fff; color: #409eff;
    border: 1px solid #b3d8ff; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .btn-send:hover { background: #ecf5ff; }
  .btn-send:disabled { color: #c0c4cc; border-color: #e4e7ed; cursor: not-allowed; background: #f5f7fa; }
  .msg { font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
  .msg.ok { color: #67c23a; }
  .msg.err { color: #f56c6c; }
  .tip { font-size: 12px; color: #c0c4cc; text-align: center; margin-top: 16px; line-height: 1.6; }
  .back { text-align: center; margin-top: 14px; }
  .back a { color: #409eff; font-size: 14px; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
  .success-icon {
    width: 56px; height: 56px; border-radius: 50%; background: #f0f9eb; color: #67c23a;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    margin: 8px auto 16px; border: 1px solid #e1f3d8;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>重置密码</h1>
    <p>统一认证 · 通过绑定邮箱验证码重置</p>
  </div>

  <!-- 第一步：邮箱验证 -->
  <div id="step1">
    <div class="steps">
      <span class="step active" id="stepTag1"><span class="num">1</span>邮箱验证</span>
      <span class="bar"></span>
      <span class="step" id="stepTag2"><span class="num">2</span>设置新密码</span>
    </div>
    <div class="form-group">
      <label for="email">绑定邮箱</label>
      <div class="code-row">
        <input type="email" id="email" placeholder="请输入账号绑定的邮箱" autocomplete="email">
        <button type="button" class="btn-send" id="btnSend" onclick="sendCode()">发送验证码</button>
      </div>
    </div>
    <div class="form-group">
      <label for="code">邮箱验证码</label>
      <input type="text" id="code" placeholder="6 位验证码，5 分钟内有效" maxlength="10" autocomplete="one-time-code">
    </div>
    <button type="button" class="btn btn-primary" id="btnNext" onclick="goStep2()">下一步</button>
    <div class="msg" id="msg1"></div>
    <p class="tip">如该邮箱已注册，验证码将发送至邮箱（60 秒内请勿重复获取）。<br>验证码 5 分钟内有效，连续错误将被锁定 15 分钟。</p>
  </div>

  <!-- 第二步：设置新密码 -->
  <div id="step2" class="hidden">
    <div class="steps">
      <span class="step" id="stepTag1b"><span class="num">1</span>邮箱验证</span>
      <span class="bar"></span>
      <span class="step active" id="stepTag2b"><span class="num">2</span>设置新密码</span>
    </div>
    <div class="form-group">
      <label>绑定邮箱</label>
      <div id="emailEcho" style="padding:10px 12px;background:#f5f7fa;border-radius:6px;font-size:14px;color:#606266;"></div>
    </div>
    <div class="form-group">
      <label for="newPassword">新密码</label>
      <input type="password" id="newPassword" placeholder="6-64 位" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="newPassword2">确认新密码</label>
      <input type="password" id="newPassword2" placeholder="再次输入新密码" autocomplete="new-password">
    </div>
    <button type="button" class="btn btn-primary" id="btnReset" onclick="doReset()">重置密码</button>
    <div class="msg" id="msg2"></div>
    <div class="back"><a href="javascript:void(0)" onclick="backToStep1()">返回上一步</a></div>
  </div>

  <!-- 成功 -->
  <div id="step3" class="hidden">
    <div class="success-icon">✓</div>
    <div class="header">
      <h1>重置成功</h1>
      <p>密码已更新，其他设备的登录状态已全部失效</p>
    </div>
    <button type="button" class="btn btn-primary" onclick="backToLogin()">返回登录</button>
  </div>

  <div class="back" id="backLogin"><a href="/login">返回登录</a></div>
</div>

<script>
function $(id) { return document.getElementById(id); }
function showMsg(el, text, ok) {
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}
function isResultOk(data) { return data && (data.code === 0 || data.code === 200); }

var sendTimer = null;
function sendCode() {
  var email = $('email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg($('msg1'), '请输入正确的邮箱地址', false);
    return;
  }
  var btn = $('btnSend');
  btn.disabled = true;
  fetch('/auth/forgot-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  }).then(function (r) { return r.json().catch(function () { return {}; }); }).then(function (data) {
    if (!isResultOk(data)) {
      showMsg($('msg1'), (data && data.message) || '发送失败，请稍后重试', false);
      btn.disabled = false;
      return;
    }
    showMsg($('msg1'), '如该邮箱已注册，验证码已发送，请查收', true);
    var left = 60;
    btn.textContent = left + ' 秒后重发';
    sendTimer = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(sendTimer);
        btn.disabled = false;
        btn.textContent = '发送验证码';
      } else {
        btn.textContent = left + ' 秒后重发';
      }
    }, 1000);
  }).catch(function () {
    showMsg($('msg1'), '网络异常，请稍后重试', false);
    btn.disabled = false;
  });
}

function goStep2() {
  var email = $('email').value.trim();
  var code = $('code').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg($('msg1'), '请输入正确的邮箱地址', false);
    return;
  }
  if (!code) {
    showMsg($('msg1'), '请输入邮箱中收到的验证码', false);
    return;
  }
  $('emailEcho').textContent = email;
  $('step1').classList.add('hidden');
  $('step2').classList.remove('hidden');
  $('backLogin').classList.add('hidden');
  showMsg($('msg2'), '', true);
}

function backToStep1() {
  $('step2').classList.add('hidden');
  $('step1').classList.remove('hidden');
  $('backLogin').classList.remove('hidden');
}

function doReset() {
  var email = $('email').value.trim();
  var code = $('code').value.trim();
  var pwd = $('newPassword').value;
  var pwd2 = $('newPassword2').value;
  if (pwd.length < 6 || pwd.length > 64) {
    showMsg($('msg2'), '新密码长度需为 6-64 位', false);
    return;
  }
  if (pwd !== pwd2) {
    showMsg($('msg2'), '两次输入的密码不一致', false);
    return;
  }
  var btn = $('btnReset');
  btn.disabled = true;
  btn.textContent = '重置中...';
  fetch('/auth/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, code: code, newPassword: pwd })
  }).then(function (r) { return r.json().catch(function () { return {}; }); }).then(function (data) {
    btn.disabled = false;
    btn.textContent = '重置密码';
    if (!isResultOk(data)) {
      showMsg($('msg2'), (data && data.message) || '重置失败：验证码错误或已过期', false);
      return;
    }
    $('step2').classList.add('hidden');
    $('step3').classList.remove('hidden');
  }).catch(function () {
    btn.disabled = false;
    btn.textContent = '重置密码';
    showMsg($('msg2'), '网络异常，请稍后重试', false);
  });
}

function backToLogin() { window.location.href = '/login'; }
</script>
</body>
</html>
