services:
  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: knowledge_base
      MYSQL_USER: kb
      MYSQL_PASSWORD: kb123456
    ports:
      - "3306:3306"
    volumes:
      - kb-mysql-data:/var/lib/mysql
      - /mnt/shared/devtools/mykng/kb-server/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kb-net

  mongo:
    image: mongo:7.0
    container_name: kb-mongo
    ports:
      - "27017:27017"
    volumes:
      - kb-mongo-data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kb-net

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - kb-net

  minio:
    image: minio/minio:latest
    container_name: kb-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - kb-minio-data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kb-net

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: kb-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - kb-meili-data:/meili_data
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - kb-net

  kb-backend:
    build:
      context: /mnt/shared/devtools/mykng/kb-server
      dockerfile: Dockerfile
    container_name: kb-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - mysql
      - mongo
      - redis
      - minio
      - meilisearch
    networks:
      - kb-net

volumes:
  kb-mysql-data:
  kb-mongo-data:
  kb-minio-data:
  kb-meili-data:

networks:
  kb-net:
    driver: bridge
