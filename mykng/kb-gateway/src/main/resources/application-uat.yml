# UAT 环境：M6 改造后路由 uri 为 lb://服务名，通过 Nacos 服务发现寻址
# kb.gateway.services 已废弃
kb:
  gateway:
    jwt:
      secret: ${JWT_SECRET:YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!}

logging:
  level:
    com.kb.gateway: DEBUG
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
