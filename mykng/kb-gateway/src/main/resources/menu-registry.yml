# kb-web 菜单注册表（menu-permission-management-plan §5 schema）
# key = 权限点稳定标识（sys_permission.code，下发为 marschat-kbweb:menu:<key>），与
# kb-web src/router/index.ts 的 permCode('menu','<key>') 严格对齐，禁止随意改名。
# 菜单源 = kb-web src/menus.ts（createKbMenus，15 节点）；运行时动态语义（visibleFn/pathFn/
# disabledFn）为前端渲染条件，非权限点，不进本表（current-space 的动态 path 故留空）。
# 上报：auth-core MenuRegistryReporter 启动时经 kb-gateway 全量覆盖上报到
# auth-center /internal/clients/marschat-kbweb/menus（X-Client-Secret）。
client: marschat-kbweb
menus:
  - key: dashboard
    title: 工作台
    path: /dashboard
    order: 1
    # public=true → 「已登录即可见」：strict 默认最小权限下仍授予默认可见角色
    # （平台 user/admin + 本应用 user），保证普通用户登录后有落地页而不是一片空白。
    # 其余菜单与所有 api 点必须由应用角色显式授权（见 ADR §35.2 / AuthzPolicyService）。
    public: true
  - key: kb-group
    title: 知识库
    order: 2
    children:
      - key: spaces
        title: 知识空间
        path: /spaces
        order: 1
      - key: current-space
        title: 当前空间
        order: 2
      - key: stars
        title: 我的收藏
        path: /stars
        order: 3
      - key: search
        title: 搜索
        path: /search
        order: 4
      - key: file
        title: 文件
        path: /file
        order: 5
      - key: tag
        title: 标签
        path: /tag
        order: 6
      - key: share
        title: 分享
        path: /share
        order: 7
      - key: trash
        title: 回收站
        path: /trash
        order: 8
      - key: graph
        title: 知识图谱
        path: /graph
        order: 9
  - key: system-group
    title: 系统
    order: 3
    children:
      - key: log
        title: 操作日志
        path: /log
        order: 1
      - key: users
        title: 用户管理
        path: /users
        order: 2
        min-role: admin
      - key: settings
        title: 设置
        path: /settings
        order: 3

# 🔴 2026-09-15（T5 接口级鉴权）：api 权限点，随本 yml 全量上报为 type=api
#   （sys_permission.code = 下面的 key，下发全码 = marschat-kbweb:api:<key>）。
#
# 为什么 kb-web 的写接口必须在**网关**收口：kb-file / kb-knowledge / kb-intelligence
#   只依赖 common-core（无 auth-core、无 Servlet Security 链），逐个接入 @RequirePermission
#   成本与回归面远大于在网关一处收口；网关已持有已验签身份与原始 token。
#   判定实现见 filter/PermissionAuthzFilter.java，规则映射见 application.yml 的 kb.gateway.authz.rules。
#
# 命名 = <资源>:write（与 kb-ops 的 hosts:create / infra 的 items:create 同族）。
# 只覆盖**写**语义；读=可见性，仍由菜单/前端守卫负责。
apis:
  - key: doc:write
    title: 文档增改（kb-knowledge /api/doc/**）
  - key: folder:write
    title: 目录增改（/api/folder/**）
  - key: file:write
    title: 文件上传与删除（/api/file/**、/api/bucket/**）
  - key: space:write
    title: 知识空间增改（/api/space/**）
  - key: tag:write
    title: 标签增改（/api/tag/**）
  - key: share:write
    title: 分享增改（/api/share/**）
  - key: web:write
    title: 网页剪藏增改（/api/web/**）
  - key: trash:write
    title: 回收站操作（/api/trash/**）
  - key: version:write
    title: 版本操作（/api/version/**）
  - key: intelligence:write
    title: 智能能力写操作（/api/intelligence/**）
