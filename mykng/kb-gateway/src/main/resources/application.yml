server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: kb-gateway
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:platform-redis}
      port: ${REDIS_PORT:6379}
      # 仅用于模块探活 everSeen 的持久化（非主链路）；连不上时自动降级，不影响网关转发
      connect-timeout: 2s
      timeout: 2s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:platform-nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos123}
    gateway:
      # ============================================================
      # 统一上下文路径：${KB_CONTEXT:/kb}
      # 修改此环境变量即可改变所有路由前缀，无需改代码
      # ============================================================
      # 路径结构: ${KB_CONTEXT}/api/${module}/${action}
      #   /kb     → KB_CONTEXT (可配置，默认 /kb)
      #   /api    → API 标识 (固定)
      #   /auth   → 功能模块 (Controller 定义)
      # StripPrefix=2 去掉 /kb/api 两段，后端收到 /auth/login
      # ============================================================
      # M6: 路由 uri 改为 lb://服务名，通过 Nacos 服务发现自动路由
      # 模块上线：注册到 Nacos，网关自动发现
      # 模块下线：Nacos 感知，网关不再路由到该实例（可拔插基础）
      # ============================================================
      routes:
        # M6: 各服务 Swagger API Docs 路由（必须放在业务路由前面，优先匹配）
        # StripPrefix=3：去掉 /kb/api/{service} 三段，后端收到 /v3/api-docs
        - id: auth-center-api-docs
          uri: lb://auth-center
          predicates:
            - Path=${KB_CONTEXT:/kb}/api/auth/v3/api-docs/**,${KB_CONTEXT:/kb}/api/auth/swagger-ui/**
          filters:
            - StripPrefix=3

        - id: kb-file-api-docs
          uri: lb://kb-file
          predicates:
            - Path=${KB_CONTEXT:/kb}/api/file/v3/api-docs/**,${KB_CONTEXT:/kb}/api/file/swagger-ui/**
          filters:
            - StripPrefix=3

        - id: kb-knowledge-api-docs
          uri: lb://kb-knowledge
          predicates:
            - Path=${KB_CONTEXT:/kb}/api/knowledge/v3/api-docs/**,${KB_CONTEXT:/kb}/api/knowledge/swagger-ui/**
          filters:
            - StripPrefix=3

        - id: kb-intelligence-api-docs
          uri: lb://kb-intelligence
          predicates:
            - Path=${KB_CONTEXT:/kb}/api/intelligence/v3/api-docs/**,${KB_CONTEXT:/kb}/api/intelligence/swagger-ui/**
          filters:
            - StripPrefix=3

        - id: auth-center
          uri: lb://auth-center
          predicates:
            - Path=${KB_CONTEXT:/kb}/api/auth/**,${KB_CONTEXT:/kb}/api/user/**,${KB_CONTEXT:/kb}/api/token/**,${KB_CONTEXT:/kb}/api/log/**
          filters:
            - StripPrefix=2

        - id: kb-file
          uri: lb://kb-file
          predicates:
            - Path=${KB_CONTEXT:/kb}/api/file/**,${KB_CONTEXT:/kb}/api/bucket/**
          filters:
            - StripPrefix=2

        - id: kb-knowledge
          uri: lb://kb-knowledge
          predicates:
            - Path=${KB_CONTEXT:/kb}/api/doc/**,${KB_CONTEXT:/kb}/api/folder/**,${KB_CONTEXT:/kb}/api/web/**,${KB_CONTEXT:/kb}/api/search/**,${KB_CONTEXT:/kb}/api/share/**,${KB_CONTEXT:/kb}/api/tag/**,${KB_CONTEXT:/kb}/api/space/**,${KB_CONTEXT:/kb}/api/trash/**,${KB_CONTEXT:/kb}/api/version/**
          filters:
            - StripPrefix=2

        - id: kb-intelligence
          uri: lb://kb-intelligence
          predicates:
            - Path=${KB_CONTEXT:/kb}/api/intelligence/**
          filters:
            - StripPrefix=2

        # 前端静态资源路由（/kb/s/）
        - id: kb-web-static
          uri: http://kb-web:80
          predicates:
            - Path=${KB_CONTEXT:/kb}/s/**

        # 前端 SPA 页面路由（/kb/ 兜底，放在最后）
        - id: kb-web-spa
          uri: http://kb-web:80
          predicates:
            - Path=${KB_CONTEXT:/kb}/**

      # CORS 跨域
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

# 网关业务配置
kb:
  gateway:
    # 统一上下文路径（与 KB_CONTEXT 环境变量一致）
    context-path: ${KB_CONTEXT:/kb}
    # 模块健康探针（GET ${KB_CONTEXT}/api/system/modules）
    # 期望集来自 classpath:module-manifest.json，由 `python3 mykng/gen-registry.py`
    # 从 mykng/module-registry.yml 派生。改模块名请改注册表并跑生成器，不要改 Java。
    modules:
      # 单模块 Nacos 探活超时（毫秒）；超时按 UNKNOWN 处理，前端视作可用以免误隐藏菜单
      probe-timeout-ms: ${KB_MODULES_PROBE_TIMEOUT_MS:800}
      # 「曾见过实例」的模块名持久化：区分 DOWN（宕机）与 MISSING（从未见过）的判据。
      # 不持久化时网关重启会清零，跨重启的宕机会被误判成 MISSING（ADR §12.11 已知限制）。
      ever-seen:
        # 关掉即退回纯内存模式（重启后又分不清 DOWN/MISSING），仅用于 Redis 故障期应急
        redis-enabled: ${KB_MODULES_EVER_SEEN_REDIS_ENABLED:true}
        redis-key: ${KB_MODULES_EVER_SEEN_REDIS_KEY:kb:gateway:modules:ever-seen}
        ttl-days: ${KB_MODULES_EVER_SEEN_TTL_DAYS:30}
    jwt:
      # 与 auth-center 保持一致的 HMAC-SHA 密钥
      secret: YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!
      header: Authorization
    # 鉴权白名单（使用 KB_CONTEXT 变量）
    whitelist:
      - ${KB_CONTEXT:/kb}/api/auth/login
      - ${KB_CONTEXT:/kb}/api/auth/refresh
      # auth-center 邮箱验证码/忘记密码（2026-09-07 M7）：必须匿名可达，否则用户无法自助重置
      - ${KB_CONTEXT:/kb}/api/auth/forgot-password
      - ${KB_CONTEXT:/kb}/api/auth/reset-password
      - ${KB_CONTEXT:/kb}/api/auth/error-log/report
      - ${KB_CONTEXT:/kb}/api/share/verify/**
      - ${KB_CONTEXT:/kb}/api/share/detail/**
      # M7-1: 模块健康检查端点公开（前端登录前也需要知道哪些模块可用）
      - ${KB_CONTEXT:/kb}/api/system/modules
      - ${KB_CONTEXT:/kb}/api/system/modules/**
      # M6: Swagger 文档端点公开
      - ${KB_CONTEXT:/kb}/swagger-ui/**
      - ${KB_CONTEXT:/kb}/v3/api-docs/**
      - ${KB_CONTEXT:/kb}/api/*/v3/api-docs/**
      - ${KB_CONTEXT:/kb}/api/*/swagger-ui/**

# auth-center 双验签过渡期（2026-09-07 kb-web OIDC 接入）：
# token 验签顺序 HS256(legacy) → RS256(OIDC)；jwks-uri 走 compose 内网直连（iss 校验仍用公网 issuer）
marschat:
  oidc:
    issuer: ${OIDC_ISSUER:https://auth.marschat.online}
    jwks-uri: ${OIDC_JWKS_URI:http://auth-center:8085/oauth2/jwks}
    # M6: kb.gateway.services 已废弃，路由 uri 改为 lb://服务名 通过 Nacos 服务发现

# M6: springdoc-openapi 网关聚合配置（WebFlux）
# 统一入口：/kb/swagger-ui.html，可切换各模块的 API 文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    config-url: ${KB_CONTEXT:/kb}/v3/api-docs/swagger-config
    urls:
      - name: 认证服务 (auth-center)
        url: ${KB_CONTEXT:/kb}/api/auth/v3/api-docs
      - name: 文件服务 (kb-file)
        url: ${KB_CONTEXT:/kb}/api/file/v3/api-docs
      - name: 知识库服务 (kb-knowledge)
        url: ${KB_CONTEXT:/kb}/api/knowledge/v3/api-docs
      - name: 知识引擎 (kb-intelligence)
        url: ${KB_CONTEXT:/kb}/api/intelligence/v3/api-docs
  api-docs:
    path: ${KB_CONTEXT:/kb}/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.kb.gateway: debug
    org.springframework.cloud.gateway: info
