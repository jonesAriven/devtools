# 生产 / Docker 环境：下游服务以容器服务名寻址
kb:
  gateway:
    jwt:
      # 生产环境建议通过环境变量 JWT_SECRET 注入，此处仅作兜底默认值
      secret: ${JWT_SECRET:YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!}
    services:
      auth: ${KB_AUTH_HOST:kb-auth:8081}
      file: ${KB_FILE_HOST:kb-file:8082}
      knowledge: ${KB_KNOWLEDGE_HOST:kb-knowledge:8083}
      ops: ${KB_OPS_HOST:kb-ops:8084}

logging:
  level:
    com.kb.gateway: info
    org.springframework.cloud.gateway: warn
