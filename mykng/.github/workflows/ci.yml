# ============================================================
# mykng 知识库微服务 - GitHub Actions CI 流水线
# ============================================================
# 触发：push to main/develop, pull_request
# Jobs: lint → unit-test → integration-test → mutation-test → build → sonar
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Xmx2048m -Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn'
  NEXUS_URL: 'https://nexus.marschat.online/repository/maven-public/'

jobs:

  # ------------------------------------------------------------
  # 1. Lint - 代码规范检查（Checkstyle + SpotBugs）
  # ------------------------------------------------------------
  lint:
    name: Lint / Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: .m2/repository
          key: ${{ runner.os }}-maven-lint-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-lint-
            ${{ runner.os }}-maven-

      - name: Generate Maven settings.xml (Nexus)
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          mkdir -p .m2
          cat > .m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus-public</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_PASS}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>nexus-public</id>
                <mirrorOf>*</mirrorOf>
                <url>${NEXUS_URL}</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      - name: Run Checkstyle & SpotBugs
        run: cd kb-parent && mvn -B -ntp -s ../.m2/settings.xml checkstyle:check spotbugs:check -Pskip-tests || true

  # ------------------------------------------------------------
  # 2. Unit Test - JUnit5 单元测试 + JaCoCo 覆盖率
  # ------------------------------------------------------------
  unit-test:
    name: Unit Test (JUnit5 + JaCoCo)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: .m2/repository
          key: ${{ runner.os }}-maven-unit-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-unit-
            ${{ runner.os }}-maven-

      - name: Generate Maven settings.xml (Nexus)
        run: |
          mkdir -p .m2
          cat > .m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus-public</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_PASS}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>nexus-public</id>
                <mirrorOf>*</mirrorOf>
                <url>${NEXUS_URL}</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}

      - name: Run Unit Tests (Surefire + JaCoCo)
        run: |
          cd kb-parent && mvn -B -ntp -s ../.m2/settings.xml test \
            -Dtest='*Test,!*IntegrationTest,!*ApplicationTests,!*IT' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dsurefire.reportsDir=../test-output/unit/java/surefire-reports \
            -Djacoco.reportDir=../test-output/unit/java/jacoco

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            test-output/unit/java/
            **/target/site/jacoco/
          retention-days: 14

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: 'test-output/unit/java/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

  # ------------------------------------------------------------
  # 3. Integration Test - Spring Boot Test (*IT.java)
  # ------------------------------------------------------------
  integration-test:
    name: Integration Test (Failsafe)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: .m2/repository
          key: ${{ runner.os }}-maven-it-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-it-
            ${{ runner.os }}-maven-

      - name: Generate Maven settings.xml (Nexus)
        run: |
          mkdir -p .m2
          cat > .m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus-public</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_PASS}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>nexus-public</id>
                <mirrorOf>*</mirrorOf>
                <url>${NEXUS_URL}</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}

      - name: Run Integration Tests (Failsafe)
        run: |
          cd kb-parent && mvn -B -ntp -s ../.m2/settings.xml \
            failsafe:integration-test failsafe:verify \
            -Dit.test='*IT,*IntegrationTest' \
            -DskipITs=false \
            -Dfailsafe.reportsDir=../test-output/integration/java/failsafe-reports

      - name: Upload Integration Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: test-output/integration/java/
          retention-days: 14

  # ------------------------------------------------------------
  # 4. Mutation Test - PITest（仅 main 分支）
  # ------------------------------------------------------------
  mutation-test:
    name: Mutation Test (PITest)
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: .m2/repository
          key: ${{ runner.os }}-maven-mut-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-mut-
            ${{ runner.os }}-maven-

      - name: Generate Maven settings.xml (Nexus)
        run: |
          mkdir -p .m2
          cat > .m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus-public</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_PASS}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>nexus-public</id>
                <mirrorOf>*</mirrorOf>
                <url>${NEXUS_URL}</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}

      - name: Run PITest Mutation Testing
        run: |
          cd kb-parent && mvn -B -ntp -s ../.m2/settings.xml verify \
            -DskipTests=false \
            -Dtest='*Test,!*IntegrationTest,!*ApplicationTests,!*IT' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dpit.reportDir=../test-output/mutation \
            -Dpit.output-formats=XML,HTML

      - name: Upload Mutation Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-test-reports
          path: test-output/mutation/
          retention-days: 14

  # ------------------------------------------------------------
  # 5. Build - 构建 Docker 镜像
  # ------------------------------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Images
        run: docker compose -p kb-deploy build

      - name: Save Docker Images
        run: |
          mkdir -p docker-images
          for svc in kb-gateway kb-auth kb-file kb-knowledge kb-ops kb-intelligence; do
            docker image save kb-deploy-$svc:latest -o docker-images/$svc.tar || true
          done

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images/
          retention-days: 3

  # ------------------------------------------------------------
  # 6. Sonar - SonarQube 静态扫描
  # ------------------------------------------------------------
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube 需要完整历史用于 blame

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: .m2/repository
          key: ${{ runner.os }}-maven-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-sonar-
            ${{ runner.os }}-maven-

      - name: Generate Maven settings.xml (Nexus)
        run: |
          mkdir -p .m2
          cat > .m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus-public</id>
                <username>${NEXUS_USER}</username>
                <password>${NEXUS_PASS}</password>
              </server>
            </servers>
            <mirrors>
              <mirror>
                <id>nexus-public</id>
                <mirrorOf>*</mirrorOf>
                <url>${NEXUS_URL}</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}

      - name: SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd kb-parent && mvn -B -ntp -s ../.m2/settings.xml sonar:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=mykng \
            -Dsonar.branch.name=${{ github.ref_name }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=../test-output/unit/java/jacoco/jacoco.xml
