# ============================================================
# mykng Nginx 配置
# ============================================================
# 部署到: /etc/nginx/sites-available/kb.marschat.online
# 软链接: ln -s /etc/nginx/sites-available/kb.marschat.online /etc/nginx/sites-enabled/
# 重载: nginx -t && nginx -s reload
#
# ⚠️ 统一上下文路径：下面的 /kb 必须与以下配置保持一致：
#   - 前端 .env 的 VITE_CONTEXT_PATH
#   - 网关 KB_CONTEXT 环境变量
# 改上下文路径时，执行: sed -i 's|/kb|/新路径|g' 本文件
# ============================================================

# 上游服务 - 网关
upstream kb_gateway {
    server 127.0.0.1:8090;
    keepalive 32;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name kb.marschat.online;
    return 301 https://$host$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name kb.marschat.online;

    # SSL 证书（使用通配证书）
    ssl_certificate     /etc/nginx/ssl/marschat.online.crt;
    ssl_certificate_key /etc/nginx/ssl/marschat.online.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # 上传文件大小限制（支持大文件分片上传）
    client_max_body_size 100m;

    # 前端静态资源
    location / {
        root /data/kb-web;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API 反向代理到网关
    location /kb/ {
        proxy_pass http://kb_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # WebSocket 支持（如果后续需要）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（文件上传/解析需要较长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # MinIO 控制台（可选，限制 IP）
    location /minio/ {
        # allow 192.168.31.0/24;  # 仅允许内网访问
        # deny all;
        proxy_pass http://127.0.0.1:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
