# ============================================================
# mykng Nginx 配置 - HTTP 模式（SSL在腾讯云2号终结）
# ============================================================
# 部署到: /etc/nginx/sites-available/kb.marschat.online
# 目录结构: /data/kb-web/
#   - index.html          (SPA 入口)
#   - kb/index.html       (root 映射副本，使 /kb/ 路径生效)
#   - assets/             (Vite 构建的静态资源)
#
# 路径规则:
#   /kb/api/*  → 反代到 Gateway (127.0.0.1:8090)
#   /kb/s/*    → 前端静态资源 (alias)
#   /kb/*      → 前端 SPA 路由 (error_page 404 → index.html)
# ============================================================

server {
    listen 80;
    server_name kb.marschat.online 192.168.31.105 100.93.36.113 localhost;

    client_max_body_size 100m;

    # API 反向代理到网关
    location /kb/api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 前端静态资源（vite base: /kb/s/ → alias 到 /data/kb-web/）
    location /kb/s/ {
        alias /data/kb-web/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 前端 SPA 路由 - 使用 root + error_page 404 避免重定向循环
    location /kb/ {
        root /data/kb-web;
        index index.html;
        error_page 404 =200 /kb/index.html;
    }

    # 根路径跳转到 /kb/
    location = / {
        return 301 /kb/;
    }

    # MinIO 控制台
    location /minio/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
