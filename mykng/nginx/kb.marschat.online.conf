# ============================================================
# mykng 本地 Nginx 配置 - HTTP 模式（SSL在腾讯云2号终结）
# ============================================================
# 部署到: /etc/nginx/sites-available/kb.marschat.online
# 软链到: /etc/nginx/sites-enabled/kb.marschat.online
#
# 职责:
#   - 静态资源服务（/data/kb-web/）
#   - API反向代理到 kb-gateway（127.0.0.1:8090）
#   - SPA 路由回退
#   - MinIO 控制台反代
#
# 目录结构: /data/kb-web/
#   - index.html          (SPA 入口)
#   - kb/index.html       (root 映射副本，使 /kb/ 路径生效)
#   - assets/             (Vite 构建的静态资源，带 hash 长缓存)
#
# 路径规则:
#   /kb/api/*  → 反代到 Gateway (127.0.0.1:8090)
#   /kb/s/*    → 前端静态资源 (alias 到 /data/kb-web/)
#   /kb/*      → 前端 SPA 路由 (error_page 404 → index.html)
#   /minio/    → MinIO 控制台 (127.0.0.1:9001)
#   /health    → 健康检查端点
# ============================================================

# ---------- http 上下文指令（本文件被 include 到 http 块内） ----------

# 限流 Zone：按客户端 IP 限制 API 请求速率
# 10m 共享内存约可存 16 万个 IP 地址，10r/s + burst 20 应对正常突发
limit_req_zone $binary_remote_addr zone=kb_api_limit:10m rate=10r/s;

# traceId 透传：优先使用腾讯云2号传入的 X-Trace-Id，无则用 nginx $request_id
# 保证公网→腾讯云→本地Nginx→网关 全链路 traceId 一致
map $http_x_trace_id $kb_trace_id {
    default $http_x_trace_id;
    ""      $request_id;
}

# 日志格式（含 traceId，与后端 [traceId] 日志对齐，支持跨服务链路追踪）
log_format kb_main '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'urt="$upstream_response_time" trace_id="$kb_trace_id"';

# ---------- server 块 ----------

server {
    listen 80;
    server_name kb.marschat.online 192.168.31.105 100.93.36.113 localhost;

    # 日志（使用含 traceId 的自定义格式）
    access_log /var/log/nginx/kb-access.log kb_main;
    error_log  /var/log/nginx/kb-error.log;

    # 上传体积
    client_max_body_size 100m;

    # ---------- 安全响应头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---------- 路径重定向 ----------
    # 根路径跳转到 /kb/
    location = / {
        return 301 /kb/;
    }

    # /kb 不带斜杠时重定向到 /kb/
    location = /kb {
        return 301 /kb/;
    }

    # ---------- API 反向代理 ----------
    # /kb/api/* → kb-gateway (127.0.0.1:8090)
    location /kb/api/ {
        # 限流：每秒 10 请求，突发 20，超出立即返回 503
        limit_req zone=kb_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id        $kb_trace_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 前端静态资源 ----------
    # /kb/s/* → alias 到 /data/kb-web/（Vite base: /kb/s/）
    location /kb/s/ {
        alias /data/kb-web/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 前端 SPA 路由 ----------
    # /kb/* → root /data/kb-web，404 回退到 index.html（避免重定向循环）
    location /kb/ {
        root /data/kb-web;
        index index.html;
        error_page 404 =200 /kb/index.html;
    }

    # ---------- MinIO 控制台 ----------
    location /minio/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- 健康检查 ----------
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
