# ============================================================
# 默认 Nginx 配置（Docker 部署模板）
# ============================================================
# 适用场景: docker/nginx/conf.d/default.conf
# 职责: 基础反向代理配置模板，可直接用于容器化 Nginx
#
# 说明:
#   - 本文件为通用模板，mykng 双层架构下优先使用专用配置:
#     - nginx/kb.marschat.online.conf          (mykng本地: 静态资源+API反代)
#     - nginx/kb.marschat.online.tencent.conf   (腾讯云2号: SSL终结+纯反代)
#   - 本模板适用于独立容器化部署或本地开发场景
# ============================================================

server {
    listen 80 default_server;
    server_name _;

    # 上传体积
    client_max_body_size 100m;

    # 健康检查
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # API 反向代理模板（按需修改 upstream 地址）
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 静态资源 + SPA 路由回退
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
