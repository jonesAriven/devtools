# ============================================================
# 腾讯云2号 Nginx 配置 - SSL 终结 + 纯反向代理（不部署前端）
# ============================================================
# 部署到: /etc/nginx/sites-available/kb.marschat.online
# 职责:
#   1. SSL 证书终结（Let's Encrypt）
#   2. 纯反向代理，将所有请求转发到 mykng-debian（Tailscale: 100.93.36.113）
#   3. 不存储任何前端静态文件
#
# 架构链路:
#   用户 → 腾讯云2号(:443) → Tailscale → mykng Nginx(:80) → 各服务
#
# 重要: 前端文件部署在 mykng 本地 /data/kb-web/，腾讯云2号不放任何静态资源
# ============================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name kb.marschat.online;
    return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name kb.marschat.online;

    # SSL 证书（Let's Encrypt certbot 自动管理）
    ssl_certificate     /etc/letsencrypt/live/kb.marschat.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.marschat.online/privkey.pem;

    # SSL 安全参数
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;

    # 所有 /kb/ 路径代理到 mykng 本地 Nginx（含 API、静态资源、SPA 路由）
    location /kb/ {
        proxy_pass http://100.93.36.113/kb/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # MinIO 控制台（可选，如需公网访问）
    location /minio/ {
        proxy_pass http://100.93.36.113/minio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 根路径跳转到 /kb/
    location = / {
        return 301 /kb/;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 '{"status":"ok","proxy":"tencent-cloud-2"}';
        add_header Content-Type application/json;
    }
}
