# ============================================================
# 腾讯云2号 Nginx 配置 - SSL终结 + 纯反向代理
# ============================================================
# 部署到: /etc/nginx/sites-available/kb（腾讯云2号 1.117.70.30）
# 软链到: /etc/nginx/sites-enabled/kb
#
# 职责:
#   - SSL 终结（HTTPS → HTTP）
#   - 纯反向代理到 mykng 本地 Nginx（Tailscale: 100.93.36.113:80）
#   - 不存储任何静态文件
#   - 生成 traceId（$request_id）透传给后端全链路
#
# 证书说明:
#   目标路径: /etc/letsencrypt/live/kb.marschat.online/
#   当前过渡: 复用 nexus.marschat.online 证书（SAN 含 nexus + tools）
#             kb.marschat.online 未备案，浏览器会有 SNI 警告
#             建议后续用 DNS-01 申请独立证书（见 nginx/ssl/README.md）
# ============================================================

# ---------- HTTP → HTTPS 跳转 ----------
server {
    listen 80;
    server_name kb.marschat.online;

    # ACME HTTP-01 续期验证（DNS-01 模式可忽略，保留以备切换）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余全部 301 跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 反向代理 ----------
server {
    listen 443 ssl http2;
    server_name kb.marschat.online;

    # ---------- SSL 证书 ----------
    # 目标：kb.marschat.online 独立证书（DNS-01 申请，见 nginx/ssl/README.md）
    ssl_certificate     /etc/letsencrypt/live/kb.marschat.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.marschat.online/privkey.pem;

    # 过渡期临时切回 nexus 证书（kb 独立证书未就绪时取消下面两行注释，并注释上面两行）:
    # ssl_certificate     /etc/letsencrypt/live/nexus.marschat.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nexus.marschat.online/privkey.pem;

    # ---------- SSL 协议与加密套件 ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP 装订（加速证书验证，减少客户端握手延迟）
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------- 安全头 ----------
    # HSTS（强制 HTTPS，1年，含子域名）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 日志 ----------
    access_log /var/log/nginx/kb-access.log;
    error_log  /var/log/nginx/kb-error.log;

    # 上传体积（边缘层放宽，本地层再限制）
    client_max_body_size 200m;

    # ---------- 路径重定向 ----------
    location = /kb {
        return 302 /kb/;
    }

    location = / {
        return 302 /kb/;
    }

    # ---------- API 反代 → mykng 本地 Nginx ----------
    # /kb/api/* → http://100.93.36.113/kb/api/（Tailscale 直连，延迟 < 1ms）
    location /kb/api/ {
        proxy_pass http://100.93.36.113/kb/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id        $request_id;
        proxy_set_header Connection        "";

        # 边缘到本地走 Tailscale，连接超时短；API 读写超时放宽
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 其余 /kb/ 路径 → mykng 本地 Nginx ----------
    # 静态资源 + SPA 路由均由本地 Nginx 处理，腾讯云2号不存任何文件
    location /kb/ {
        proxy_pass http://100.93.36.113/kb/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
