# ============================================================
# mykng 知识库微服务 - SonarQube 配置
# ============================================================
# 质量门禁：
#   - 覆盖率 ≥ 70%
#   - 重复率 < 3%
#   - 0 Blocker
#   - 0 Critical
# ============================================================

sonar.projectKey=mykng
sonar.projectName=mykng 知识库
sonar.projectVersion=1.0.0
sonar.organization=mykng

# 源代码目录（5 个微服务 + kb-common 公共模块）
sonar.sources=kb-auth,kb-file,kb-knowledge,kb-gateway,kb-intelligence,kb-common

# 测试目录
sonar.tests=**/src/test

# 编译产物
sonar.java.binaries=**/target/classes
sonar.java.libraries=**/target/dependency/*.jar

# JaCoCo 覆盖率报告
sonar.coverage.jacoco.xmlReportPaths=test-output/unit/java/jacoco/jacoco.xml

# PITest 变异测试报告（可选）
sonar.coverage.exclusions=**/src/test/**,**/generated/**

# 排除项
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/.vite/**,**/src/test/**,**/*Application.java,**/config/**,**/dto/**

# 重复率检测
sonar.cpd.exclusions=**/dto/**,**/entity/**,**/mapper/**,**/src/test/**

# Java 配置
sonar.java.source=21
sonar.java.target=21
sonar.sourceEncoding=UTF-8

# SCM 配置（用于 blame 信息）
sonar.scm.enabled=true
sonar.scm.provider=git

# 质量门禁（通过 Web API 在 SonarQube 中配置：
#   Coverage < 70% => FAIL
#   Duplicated Lines Density > 3% => FAIL
#   Blocker Issues > 0 => FAIL
#   Critical Issues > 0 => FAIL
# ）
