# kb.marschat.online - 纯反代模式（前端不部署在腾讯云2号）
# 所有请求反代到 mykng-debain (100.93.36.113)
# SSL 证书复用 nexus.marschat.online
server {
    listen 80;
    server_name kb.marschat.online;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name kb.marschat.online;

    ssl_certificate /etc/letsencrypt/live/nexus.marschat.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.marschat.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kb-access.log;
    error_log  /var/log/nginx/kb-error.log;
    client_max_body_size 200m;

    # 所有 /kb/ 请求统一反代到 mykng
    location /kb/ {
        proxy_pass http://100.93.36.113;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /kb {
        return 302 /kb/;
    }

    location = / {
        return 302 /kb/;
    }
}
