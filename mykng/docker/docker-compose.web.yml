# ============================================================
# docker-compose.web.yml — 前端容器层
# ============================================================
# 服务: kb-web, kb-ops-web, infra-monitor-web (均为 Nginx 静态服务)
# 网络: kb-web-net
# 前置: 无 (前端容器独立运行, 通过 Nginx 反代后端)
#
# 隔离性:
#   - 前端容器不依赖后端, 可独立启动
#   - 后端不可用时显示 502, 不影响容器运行
# ============================================================

services:
  # ========== kb-web 知识库前端 ==========
  kb-web:
    image: nginx:alpine
    container_name: kb-web
    restart: on-failure:5
    ports:
      - "8091:80"
    volumes:
      - ${DEPLOY_BASE:-/root/kb-deploy}/kb-web/dist:/usr/share/nginx/html:ro
      - ${DEPLOY_BASE:-/root/kb-deploy}/kb-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai
    networks:
      - kb-web-net
    mem_limit: 64m

  # ========== kb-ops-web 运维平台前端 ==========
  kb-ops-web:
    image: nginx:alpine
    container_name: kb-ops-web
    restart: on-failure:5
    ports:
      - "8093:80"
    volumes:
      - ${DEPLOY_BASE:-/root/kb-deploy}/kb-ops-web/dist:/usr/share/nginx/html:ro
      - ${DEPLOY_BASE:-/root/kb-deploy}/kb-ops-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai
    networks:
      - kb-web-net
    mem_limit: 64m

  # ========== infra-monitor-web 监控前端 ==========
  infra-monitor-web:
    image: nginx:alpine
    container_name: infra-monitor-web
    restart: on-failure:5
    ports:
      - "8094:80"
    volumes:
      - ${DEPLOY_BASE:-/root/kb-deploy}/infra-monitor-web/dist:/usr/share/nginx/html:ro
      - ${DEPLOY_BASE:-/root/kb-deploy}/infra-monitor-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai
    networks:
      - kb-web-net
    mem_limit: 64m

# ========== 网络 ==========
networks:
  kb-web-net:
    name: kb-web-net
    driver: bridge
