# ============================================================
# mykng 容器化 Nginx 反向代理配置（Docker 部署模板）
# ============================================================
# 适用场景: docker/nginx/conf.d/default.conf
# 职责:
#   - 静态资源服务（前端 SPA）
#   - API 反向代理到各微服务（通过 kb-gateway 统一入口）
#   - SPA 路由回退
#   - MinIO 控制台反代
#
# 参考: nginx/kb.marschat.online.conf（宿主机部署版本）
#
# 部署方式:
#   将本文件挂载到 nginx 容器的 /etc/nginx/conf.d/default.conf
#   前端静态资源挂载到 /usr/share/nginx/html
# ============================================================

# 限流 Zone：按客户端 IP 限制 API 请求速率
limit_req_zone $binary_remote_addr zone=kb_api_limit:10m rate=10r/s;

# traceId 透传：优先使用上游传入的 X-Trace-Id，无则用 nginx $request_id
map $http_x_trace_id $kb_trace_id {
    default $http_x_trace_id;
    ""      $request_id;
}

# 日志格式（含 traceId，与后端日志对齐，支持跨服务链路追踪）
log_format kb_main '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'urt="$upstream_response_time" trace_id="$kb_trace_id"';

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/kb-access.log kb_main;
    error_log  /var/log/nginx/kb-error.log;

    # 上传体积
    client_max_body_size 100m;

    # ---------- 安全响应头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---------- 路径重定向 ----------
    location = / {
        return 301 /kb/;
    }
    location = /kb {
        return 301 /kb/;
    }

    # ---------- API 反向代理 ----------
    # /kb/api/* → kb-gateway (容器内网 kb-gateway:8080)
    location /kb/api/ {
        limit_req zone=kb_api_limit burst=20 nodelay;

        proxy_pass http://kb-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id        $kb_trace_id;
        proxy_set_header Connection        "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- 前端静态资源 ----------
    # /kb/s/* → alias 到前端构建产物（Vite base: /kb/s/）
    location /kb/s/ {
        alias /usr/share/nginx/html/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 前端 SPA 路由 ----------
    location /kb/ {
        root /usr/share/nginx/html;
        index index.html;
        error_page 404 =200 /kb/index.html;
    }

    # ---------- MinIO 控制台 ----------
    location /minio/ {
        proxy_pass http://kb-minio:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- 健康检查 ----------
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
