# ============================================================
# docker-compose.app.yml — 应用层 (mykng 5微服务 + kb-ops)
# ============================================================
# 服务: kb-gateway, auth-center, kb-file, kb-knowledge, kb-intelligence, kb-ops
# 网络: kb-app-net (内部通信), platform-net (外部引入, 连接全局基础设施)
# 前置: platform 基础设施层已启动 (platform-net 网络存在)
#
# 隔离性:
#   - 无 depends_on, 每个服务可独立部署
#   - mykng 部署: up -d --force-recreate kb-gateway kb-file kb-knowledge kb-intelligence
#   - auth-center 部署: 独立流水线（auth-center 仓库 .woodpecker.yml），只重建它自己
#   - kb-ops 部署: up -d --force-recreate kb-ops
#   - 互不影响
# ============================================================

services:
  # ========== API 网关 ==========
  kb-gateway:
    build: /root/devtools/mykng/kb-gateway
    container_name: kb-gateway
    restart: on-failure:5
    ports:
      - "8090:8080"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JWT_SECRET=${JWT_SECRET:-YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!}
      # 模块探活 everSeen 持久化（非主链路：连不上自动退回纯内存）
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== 认证服务 ==========
  auth-center:
    # 2026-09-07 剥离独立仓库：真源 gitee/github jonesAriven/auth-center
    # 2026-09-11 起走 auth-center 自己的 Woodpecker 流水线（仓库内 .woodpecker.yml）：
    #   CI 构建 auth-center-latest.tar.gz -> 解压到 /mnt/shared/auth-center-build -> 本文件 build 此目录。
    #   服务器不再需要 /root/auth-center git 克隆与本地 mvn。
    build: /mnt/shared/auth-center-build
    container_name: auth-center
    restart: on-failure:5
    ports:
      - "8085:8085"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JWT_SECRET=${JWT_SECRET:-YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!}
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=kb_auth
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      # auth-center Phase 1: OIDC issuer（浏览器/客户端实际可达的认证中心地址；2026-09-07 L019 独立子域）
      - AUTH_ISSUER=${AUTH_ISSUER:-https://auth.marschat.online}
      # 邮件（忘记密码/邮箱验证码，2026-09-07 M7）：凭证走服务器 .env，不入库
      - MAIL_HOST=${MAIL_HOST:-smtp.163.com}
      - MAIL_PORT=${MAIL_PORT:-25}
      - MAIL_USERNAME=${MAIL_USERNAME:-marschat@163.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-marschat@163.com}
      - MAIL_SSL_ENABLE=${MAIL_SSL_ENABLE:-false}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      kb-app-net:
        # 别名兜底：kb-auth 为历史服务名（源码 2026-09-10 已清除），保留此 compose 网络别名
        # 兼容仍写 http://kb-auth:8085 的旧引用（2026-09-10 拍板保留）
        aliases:
          - kb-auth
      platform-net:
        aliases:
          - kb-auth
    mem_limit: 384m

  # ========== 文件服务 ==========
  kb-file:
    build: /root/devtools/mykng/kb-file
    container_name: kb-file
    restart: on-failure:5
    ports:
      - "8089:8089"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://platform-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== 知识库服务 ==========
  kb-knowledge:
    build: /root/devtools/mykng/kb-knowledge
    container_name: kb-knowledge
    restart: on-failure:5
    ports:
      - "8092:8092"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - MONGO_HOST=platform-mongo
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_ROOT_USER:-kb}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD:-kb123456}
      - MEILI_HOST=http://platform-meilisearch:7700
      - MEILI_KEY=${MEILI_KEY:-kbMeiliKey2026!!Secure}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== 知识引擎服务 ==========
  kb-intelligence:
    build: /root/devtools/mykng/kb-intelligence
    container_name: kb-intelligence
    restart: on-failure:5
    ports:
      - "8086:8086"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx512m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - MONGO_HOST=platform-mongo
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_ROOT_USER:-kb}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD:-kb123456}
      - MEILI_HOST=http://platform-meilisearch:7700
      - MEILI_KEY=${MEILI_KEY:-kbMeiliKey2026!!Secure}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 640m

  # ========== 运维平台 (独立部署, 不影响其他服务) ==========
  kb-ops:
    build: /root/devtools/kb-ops
    container_name: kb-ops
    restart: on-failure:5
    ports:
      - "8084:8084"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=kb_ops
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - CRYPTO_AES_KEY=${CRYPTO_AES_KEY:-YWVzLTI1Ni1nY20ta2V5LTMyLWJ5dGVzISE=}
      - KB_GATEWAY_URL=http://kb-gateway:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== Portal 门户后端 (独立部署) ==========
  portal-server:
    build: /root/devtools/portal/portal-server
    container_name: portal-server
    restart: on-failure:5
    ports:
      - "8087:8087"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=tools
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      # auth-center Phase 2: OIDC issuer（浏览器/客户端实际可达地址，与 auth-center AUTH_ISSUER 一致；2026-09-07 L019 独立子域）
      - AUTH_CENTER_ISSUER=${AUTH_CENTER_ISSUER:-https://auth.marschat.online}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

# ========== 网络 ==========
networks:
  kb-app-net:
    name: kb-app-net
    driver: bridge
  platform-net:
    external: true
    name: platform-net
