# ============================================================
# docker-compose.app.yml — 应用层 (mykng 5微服务 + kb-ops)
# ============================================================
# 服务: kb-gateway, kb-auth, kb-file, kb-knowledge, kb-intelligence, kb-ops
# 网络: kb-app-net (内部通信), platform-net (外部引入, 连接全局基础设施)
# 前置: platform 基础设施层已启动 (platform-net 网络存在)
#
# 隔离性:
#   - 无 depends_on, 每个服务可独立部署
#   - mykng 部署: up -d --force-recreate kb-gateway kb-auth kb-file kb-knowledge kb-intelligence
#   - kb-ops 部署: up -d --force-recreate kb-ops
#   - 互不影响
# ============================================================

services:
  # ========== API 网关 ==========
  kb-gateway:
    build: /root/devtools/mykng/kb-gateway
    container_name: kb-gateway
    restart: on-failure:5
    ports:
      - "8090:8080"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JWT_SECRET=${JWT_SECRET:-YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== 认证服务 ==========
  kb-auth:
    build: /root/devtools/mykng/kb-auth
    container_name: kb-auth
    restart: on-failure:5
    ports:
      - "8085:8085"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JWT_SECRET=${JWT_SECRET:-YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!}
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=kb_auth
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== 文件服务 ==========
  kb-file:
    build: /root/devtools/mykng/kb-file
    container_name: kb-file
    restart: on-failure:5
    ports:
      - "8089:8089"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://platform-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== 知识库服务 ==========
  kb-knowledge:
    build: /root/devtools/mykng/kb-knowledge
    container_name: kb-knowledge
    restart: on-failure:5
    ports:
      - "8092:8092"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - MONGO_HOST=platform-mongo
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_ROOT_USER:-kb}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD:-kb123456}
      - MEILI_HOST=platform-meilisearch
      - MEILI_PORT=7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-kbMeiliKey2026!!Secure}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== 知识引擎服务 ==========
  kb-intelligence:
    build: /root/devtools/mykng/kb-intelligence
    container_name: kb-intelligence
    restart: on-failure:5
    ports:
      - "8086:8086"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms128m -Xmx512m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - MONGO_HOST=platform-mongo
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_ROOT_USER:-kb}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD:-kb123456}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 640m

  # ========== 运维平台 (独立部署, 不影响其他服务) ==========
  kb-ops:
    build: /root/devtools/kb-ops
    container_name: kb-ops
    restart: on-failure:5
    ports:
      - "8084:8084"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - SPRING_DATASOURCE_URL=jdbc:mysql://platform-mysql:3306/kb_ops?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - CRYPTO_AES_KEY=${CRYPTO_AES_KEY:-YWVzLTI1Ni1nY20ta2V5LTMyLWJ5dGVzISE=}
      - KB_GATEWAY_URL=http://kb-gateway:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

# ========== 网络 ==========
networks:
  kb-app-net:
    name: kb-app-net
    driver: bridge
  platform-net:
    external: true
    name: platform-net
