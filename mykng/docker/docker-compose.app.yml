# ============================================================
# docker-compose.app.yml — 应用层 (mykng 5微服务 + kb-ops)
# ============================================================
# 服务: kb-gateway, auth-center, kb-file, kb-knowledge, kb-intelligence, kb-ops
# 网络: kb-app-net (内部通信), platform-net (外部引入, 连接全局基础设施)
# 前置: platform 基础设施层已启动 (platform-net 网络存在)
#
# 隔离性:
#   - 无 depends_on, 每个服务可独立部署
#   - mykng 部署: up -d --force-recreate kb-gateway kb-file kb-knowledge kb-intelligence
#   - auth-center 部署: 独立流水线（auth-center 仓库 .woodpecker.yml），只重建它自己
#   - kb-ops 部署: up -d --force-recreate kb-ops
#   - 互不影响
# ============================================================

services:
  # ========== API 网关 ==========
  kb-gateway:
    build: /root/devtools/mykng/kb-gateway
    container_name: kb-gateway
    restart: on-failure:5
    ports:
      - "8090:8080"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JWT_SECRET=${JWT_SECRET:-YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!}
      # 模块探活 everSeen 持久化（非主链路：连不上自动退回纯内存）
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      # Phase 4 P-B: kb-gateway 代 kb-web 菜单上报凭据（client=marschat-kbweb）。
      # 值须与 auth-center 侧 sys_app_client.client_secret 一致（clients.yml 的 ${KBWEB_MENU_REPORT_SECRET:默认}）。
      # 走 ${KBWEB_MENU_REPORT_SECRET} 覆盖（.env），缺省回退到与 clients.yml 默认同值的内联默认——
      # 与 kb-ops 的 MARSCHAT_MENU_REPORT_SECRET 分离命名，避免两应用共用同一变量名串值。
      - MARSCHAT_MENU_REPORT_SECRET=${KBWEB_MENU_REPORT_SECRET:-fff08d4f9ca92f27ffb9111d1a9b8ed9e54769c3dc279bf3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== 认证服务 ==========
  auth-center:
    # 2026-09-07 剥离独立仓库：真源 gitee/github jonesAriven/auth-center
    # 2026-09-11 起走 auth-center 自己的 Woodpecker 流水线（仓库内 .woodpecker.yml）：
    #   CI 构建 auth-center-latest.tar.gz -> 解压到 /mnt/shared/auth-center-build -> 本文件 build 此目录。
    #   服务器不再需要 /root/auth-center git 克隆与本地 mvn。
    build: /mnt/shared/auth-center-build
    container_name: auth-center
    restart: on-failure:5
    # 2026-09-13 OOM 事故：387MB rss 被 cgroup kill——显式上限并放宽（Xmx512m/limit 768m）
    mem_limit: 768m
    ports:
      - "8085:8085"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx512m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JWT_SECRET=${JWT_SECRET:-YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!}
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=marschat_auth
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      # auth-center Phase 1: OIDC issuer（浏览器/客户端实际可达的认证中心地址；2026-09-07 L019 独立子域）
      - AUTH_ISSUER=${AUTH_ISSUER:-https://auth.marschat.online}
      # 邮件（忘记密码/邮箱验证码，2026-09-07 M7）：凭证走服务器 .env，不入库
      - MAIL_HOST=${MAIL_HOST:-smtp.163.com}
      - MAIL_PORT=${MAIL_PORT:-25}
      - MAIL_USERNAME=${MAIL_USERNAME:-marschat@163.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-marschat@163.com}
      - MAIL_SSL_ENABLE=${MAIL_SSL_ENABLE:-false}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-false}
      # ── §35 Phase 10 授权默认策略（默认最小权限）──────────────────────────────
      # 背景（实测）：改造前 PermissionService.ensureDefaultGrants 为把 configured 刷成 true，
      #   把应用「全部 menu 权限点」绑给平台 user 角色 → 平台普通用户(role_id=8)持有 36 条权限
      #   （cosmic 8/8 + kbweb 15/15 + inframon 6/6 + portal 2/2 全量 menu + kbops 4 menu
      #    + api hosts:create 创建主机写权限），而平台管理员(role_id=1) 0 条 —— 配置完全倒挂。
      #   见 ADR-2026-09-10 §35.2。
      #
      # strict：平台 user/admin、应用 user 角色**只持有 public 菜单**（应用在 menu-registry.yml
      #         标 `public: true` 的「已登录即可见」项，如工作台/看板）；其余 menu 与**所有 api**
      #         必须由应用角色显式授权。api=动作，任何模式下都不自动授予。
      # legacy：恢复改造前「默认全量菜单」行为（一键回滚用，幂等、可逆）。
      #
      # 灰度（良哥拍板「portal 先试点」）：全局 legacy + strict-clients 列出应用 → 该应用单独走 strict。
      #   试点验证通过后，把 MARSCHAT_AUTHZ_MODE 改 strict（或把 5 个应用都加进 strict-clients）。
      # ⚠️ 切到 strict 前必须先让应用上报 public 菜单，否则普通用户登录后菜单全空。
      # 运维端点（Bearer 超管）：GET /admin/authz/policy（当前模式与各应用生效模式）
      #   / GET /admin/authz/impact?client=x&mode=strict（影响面预演，只读）
      #   / POST /admin/authz/migrate?client=x[&force=true]（立即收敛）
      #   / POST /admin/authz/restore-legacy?client=x（一键回滚）。
      - MARSCHAT_AUTHZ_MODE=${MARSCHAT_AUTHZ_MODE:-legacy}
      - MARSCHAT_AUTHZ_STRICT_CLIENTS=${MARSCHAT_AUTHZ_STRICT_CLIENTS:-marschat-portal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      kb-app-net:
        # 别名兜底：kb-auth 为历史服务名（源码 2026-09-10 已清除），保留此 compose 网络别名
        # 兼容仍写 http://kb-auth:8085 的旧引用（2026-09-10 拍板保留）
        aliases:
          - kb-auth
      platform-net:
        aliases:
          - kb-auth

  # ========== 文件服务 ==========
  kb-file:
    build: /root/devtools/mykng/kb-file
    container_name: kb-file
    restart: on-failure:5
    ports:
      - "8089:8089"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://platform-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== 知识库服务 ==========
  kb-knowledge:
    build: /root/devtools/mykng/kb-knowledge
    container_name: kb-knowledge
    restart: on-failure:5
    ports:
      - "8092:8092"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - MONGO_HOST=platform-mongo
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_ROOT_USER:-kb}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD:-kb123456}
      - MEILI_HOST=http://platform-meilisearch:7700
      - MEILI_KEY=${MEILI_KEY:-kbMeiliKey2026!!Secure}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== 知识引擎服务 ==========
  kb-intelligence:
    build: /root/devtools/mykng/kb-intelligence
    container_name: kb-intelligence
    restart: on-failure:5
    ports:
      - "8086:8086"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx512m -XX:+UseG1GC -Dfile.encoding=UTF-8
      - NACOS_HOST=platform-nacos
      - NACOS_PORT=8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - MONGO_HOST=platform-mongo
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_ROOT_USER:-kb}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD:-kb123456}
      - MEILI_HOST=http://platform-meilisearch:7700
      - MEILI_KEY=${MEILI_KEY:-kbMeiliKey2026!!Secure}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 640m

  # ========== 运维平台 (独立部署, 不影响其他服务) ==========
  kb-ops:
    build: /root/devtools/kb-ops
    container_name: kb-ops
    restart: on-failure:5
    ports:
      - "8084:8084"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=kb_ops
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=platform-redis
      - REDIS_PORT=6379
      - CRYPTO_AES_KEY=${CRYPTO_AES_KEY:-YWVzLTI1Ni1nY20ta2V5LTMyLWJ5dGVzISE=}
      # 与 auth-center jwt.secret 同源（HS384 legacy token 验签；RS256 走 jwks 不受此影响）
      - MARSCHAT_AUTH_SECRET=${JWT_SECRET:-YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!}
      # Phase 4 P-B: kb-ops 菜单上报凭据（值在 .env，与 sys_app_client.client_secret 同值）
      - MARSCHAT_MENU_REPORT_SECRET=${MARSCHAT_MENU_REPORT_SECRET}
      - KB_GATEWAY_URL=http://kb-gateway:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

  # ========== Portal 门户后端 (独立部署) ==========
  portal-server:
    build: /root/devtools/portal/portal-server
    container_name: portal-server
    restart: on-failure:5
    ports:
      - "8087:8087"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod,kafka-log
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Dfile.encoding=UTF-8
      # ⚠️ MYSQL_HOST/MYSQL_PORT 已废弃：application-prod.yml 已改为 GR 集群多主机 failover URL
      #   连接串硬编码: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/...
      #   这里的 MYSQL_HOST 仅作为降级 fallback，生产环境不生效
      - MYSQL_HOST=platform-mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=tools
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      # auth-center Phase 2: OIDC issuer（浏览器/客户端实际可达地址，与 auth-center AUTH_ISSUER 一致；2026-09-07 L019 独立子域）
      - AUTH_CENTER_ISSUER=${AUTH_CENTER_ISSUER:-https://auth.marschat.online}
      # Phase 4 P-B: 菜单上报凭据（client=marschat-portal，auth-core MenuRegistryReporter）。
      # 值须与 auth-center 侧 sys_app_client.client_secret 一致；走 ${PORTAL_MENU_REPORT_SECRET} 覆盖，
      # 缺省回退到与库内同值的内联默认。上报失败仅 WARN，不阻断启动。
      - MARSCHAT_MENU_REPORT_SECRET=${PORTAL_MENU_REPORT_SECRET:-880546959a8c2b77bccfd839ed81b10b810f05b346a6a7a9}
      # 🔴 2026-09-15（P0 密钥分离）：portal 自有 HS256 会话密钥，**只从环境变量注入**，
      #    与 infra-monitor 的 JWT_SECRET 是两把各自独立的随机值，绝不共享（此前共用一把，
      #    导致 infra 签发的 token 能被 portal 验过 = 跨应用横向越权）。
      #    Java 侧已删除代码内默认密钥（portal.jwt.secret 无默认值），缺失/过短即启动失败。
      #    运维可用宿主环境变量 PORTAL_JWT_SECRET 覆盖。
      - PORTAL_JWT_SECRET=${PORTAL_JWT_SECRET:-k2SdCe2yGrmVKr2W5dZOydl77jt4Z0NczgJimulUqq3dh0O4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kb-app-net
      - platform-net
    mem_limit: 384m

# ========== 网络 ==========
networks:
  kb-app-net:
    name: kb-app-net
    driver: bridge
  platform-net:
    external: true
    name: platform-net
