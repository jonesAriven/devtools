# ============================================================
# mykng 知识库微服务 - 开发环境 Docker Compose 编排
# ============================================================
# 仅启动基础设施服务（MySQL/MongoDB/MinIO/MeiliSearch/Redis/Nacos），
# 不启动微服务应用，便于本地 IDE 直接运行各微服务进行调试。
#
# 注意:
#   - 生产/部署环境使用 platform/docker-compose.platform.yml
#   - 本文件仅用于本地开发，微服务请在 IDE 中以 dev profile 启动
#
# 启动:  docker compose -f docker/docker-compose.dev.yml up -d
# 停止:  docker compose -f docker/docker-compose.dev.yml down
# 状态:  docker compose -f docker/docker-compose.dev.yml ps
# ============================================================

services:
  # ========== 基础设施 (与 platform/docker-compose.platform.yml 共享命名) ==========

  mysql:
    image: mysql:8.0
    container_name: platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kb123456}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - platform-mysql-data:/var/lib/mysql
      - ../init-sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-kb123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - platform-net
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - platform-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - platform-net

  minio:
    image: minio/minio:latest
    container_name: platform-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - platform-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net
    mem_limit: 512m

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: platform-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-kbMeiliKey2026!!Secure}
      MEILI_ENV: production
    volumes:
      - platform-meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net
    mem_limit: 256m

  mongodb:
    image: mongo:7.0
    container_name: platform-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-kb}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-kb123456}
    volumes:
      - platform-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net
    mem_limit: 512m

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: platform-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 64m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos}
    volumes:
      - platform-nacos-data:/home/nacos/data
      - platform-nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - platform-net
    mem_limit: 384m

# ========== 数据卷 ==========
volumes:
  platform-mysql-data:
    driver: local
  platform-redis-data:
    driver: local
  platform-minio-data:
    driver: local
  platform-meili-data:
    driver: local
  platform-mongo-data:
    driver: local
  platform-nacos-data:
    driver: local
  platform-nacos-logs:
    driver: local

# ========== 网络 ==========
networks:
  platform-net:
    name: platform-net
    driver: bridge
