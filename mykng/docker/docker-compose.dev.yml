# ============================================================
# mykng 知识库微服务 - 开发环境 Docker Compose 编排
# ============================================================
# 仅启动基础设施服务（MySQL/MongoDB/MinIO/MeiliSearch/Redis），
# 不启动微服务应用，便于本地 IDE 直接运行各微服务进行调试。
#
# 注意:
#   - 生产环境使用根目录的 docker-compose.yml（含全部微服务）
#   - 本文件仅用于本地开发，微服务请在 IDE 中以 dev profile 启动
#
# 启动:  docker compose -f docker/docker-compose.dev.yml up -d
# 停止:  docker compose -f docker/docker-compose.dev.yml down
# 状态:  docker compose -f docker/docker-compose.dev.yml ps
# ============================================================

services:
  # ========== 基础设施 ==========

  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kb123456}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - kb-mysql-data:/var/lib/mysql
      - ../init-sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-kb123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kb-net
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kb-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kb-net

  minio:
    image: minio/minio:latest
    container_name: kb-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - kb-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-net
    mem_limit: 512m

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: kb-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-kbMeiliKey2026!!Secure}
      MEILI_ENV: production
    volumes:
      - kb-meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-net
    mem_limit: 256m

  mongodb:
    image: mongo:7.0
    container_name: kb-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-kb}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-kb123456}
    volumes:
      - kb-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-net
    mem_limit: 512m

# ========== 数据卷 ==========
volumes:
  kb-mysql-data:
    driver: local
  kb-redis-data:
    driver: local
  kb-minio-data:
    driver: local
  kb-meili-data:
    driver: local
  kb-mongo-data:
    driver: local

# ========== 网络 ==========
networks:
  kb-net:
    driver: bridge
