server:
  port: 8086

spring:
  datasource:
    # MySQL GR 集群多主 failover（3节点随机负载均衡 + 自动故障转移）
    url: jdbc:mysql://192.168.31.105:3306,192.168.31.182:3307,192.168.31.182:3308/${MYSQL_DATABASE:kb_intelligence}?loadBalanceStrategy=random&loadBalanceHostRemoval=true&failOverReadOnly=false&retriesAllDown=3&connectTimeout=5000&socketTimeout=30000&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:kb123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      keepalive-time: 60000
      connection-timeout: 10000
      connection-test-query: SELECT 1
      validation-timeout: 5000
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:kb}:${MONGO_PASSWORD:kb123456}@${MONGO_HOST:mongodb}:${MONGO_PORT:27017}/${MONGO_DB:kb_intelligence}?authSource=admin
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms

meilisearch:
  host: ${MEILI_HOST:http://meilisearch:7700}
  api-key: ${MEILI_KEY:kbMeiliKey2026!!Secure}

kb:
  intelligence:
    llm:
      enabled: ${LLM_ENABLED:false}
      endpoint: ${LLM_ENDPOINT:}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:qwen-turbo}

logging:
  level:
    com.kb: INFO
    org.springframework: WARN
    org.springframework.data.mongodb: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
