server:
  port: 8082

spring:
  application:
    name: kb-file
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MinIO 配置
minio:
  endpoint: http://192.168.31.182:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: kb-file

# MeiliSearch 配置
meilisearch:
  host: http://192.168.31.182:7700
  api-key: masterKey

# Redis 事件通道
kb:
  event:
    channel: kb:events

logging:
  level:
    com.kb.file: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
