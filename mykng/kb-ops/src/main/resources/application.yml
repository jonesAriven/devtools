server:
  port: 8084

spring:
  application:
    name: kb-ops
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AES-256-GCM 密钥 (Base64, 32字节)。生产环境通过环境变量覆盖。
crypto:
  aes-key: ${CRYPTO_AES_KEY:YWVzLTI1Ni1nY20ta2V5LTMyLWJ5dGVzISE=}

# 服务间调用 (单机部署，直接 HTTP URL)
kb:
  feign:
    auth-url: ${AUTH_URL:http://kb-auth:8081}

logging:
  level:
    com.kb.ops: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
