server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:kb_ops}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:kb123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      keepalive-time: 60000
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms

crypto:
  aes-key: ${CRYPTO_AES_KEY:kbCryptoAesKey2026!!32BytesLong!!}

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong!!}

# Feign 客户端配置
kb:
  auth:
    host: ${KB_AUTH_HOST:http://kb-auth:8081}

logging:
  level:
    com.kb: INFO
    org.springframework: WARN
