# ====================================================================
# mykng 模块与插件注册清单（Single Source of Truth）
# ====================================================================
# 本文件是 mykng 系统的"单一事实来源"：
#   - 所有脚本、CI/CD、网关路由、文档生成器从此文件派生模块信息
#   - 添加/移除模块或插件只需修改此文件，无需遍历 15+ 配置文件
#
# 文件结构：
#   1. global         — 全局配置
#   2. infrastructure — 基础设施（MySQL/Redis/MinIO 等）
#   3. modules        — 核心微服务模块（不可移除或可剥离）
#   4. plugins        — 可插拔功能插件（24 个，按 P0/P1/P2/P3 分级）
#   5. profile-presets — 预置的模块组合方案（dev-minimal/dev-core/dev-full/test/prod）
#
# 关联文档：
#   - docs/重构方案_事件驱动与容器编排_20260703.md（六大支柱设计）
#   - docs/mykng分析报告_20260704_业界对比与插件化建设.md（插件清单）
#   - docs/架构反思_模块剥离痛点分析_20260703.md（痛点根因）
# ====================================================================

# ====================================================================
# 1. 全局配置
# ====================================================================
global:
  project-name: mykng
  context-path: ${KB_CONTEXT:/kb}
  java-version: 21
  spring-boot-version: 3.2.5
  network: kb-net
  version: 1.0.0

# ====================================================================
# 2. 基础设施（所有 profile 默认按需启动）
# ====================================================================
infrastructure:
  - name: mysql
    image: mysql:8.0
    port: 3306
    profile: core          # core=所有环境必启
    health-check: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
    volumes:
      - kb-mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    mem-limit: 512m
    description: MySQL 数据库

  - name: redis
    image: redis:7-alpine
    port: 6379
    profile: core
    health-check: ["CMD", "redis-cli", "ping"]
    volumes:
      - kb-redis-data:/data
    mem-limit: 256m
    description: Redis 缓存 + 事件流（Streams）

  - name: minio
    image: minio/minio:latest
    ports: [9000, 9001]
    profile: storage       # 仅 file/knowledge 模块启动时才需要
    health-check: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    volumes:
      - kb-minio-data:/data
    mem-limit: 512m
    description: MinIO 对象存储

  - name: meilisearch
    image: getmeili/meilisearch:v1.12
    port: 7700
    profile: search
    health-check: ["CMD", "curl", "-f", "http://localhost:7700/health"]
    volumes:
      - kb-meili-data:/meili_data
    mem-limit: 256m
    description: MeiliSearch 全文搜索引擎

  - name: mongodb
    image: mongo:7.0
    port: 27017
    profile: storage
    health-check: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    volumes:
      - kb-mongo-data:/data/db
    mem-limit: 512m
    description: MongoDB 文档存储

# ====================================================================
# 3. 核心微服务模块
# ====================================================================
# removable=false 表示核心模块，不可剥离
# removable=true 表示可剥离为独立项目（如 kb-ops 已剥离）
modules:
  - name: kb-gateway
    type: service
    profile: core          # core=所有环境必启
    port: 8080             # 容器内端口
    host-port: 8090        # 宿主机映射端口（仅 gateway 映射）
    context: /kb
    health-path: /actuator/health
    depends-on: []         # 网关不依赖业务服务（路由延迟生效）
    infra-depends: []
    routes:
      - path: /kb/api/auth/**
        target: kb-auth
      - path: /kb/api/user/**
        target: kb-auth
      - path: /kb/api/token/**
        target: kb-auth
      - path: /kb/api/log/**
        target: kb-auth
      - path: /kb/api/file/**
        target: kb-file
      - path: /kb/api/bucket/**
        target: kb-file
      - path: /kb/api/doc/**
        target: kb-knowledge
      - path: /kb/api/folder/**
        target: kb-knowledge
      - path: /kb/api/intelligence/**
        target: kb-intelligence
    description: API 网关：路由转发、JWT 鉴权、限流
    removable: false       # 核心模块，不可剥离

  - name: kb-auth
    type: service
    profile: core
    port: 8081
    host-port: null        # 不映射宿主机端口
    health-path: /actuator/health
    depends-on: []         # 不依赖其他业务服务
    infra-depends: [mysql, redis]
    database: kb_auth
    description: 认证授权：登录、JWT、用户管理、API Token、操作日志
    removable: false

  - name: kb-file
    type: service
    profile: file
    port: 8082
    host-port: null
    health-path: /actuator/health
    depends-on: [kb-auth]
    infra-depends: [mysql, redis, minio, meilisearch, mongodb]
    database: kb_file
    description: 文件管理：上传、下载、分片、解析、回收站
    removable: true

  - name: kb-knowledge
    type: service
    profile: knowledge
    port: 8083
    host-port: null
    health-path: /actuator/health
    depends-on: [kb-auth, kb-file]
    infra-depends: [mysql, redis, meilisearch, mongodb]
    database: kb_knowledge
    description: 知识管理：文档、文件夹、分享、标签、搜索、版本
    removable: true

  - name: kb-intelligence
    type: service
    profile: intelligence
    port: 8086
    host-port: null
    health-path: /actuator/health
    depends-on: []
    infra-depends: [mysql, redis, mongodb, meilisearch]
    database: kb_intelligence
    description: 知识引擎：导入、解析、实体抽取、LLM 集成
    removable: true

  - name: kb-web
    type: frontend
    profile: web
    port: 80
    host-port: 8088
    health-path: /
    depends-on: [kb-gateway]
    infra-depends: []
    description: Vue3 前端
    removable: false

# ====================================================================
# 4. 可插拔功能插件（24 个）
# ====================================================================
# 每个插件可独立启用/禁用/卸载，不影响核心功能
# 状态存储在 MySQL kb_common.plugin_status 表
# 详见 docs/mykng分析报告_20260704_业界对比与插件化建设.md
plugins:

  # ========== 4.1 核心必建插件（P0）==========
  - id: plugin-rbac
    name: RBAC 权限插件
    version: 1.0.0
    priority: P0
    type: service
    removable: false
    enabled-by-default: true
    module: kb-auth
    depends-on-modules: [kb-auth]
    depends-on-plugins: []
    depends-on-infra: [mysql, redis]
    config-prefix: kb.security.rbac
    description: 基于角色的权限控制（管理员/普通用户分级）
    backend:
      controllers: [com.kb.auth.controller.RoleController]
      entities: [com.kb.auth.entity.Role]
    frontend:
      routes:
        - path: /system/role
          view: views/system/RoleManageView
          menu: 系统管理 / 角色管理
    gateway-routes:
      - path: /kb/api/role/**
        target: kb-auth

  - id: plugin-user-mgmt
    name: 用户管理插件
    version: 1.0.0
    priority: P0
    type: service
    removable: false
    enabled-by-default: true
    module: kb-auth
    depends-on-modules: [kb-auth]
    depends-on-plugins: [plugin-rbac]
    depends-on-infra: [mysql, redis]
    config-prefix: kb.user.management
    description: 用户 CRUD + 启用/禁用 + 角色分配
    backend:
      controllers: [com.kb.auth.controller.UserController]
    frontend:
      routes:
        - path: /system/user
          view: views/system/UserManageView
          menu: 系统管理 / 用户管理

  - id: plugin-security
    name: 安全加固插件
    version: 1.0.0
    priority: P0
    type: mixed
    removable: false
    enabled-by-default: true
    module: kb-gateway
    depends-on-modules: [kb-gateway, kb-auth]
    depends-on-plugins: []
    depends-on-infra: [redis]
    config-prefix: kb.security
    description: JWT 密钥外置、CORS 收紧、internal 端点隔离、分享防暴力破解、Token 黑名单
    config:
      - key: kb.security.jwt-secret-env
        default: JWT_SECRET
      - key: kb.security.cors-origins
        default: https://tools.marschat.online
      - key: kb.security.share.max-attempts
        default: 5

  - id: plugin-chunk-upload
    name: 文件分片上传插件
    version: 1.0.0
    priority: P0
    type: frontend
    removable: true
    enabled-by-default: true
    module: kb-file
    depends-on-modules: [kb-file]
    depends-on-plugins: []
    depends-on-infra: [minio]
    config-prefix: kb.file.chunk
    description: 前端分片上传 + 断点续传 + 失败重试
    config:
      - key: kb.file.chunk.size
        default: 5MB
      - key: kb.file.chunk.concurrency
        default: 3

  # ========== 4.2 体验提升插件（P1）==========
  - id: plugin-doc-lifecycle
    name: 文档状态机插件
    version: 1.0.0
    priority: P1
    type: service
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: []
    depends-on-infra: []
    config-prefix: kb.doc.lifecycle
    description: 文档生命周期：草稿→已发布→归档→回收站
    migrations: [V1.0.0__add_doc_status.sql]

  - id: plugin-comment-notify
    name: 评论与通知插件
    version: 1.0.0
    priority: P1
    type: service
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge, kb-auth]
    depends-on-plugins: []
    depends-on-infra: [mysql, redis]
    config-prefix: kb.comment
    description: 文档/文件评论 + @ 提醒 + 站内通知 + 邮件通知
    migrations: [V1.0.0__add_comment_table.sql, V1.0.1__add_notification_table.sql]

  - id: plugin-collab-edit
    name: 协作编辑插件
    version: 1.0.0
    priority: P1
    type: mixed
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: [plugin-comment-notify]
    depends-on-infra: [redis]
    config-prefix: kb.collab
    description: 基于 CRDT/OT 的实时协作编辑
    config:
      - key: kb.collab.engine
        default: yjs

  - id: plugin-knowledge-graph
    name: 知识图谱可视化插件
    version: 1.0.0
    priority: P1
    type: frontend
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: []
    depends-on-infra: []
    config-prefix: kb.graph
    description: 基于双向链接的知识图谱可视化（力导向图）
    frontend:
      routes:
        - path: /graph
          view: views/graph/KnowledgeGraphView
          menu: 知识图谱

  - id: plugin-database-table
    name: 多维表格插件
    version: 1.0.0
    priority: P2
    type: service
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: []
    depends-on-infra: [mongodb]
    config-prefix: kb.database
    description: Notion 风格的多维表格（数据库视图）

  - id: plugin-block-editor
    name: 块级编辑插件
    version: 1.0.0
    priority: P2
    type: frontend
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: []
    depends-on-infra: []
    config-prefix: kb.editor
    description: Notion 风格的块级编辑器（/命令、斜杠菜单）

  # ========== 4.3 智能化插件（P2）==========
  - id: plugin-llm-qa
    name: LLM 智能问答插件
    version: 1.0.0
    priority: P2
    type: service
    removable: true
    enabled-by-default: false
    module: kb-intelligence
    depends-on-modules: [kb-knowledge, kb-intelligence]
    depends-on-plugins: []
    depends-on-infra: [redis]
    config-prefix: kb.llm
    description: 基于知识库的 LLM 问答（RAG 架构）
    config:
      - key: kb.llm.endpoint
        default: ""
      - key: kb.llm.api-key
        default: ""
      - key: kb.llm.model
        default: qwen-turbo

  - id: plugin-auto-summary
    name: 自动摘要插件
    version: 1.0.0
    priority: P2
    type: service
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: [plugin-llm-qa]
    depends-on-infra: []
    config-prefix: kb.summary
    description: 文档自动摘要 + 关键词提取

  - id: plugin-smart-tag
    name: 智能标签推荐插件
    version: 1.0.0
    priority: P2
    type: service
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: [plugin-llm-qa]
    depends-on-infra: []
    config-prefix: kb.smart-tag
    description: 基于内容分析推荐标签

  - id: plugin-self-maintain
    name: 自维护知识库插件
    version: 1.0.0
    priority: P2
    type: service
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: [plugin-llm-qa]
    depends-on-infra: []
    config-prefix: kb.self-maintain
    description: 过期内容检测 + 知识验证周期 + 更新提醒
    config:
      - key: kb.self-maintain.expiry-days
        default: 365

  - id: plugin-verification
    name: 知识验证周期插件
    version: 1.0.0
    priority: P2
    type: service
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge, kb-auth]
    depends-on-plugins: [plugin-rbac]
    depends-on-infra: []
    config-prefix: kb.verification
    description: Guru 风格的专家验证机制（知识可信度）
    config:
      - key: kb.verification.cycle-days
        default: 90

  # ========== 4.4 集成扩展插件（P2）==========
  - id: plugin-sso
    name: SSO/LDAP 集成插件
    version: 1.0.0
    priority: P2
    type: service
    removable: true
    enabled-by-default: false
    module: kb-auth
    depends-on-modules: [kb-auth]
    depends-on-plugins: []
    depends-on-infra: []
    config-prefix: kb.sso
    description: SAML/OAuth2/LDAP 单点登录
    config:
      - key: kb.sso.provider
        default: ""

  - id: plugin-notify-channels
    name: 第三方通知插件
    version: 1.0.0
    priority: P2
    type: service
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: [plugin-comment-notify]
    depends-on-infra: []
    config-prefix: kb.notify
    description: 钉钉/企业微信/飞书/Slack 通知集成
    config:
      - key: kb.notify.dingtalk.enabled
        default: false
      - key: kb.notify.wechat-work.enabled
        default: false

  - id: plugin-webhook
    name: Webhook 插件
    version: 1.0.0
    priority: P2
    type: service
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: []
    depends-on-infra: [redis]
    config-prefix: kb.webhook
    description: 事件 Webhook 订阅（文档创建/更新/删除等）

  - id: plugin-helpcenter
    name: 对外发布/帮助中心插件
    version: 1.0.0
    priority: P2
    type: mixed
    removable: true
    enabled-by-default: false
    module: kb-knowledge
    depends-on-modules: [kb-knowledge]
    depends-on-plugins: []
    depends-on-infra: []
    config-prefix: kb.helpcenter
    description: 对外发布知识库为帮助中心/FAQ 站点

  - id: plugin-ocr
    name: OCR 文字识别插件
    version: 1.0.0
    priority: P2
    type: service
    removable: true
    enabled-by-default: false
    module: kb-file
    depends-on-modules: [kb-file]
    depends-on-plugins: [plugin-llm-qa]
    depends-on-infra: []
    config-prefix: kb.ocr
    description: 图片/PDF 文字识别 + 索引
    config:
      - key: kb.ocr.engine
        default: tesseract

  # ========== 4.5 多端与无障碍插件（P3）==========
  - id: plugin-mobile-app
    name: 移动端 App 插件
    version: 1.0.0
    priority: P3
    type: frontend
    removable: true
    enabled-by-default: false
    module: kb-web
    depends-on-modules: [kb-gateway]
    depends-on-plugins: []
    depends-on-infra: []
    config-prefix: kb.mobile
    description: React Native/Flutter 移动端 App

  - id: plugin-dark-mode
    name: 暗黑模式插件
    version: 1.0.0
    priority: P2
    type: frontend
    removable: true
    enabled-by-default: true
    module: kb-web
    depends-on-modules: [kb-web]
    depends-on-plugins: []
    depends-on-infra: []
    config-prefix: kb.theme.dark-mode
    description: 暗黑主题 + 自动切换

  - id: plugin-i18n
    name: i18n 国际化插件
    version: 1.0.0
    priority: P3
    type: frontend
    removable: true
    enabled-by-default: false
    module: kb-web
    depends-on-modules: [kb-web]
    depends-on-plugins: []
    depends-on-infra: []
    config-prefix: kb.i18n
    description: 多语言支持（中/英/日）
    config:
      - key: kb.i18n.default-lang
        default: zh-CN

  - id: plugin-a11y
    name: 无障碍插件
    version: 1.0.0
    priority: P3
    type: frontend
    removable: true
    enabled-by-default: true
    module: kb-web
    depends-on-modules: [kb-web]
    depends-on-plugins: []
    depends-on-infra: []
    config-prefix: kb.a11y
    description: ARIA 标签 + 键盘导航 + 屏幕阅读器

# ====================================================================
# 5. 预置 Profile 组合（模块组合方案）
# ====================================================================
profile-presets:
  dev-minimal:            # 开发环境最小集（只做认证相关开发）
    description: 仅核心模块（认证 + 网关），内存占用 < 2GB
    modules: [kb-gateway, kb-auth]
    infra: [mysql, redis]
    plugins: [plugin-rbac, plugin-user-mgmt, plugin-security]

  dev-core:               # 开发环境核心集（认证 + 文件 + 知识）
    description: 核心三服务，内存占用 < 4GB
    modules: [kb-gateway, kb-auth, kb-file, kb-knowledge]
    infra: [mysql, redis, minio, meilisearch, mongodb]
    plugins: [plugin-rbac, plugin-user-mgmt, plugin-security, plugin-chunk-upload,
              plugin-doc-lifecycle, plugin-knowledge-graph, plugin-dark-mode]

  dev-full:               # 开发环境全量（含知识引擎）
    description: 全量模块，内存占用 < 6GB
    modules: [kb-gateway, kb-auth, kb-file, kb-knowledge, kb-intelligence, kb-web]
    infra: [mysql, redis, minio, meilisearch, mongodb]
    plugins: all           # all=启用所有 enabled-by-default=true 的插件

  test:                   # 测试环境（全量）
    description: 测试环境全量启动
    modules: [kb-gateway, kb-auth, kb-file, kb-knowledge, kb-intelligence, kb-web]
    infra: [mysql, redis, minio, meilisearch, mongodb]
    plugins: all

  prod:                   # 生产环境（全量 + 智能化）
    description: 生产环境全量启动 + AI 能力
    modules: [kb-gateway, kb-auth, kb-file, kb-knowledge, kb-intelligence, kb-web]
    infra: [mysql, redis, minio, meilisearch, mongodb]
    plugins: all

# ====================================================================
# 6. 字段说明
# ====================================================================
# 模块字段：
#   name            - 模块名（与目录名一致）
#   type            - service / frontend / infra
#   profile         - docker-compose profile（core/file/knowledge/...）
#   port            - 容器内端口
#   host-port       - 宿主机映射端口（null=不映射）
#   depends-on      - 业务服务依赖（影响启动顺序）
#   infra-depends   - 基础设施依赖
#   routes          - 网关路由配置（仅 gateway 需要）
#   removable       - 是否可剥离（核心模块=false）
#   database        - 独立数据库名
#
# 插件字段：
#   id                    - 插件唯一标识（plugin-<功能名>）
#   name                  - 插件名称
#   version               - 语义化版本
#   priority              - P0/P1/P2/P3
#   type                  - service / frontend / mixed
#   removable             - 是否可卸载（核心插件=false）
#   enabled-by-default    - 是否默认启用
#   module                - 所属后端模块
#   depends-on-modules    - 依赖的微服务模块
#   depends-on-plugins    - 依赖的其他插件
#   depends-on-infra      - 依赖的基础设施
#   config-prefix         - 配置项前缀（kb.<功能>.*）
#   description           - 插件描述
#   backend               - 后端组件（controllers/entities/services）
#   frontend              - 前端组件（routes/api-clients/components）
#   migrations            - 数据库迁移脚本
#   gateway-routes        - 网关路由规则
#   config                - 配置项清单
#
# Profile 预置：
#   dev-minimal - 开发最小集（4 容器）
#   dev-core    - 开发核心集（9 容器）
#   dev-full    - 开发全量（11 容器）
#   test        - 测试全量
#   prod        - 生产全量 + AI
# ====================================================================
