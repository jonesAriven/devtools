# ============================================================
# mykng 知识库微服务 Docker Compose 编排
# ============================================================
# 启动: docker compose --profile <dev|test|prod> up -d
# 构建: docker compose --profile <dev|test|prod> build
# 日志: docker compose logs -f [service]
# 停止: docker compose --profile dev --profile test --profile prod down
# 重建: docker compose --profile <dev|test|prod> up -d --build [service]
#
# Profiles 说明（按需启停模块）:
#   - dev:  最小化启动 (mysql + redis + nacos + kb-gateway + kb-auth + kb-knowledge)
#   - test: 核心功能验证 (全量基础设施 + 全部微服务)
#   - prod: 生产环境 (全量启动)
#
# 一键管理脚本: kb-cli.ps1
#   .\kb-cli.ps1 up dev | test | prod
#   .\kb-cli.ps1 down
#   .\kb-cli.ps1 status | logs | list
# ============================================================

services:
  # ========== 基础设施 ==========

  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kb123456}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - kb-mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-kb123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kb-net
    mem_limit: 512m
    profiles: [dev, test, prod]

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kb-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kb-net
    profiles: [dev, test, prod]

  # Nacos 服务注册与配置中心（所有微服务依赖）
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: kb-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=256m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kb-net
    mem_limit: 384m
    profiles: [dev, test, prod]

  minio:
    image: minio/minio:latest
    container_name: kb-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - kb-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-net
    mem_limit: 512m
    profiles: [test, prod]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: kb-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-kbMeiliKey2026!!Secure}
      MEILI_ENV: production
    volumes:
      - kb-meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-net
    mem_limit: 256m
    profiles: [dev, test, prod]  # kb-knowledge 依赖，dev 也需启动

  mongodb:
    image: mongo:7.0
    container_name: kb-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-kb}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-kb123456}
    volumes:
      - kb-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-net
    mem_limit: 512m
    profiles: [dev, test, prod]  # kb-knowledge 依赖，dev 也需启动

  # ========== 微服务 ==========
  # 启动顺序: gateway → auth → file → knowledge → intelligence
  # gateway 不依赖其他服务（路由延迟生效）
  # auth/file/knowledge/intelligence 依赖 mysql + redis
  # file 额外依赖 minio + meilisearch + mongodb
  # knowledge 额外依赖 meilisearch + mongodb
  # intelligence 额外依赖 mongodb + meilisearch
  # 全部微服务依赖 nacos 作为注册中心

  kb-gateway:
    build:
      context: ./kb-gateway
      dockerfile: Dockerfile
    container_name: kb-gateway
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:-YourSuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong!!}
      - KB_CONTEXT=${KB_CONTEXT:-/kb}
      - KB_AUTH_HOST=kb-auth:8081
      - KB_FILE_HOST=kb-file:8082
      - KB_KNOWLEDGE_HOST=kb-knowledge:8083
      - KB_INTELLIGENCE_HOST=kb-intelligence:8086
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - ./kb-gateway/target/kb-gateway.jar:/app/kb-gateway.jar:ro
    depends_on:
      kb-auth:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - kb-net
    mem_limit: 512m
    profiles: [dev, test, prod]

  kb-auth:
    build:
      context: ./kb-auth
      dockerfile: Dockerfile
    container_name: kb-auth
    restart: unless-stopped
    # 不映射宿主机端口，仅 Docker 内网通信
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=kb_auth
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-YourSuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong!!}
      - CRYPTO_AES_KEY=${CRYPTO_AES_KEY:-YWVzLTI1Ni1nY20ta2V5LTMyLWJ5dGVzISE=}
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - ./kb-auth/target/kb-auth.jar:/app/kb-auth.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - kb-net
    mem_limit: 512m
    profiles: [dev, test, prod]

  kb-file:
    build:
      context: ./kb-file
      dockerfile: Dockerfile
    container_name: kb-file
    restart: unless-stopped
    # 不映射宿主机端口，仅 Docker 内网通信
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=kb_file
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_KEY=${MEILI_MASTER_KEY:-kbMeiliKey2026!!Secure}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=kb
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD:-kb123456}
      - MONGO_DB=kb_file
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - ./kb-file/target/kb-file.jar:/app/kb-file.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - kb-net
    mem_limit: 512m
    profiles: [test, prod]

  kb-knowledge:
    build:
      context: ./kb-knowledge
      dockerfile: Dockerfile
    container_name: kb-knowledge
    restart: unless-stopped
    # 不映射宿主机端口，仅 Docker 内网通信
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=kb_knowledge
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_KEY=${MEILI_MASTER_KEY:-kbMeiliKey2026!!Secure}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=kb
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD:-kb123456}
      - MONGO_DB=kb_knowledge
      - KB_AUTH_HOST=kb-auth
      - KB_FILE_HOST=kb-file
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - ./kb-knowledge/target/kb-knowledge.jar:/app/kb-knowledge.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kb-auth:
        condition: service_healthy
      kb-file:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - kb-net
    mem_limit: 512m
    profiles: [dev, test, prod]

  kb-intelligence:
    build:
      context: ./kb-intelligence
      dockerfile: Dockerfile
    container_name: kb-intelligence
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=kb_intelligence
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-kb123456}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=kb
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD:-kb123456}
      - MONGO_DB=kb_intelligence
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_KEY=${MEILI_MASTER_KEY:-kbMeiliKey2026!!Secure}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-qwen-turbo}
      - NACOS_HOST=nacos
      - NACOS_PORT=8848
    volumes:
      - ${IMPORT_SOURCE_DIR:-/data/import}:/data/import:ro
      - /root/openclaw-work-space:/root/openclaw-work-space:ro
      - ./kb-intelligence/target/kb-intelligence.jar:/app/kb-intelligence.jar:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - kb-net
    mem_limit: 768m
    profiles: [test, prod]

# ========== 数据卷 ==========
volumes:
  kb-mysql-data:
    driver: local
  kb-redis-data:
    driver: local
  kb-minio-data:
    driver: local
  kb-meili-data:
    driver: local
  kb-mongo-data:
    driver: local

# ========== 网络 ==========
networks:
  kb-net:
    driver: bridge
