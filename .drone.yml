# ============================================================
# Drone CI/CD 流水线 — devtools 仓库 (mykng 项目)
# ============================================================
#
# 🎯 功能特性:
#   1. ✅ Push 自动触发（push 到 dev/master，修改 mykng/ 目录）
#   2. ✅ 手动触发（Drone 网页 "Run" 按钮 + 传入参数）
#   3. ⏰ 定时触发（每天凌晨自动构建部署，需在 Drone UI 配置 Cron）
#   4. 🌍 多环境支持（通过 DEPLOY_TARGET 参数选择目标服务器）
#
# 🔧 手动触发方式:
#   方式A - Drone 网页:
#     打开 https://ci.marschat.online/jonesAriven/devtools
#     点击右上角 "New Build" → 勾选 "Custom" → 传入参数:
#       DEPLOY_TARGET=production   (默认，部署到 mykng-debain)
#
#   方式B - Drone CLI:
#     drone build add jonesAriven/devtools \
#       --param DEPLOY_TARGET=production
#
# 📋 优化记录 (2026-07-05):
#   - SSH 到目标服务器本地 docker build+deploy（绕过慢速 Nexus push）
#   - --no-cache 保证每次全新构建
#   - 滚动重启避免全部停机
# ============================================================

kind: pipeline
type: docker
name: mykng-cicd

# ---------- 触发条件 ----------
trigger:
  branch:
    - dev
    - master
  event:
    - push        # Push 到 dev/master 自动触发
    - custom      # 手动触发（Run 按钮）
  # Push 自动触发：只有修改了 mykng/ 目录才触发（custom 事件不受此限制）
  paths:
    include:
      - "mykng/**"
    exclude:
      - "*.md"

# ---------- 全局变量（可通过手动参数覆盖）----------
environment:
  DEPLOY_TARGET: production

# ============================================================
# Step 1: Maven 编译
# ============================================================
steps:
  - name: build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - name: maven-cache
        path: /root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - |
        echo "============================================="
        echo "  Maven 编译开始"
        echo "  分支: ${DRONE_COMMIT_BRANCH:-dev}"
        echo "  Commit: ${DRONE_COMMIT_SHA}"
        echo "  触发事件: ${DRONE_BUILD_EVENT}"
        echo "  部署目标: ${DEPLOY_TARGET:-production}"
        echo "============================================="
      - cd mykng/kb-parent
      - mvn clean package -DskipTests -B -V -ntp -Dmaven.repo.local=/root/.m2/repository
      - cd ../..
      - echo "=== 编译产物大小 ==="
      - ls -lh kb-gateway/target/*.jar kb-auth/target/*.jar kb-file/target/*.jar kb-knowledge/target/*.jar kb-intelligence/target/*.jar

# ============================================================
# Step 2: 部署到目标服务器（本地构建 + 滚动重启）
# ============================================================
# 支持多环境：通过 DEPLOY_TARGET 参数选择部署目标
#   production → mykng-debain (100.93.36.113) — 默认
#   test       → 测试服务器（可后续扩展）
  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      password:
        from_secret: deploy_pass
      port: 22
      script_timeout: 15m
      command_timeout: 5m
    environment:
      DEPLOY_TARGET: ${DEPLOY_TARGET:-production}
    when:
      event:
        - push
        - custom
    script:
      - |
        echo "============================================="
        echo "  mykng 自动部署开始"
        echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "  Commit: $DRONE_COMMIT_SHA"
        echo "  目标: ${DEPLOY_TARGET:-production}"
        echo "  触发: ${DRONE_BUILD_EVENT}"
        echo "============================================="
      - |
        # ======== 根据部署目标选择配置 ========
        TARGET="${DEPLOY_TARGET:-production}"
        case "${TARGET}" in
          production)
            PROJECT_NAME="kb-deploy"
            echo "📍 部署目标: 生产环境 (mykng-debain)"
            ;;
          test)
            PROJECT_NAME="kb-test"
            echo "📍 部署目标: 测试环境"
            ;;
          *)
            echo "❌ 未知的部署目标: ${TARGET}"
            echo "   可用选项: production, test"
            exit 1
            ;;
        esac
      - |
        # 1. 同步代码
        echo ""
        echo ">>> [1/4] 同步代码 <<<"
        cd /root/devtools
        git fetch origin "${DRONE_COMMIT_BRANCH:-dev}"
        git reset --hard "origin/${DRONE_COMMIT_BRANCH:-dev}"
        echo "✅ 代码已同步到 $(git rev-parse --short HEAD)"
      - |
        # 2. 本地构建 Docker 镜像
        echo ""
        echo ">>> [2/4] 构建 Docker 镜像 <<<"
        cd /root/devtools/mykng

        echo "--- 当前 commit: $(git rev-parse HEAD) ---"
        echo "--- 各服务 jar 包时间戳 ---"
        ls -lh kb-gateway/target/*.jar kb-auth/target/*.jar kb-file/target/*.jar \
               kb-knowledge/target/*.jar kb-intelligence/target/*.jar \
               2>/dev/null || echo "⚠️ jar 包不存在"

        docker compose -p "${PROJECT_NAME}" build --no-cache \
          kb-gateway kb-auth kb-file kb-knowledge kb-intelligence \
          2>&1 | tail -30

        echo "✅ 镜像构建完成（--no-cache 全新构建）"
        docker images | grep "${PROJECT_NAME}" | head -10
      - |
        # 3. 按依赖顺序滚动重启
        echo ""
        echo ">>> [3/4] 滚动重启服务 <<<"

        COMPOSE_ARGS="-p ${PROJECT_NAME} up -d --no-deps --force-recreate"

        echo "--- [1/5] 重启 kb-auth ---"
        docker compose ${COMPOSE_ARGS} kb-auth && sleep 20

        echo "--- [2/5] 重启 kb-file ---"
        docker compose ${COMPOSE_ARGS} kb-file && sleep 15

        echo "--- [3/5] 重启 kb-knowledge ---"
        docker compose ${COMPOSE_ARGS} kb-knowledge && sleep 15

        echo "--- [4/5] 重启 kb-intelligence ---"
        docker compose ${COMPOSE_ARGS} kb-intelligence && sleep 15

        echo "--- [5/5] 重启 kb-gateway (入口) ---"
        docker compose ${COMPOSE_ARGS} kb-gateway && sleep 25

        echo "✅ 所有服务已重启"
      - |
        # 4. 健康检查
        echo ""
        echo ">>> [4/4] 健康检查 <<<"
        sleep 15

        echo "--- 服务状态 ---"
        docker compose -p "${PROJECT_NAME}" ps

        echo "--- Gateway 健康检查 ---"
        for i in $(seq 1 6); do
          if curl -sf http://localhost:8090/kb/actuator/health > /dev/null 2>&1; then
            echo "✅ Gateway 健康! (尝试 $i)"
            break
          fi
          echo "⏳ 等待 Gateway 启动... ($i/6)"
          sleep 10
        done

        echo ""
        echo "============================================="
        echo "  mykng 部署完成!"
        echo "  环境: ${TARGET}"
        echo "  Commit: $(git rev-parse --short HEAD)"
        echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "============================================="

