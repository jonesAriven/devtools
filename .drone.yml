# │                                                      │
# │  多个项目（逗号分隔，空格可选）:                         │
# │    DEPLOY_PROJECT=mykng,active-manager               │
# │    DEPLOY_PROJECT=mykng, kb-ops, portal              │
# │                                                      │
# │  全部部署:                                             │
# │    DEPLOY_PROJECT=all                                 │
# │                                                      │
# │  不填 = 默认全部部署                                    │
# │                                                      │
# │  可选: DEPLOY_TARGET=production / dev / test          │
