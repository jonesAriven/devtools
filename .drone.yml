# ============================================================
# Drone CI/CD — devtools 仓库（调度中心）
# ============================================================
#
# 📁 架构设计: 注册表模式（Registry Pattern）
#   本文件 = 调度中心 + 项目注册表
#   各项目/ci/deploy.sh = 具体部署逻辑
#
# 🎯 核心机制:
#   1. 所有项目共享一个统一 pipeline 模板
#   2. 通过 PROJECTS 注册表声明哪些项目可部署
#   3. 手动触发时传 DEPLOY_PROJECT 参数选择目标
#   4. 每个 pipeline 自动：检查项目 → 编译 → 部署
#
# 🔧 手动触发:
#   Drone → New Build → Custom → 填写参数:
#     DEPLOY_PROJECT=mykng          # 只部署 mykng
#     DEPLOY_PROJECT=active-manager # 只部署激活码
#     DEPLOY_PROJECT=all            # 全部部署
#     (不填则全部部署)
#
# ➕ 新增项目的步骤（只需改3处）:
#   1. 在 PROJECTS 注册表中添加一行
#   2. 创建 项目名/ci/deploy.sh
#   3. 在本文件末尾复制一个 pipeline 并改参数
#   完事！不用重复写 check/build/deploy 逻辑
#
# ⏰ 定时任务: Drone UI → Settings → Cron Jobs
# ============================================================

# ================================
# 📋 项目注册表（Projects Registry）
# =================---------------
# 所有支持 CI/CD 的项目都在这里注册。
# 新增项目？只需加一行，然后复制一个 pipeline 块即可。
# ================================
#
# | 项目名           | 描述           | 部署目标主机      | Maven模块路径              | 内存  |
# |------------------|---------------|------------------|--------------------------|-------|
# | mykng            | 知识库微服务    | 100.93.36.113    | mykng/kb-parent          | 2048m |
# | active-manager   | 激活码系统      | 192.168.31.182   | active-manager/activation-code-server | 1024m |
# | kb-ops           | 运维平台        | (待配置)         | kb-ops                   | 1024m |
# | myfrp            | FRP管理面板     | (待配置)         | myfrp                    | 512m  |
# | portal           | 门户系统        | (待配置)         | portal/portal-server     | 1024m |
# | infra-monitor    | 基础设施监控     | (待配置)         | infra-monitor/infra-monitor-server | 512m |

# ================================
# Pipeline: mykng 知识库微服务
# ================================
kind: pipeline
type: docker
name: mykng-cicd

# ---- 🎛️ UI 参数定义（New Build 时显示为下拉框/输入框） ----
# 单选下拉框 + 手动输入逗号分隔值 兼容：
#   下拉选：快速选单个项目或常用组合
#   手动输：如 "mykng,kb-ops,portal" 同时部署多个
parameters:
  - name: DEPLOY_PROJECT
    displayName: "📦 选择要部署的项目（多选用逗号分隔）"
    type: string
    default: "all"
    options:
      # ── 全量/清空 ──
      - value: all
        label: "🔄 全部项目"
      # ── 分隔线：单项选择 ──
      - value: mykng
        label: "📘 知识库微服务 (mykng)"
      - value: active-manager
        label: "🔑 激活码系统 (active-manager)"
      # ── 分隔线：常用组合 ──
      - value: mykng,active-manager
        label: "📦 知识库 + 激活码"
      # ↓ 新增项目时在这里加选项即可
      # - value: kb-ops
      #   label: "⚙️ 运维平台 (kb-ops)"
      # - value: myfrp
      #   label: "🌐 FRP管理面板 (myfrp)"
      # - value: portal
      #   label: "🚪 门户系统 (portal)"
      # ── 组合示例（取消注释启用）──
      # - value: mykng,kb-ops
      #   label: "📦 知识库 + 运维平台"
      # - value: mykng,portal
      #   label: "📦 知识库 + 门户"
  - name: DEPLOY_TARGET
    displayName: "🌍 部署目标环境"
    type: string
    default: "production"
    options:
      - value: production
        label: "🏭 生产环境 (production)"
      - value: dev
        label: "🧪 开发环境 (dev)"
      - value: test
        label: "🧫 测试环境 (test)"

trigger:
  branch: [dev, master]
  event: [custom]

steps:
  - name: check-project
    image: alpine:3.19
    commands:
      - |
        PROJECT="mykng"
        echo "=== [$PROJECT] 检查部署目标: DEPLOY_PROJECT=${DEPLOY_PROJECT:-未设置} ==="
        # 支持多项目选择：逗号分隔（如 DEPLOY_PROJECT=mykng,kb-ops）
        # 也支持单项目、all、或不填（默认全部）
        if [ "${DEPLOY_PROJECT}" != "" ] && [ "${DEPLOY_PROJECT}" != "all" ]; then
          MATCH=0
          IFS=',' read -ra TARGETS <<< "${DEPLOY_PROJECT}"
          for TARGET in "${TARGETS[@]}"; do
            # 去掉前后空格
            TARGET=$(echo "$TARGET" | xargs)
            if [ "$TARGET" = "$PROJECT" ]; then
              MATCH=1
              break
            fi
          done
          if [ "$MATCH" = "0" ]; then
            echo "⏭️  跳过 $PROJECT（不在部署列表中）"
            exit 1
          fi
        fi
        echo "✅ 匹配 $PROJECT，继续部署"
    failure: ignore

  - name: build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - name: maven-cache
        path: /root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - echo "=== [mykng] Maven 编译 ==="
      - cd mykng/kb-parent && mvn clean package -DskipTests -B -V -ntp -Dmaven.repo.local=/root/.m2/repository && cd ../..
      - ls -lh mykng/kb-gateway/target/*.jar mykng/kb-auth/target/*.jar mykng/kb-file/target/*.jar mykng/kb-knowledge/target/*.jar mykng/kb-intelligence/target/*.jar
    when:
      event: [custom]

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      password:
        from_secret: deploy_pass
      port: 22
      script_timeout: 15m
      command_timeout: 5m
    when:
      event: [custom]
    script:
      - chmod +x /root/devtools/mykng/ci/deploy.sh
      - bash /root/devtools/mykng/ci/deploy.sh "${DRONE_COMMIT_SHA}" "${DRONE_COMMIT_BRANCH:-dev}" "${DEPLOY_TARGET:-production}"

volumes:
  - name: maven-cache
    host:
      path: /root/.m2/repository

---
# ================================
# Pipeline: active-manager 激活码系统
# ================================
kind: pipeline
type: docker
name: active-manager-cicd

trigger:
  branch: [dev, master]
  event: [custom]

steps:
  - name: check-project
    image: alpine:3.19
    commands:
      - |
        PROJECT="active-manager"
        echo "=== [$PROJECT] 检查部署目标: DEPLOY_PROJECT=${DEPLOY_PROJECT:-未设置} ==="
        # 支持多项目选择：逗号分隔（如 DEPLOY_PROJECT=mykng,active-manager）
        if [ "${DEPLOY_PROJECT}" != "" ] && [ "${DEPLOY_PROJECT}" != "all" ]; then
          MATCH=0
          IFS=',' read -ra TARGETS <<< "${DEPLOY_PROJECT}"
          for TARGET in "${TARGETS[@]}"; do
            TARGET=$(echo "$TARGET" | xargs)
            if [ "$TARGET" = "$PROJECT" ]; then
              MATCH=1
              break
            fi
          done
          if [ "$MATCH" = "0" ]; then
            echo "⏭️  跳过 $PROJECT（不在部署列表中）"
            exit 1
          fi
        fi
        echo "✅ 匹配 $PROJECT，继续部署"
    failure: ignore

  - name: build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - name: maven-cache
        path: /root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx1024m
    commands:
      - echo "=== [active-manager] Maven 编译 ==="
      - cd active-manager/activation-code-server && mvn clean package -DskipTests -B -V -ntp -Dmaven.repo.local=/root/.m2/repository && cd ../..
      - ls -lh active-manager/activation-code-server/target/*.jar
    when:
      event: [custom]

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 192.168.31.182
      username: root
      password:
        from_secret: deploy_pass
      port: 22
      script_timeout: 10m
      command_timeout: 5m
    when:
      event: [custom]
    script:
      - chmod +x /root/devtools/active-manager/ci/deploy.sh
      - bash /root/devtools/active-manager/ci/deploy.sh "${DRONE_COMMIT_SHA}" "${DRONE_COMMIT_BRANCH:-dev}"

volumes:
  - name: maven-cache
    host:
      path: /root/.m2/repository

