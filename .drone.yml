# | deploy_pass  | SSH 登录密码   | 目标机器的 root 密码    |
# | smtp_pass    | Zoho SMTP密码 | 应用专用密码（待配置）   |
#
# 📖 使用指南:
# ┌──────────────────────────────────────────────────────┐
# │  New Build 时填写 DEPLOY_PROJECT 参数:                │
# │                                                      │
# │  单个项目:                                             │
