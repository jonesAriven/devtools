# ============================================================
# Volumes
# ============================================================
volumes:
  - name: maven-cache
    host:
      path: /root/.m2/repository

# ============================================================
# ⏰ 定时任务配置说明
# ============================================================
# Drone Cron 需要在 Web UI 中配置（不支持在 .drone.yml 中定义）：
#
# 步骤：
#   1. 打开 https://ci.marschat.online/jonesAriven/devtools/settings
#   2. 找到 "Cron Jobs" 部分
#   3. 点击 "New Cron Job"
#   4. 填写：
#      - Name: nightly-build
#      - Schedule: 0 19 * * *   (UTC 19:00 = 北京时间 03:00)
#      - Branch: dev
#      - (可选) 传入参数: DEPLOY_TARGET=production
#   5. 保存
#
# 注意：Drone Server 需要设置环境变量 CRON_ENABLED=true
# ============================================================

# ============================================================
# Secrets 配置清单
# ============================================================
# 在 Drone Repository Settings → Secrets 中配置：
# | Secret 名    | 用途           | 说明                    |
# |-------------|---------------|-------------------------|
# | deploy_pass  | SSH 登录密码   | 目标服务器的 root 密码   |
# | smtp_pass    | Zoho SMTP密码 | 应用专用密码（待配置）   |
# ============================================================
