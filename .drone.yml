# ============================================================
# Drone CI/CD — devtools 仓库（调度中心）
# ============================================================
#
# 📁 项目结构:
#   .drone.yml              ← 本文件（调度中心，只做路由）
#   mykng/
#     .drone.yml            ← 配置说明
#     ci/
#       deploy.sh         ← mykng 部署脚本
#   active-manager/
#     .drone.yml            ← 配置说明
#     ci/
#       deploy.sh         ← active-manager 部署脚本
#
# 🎯 工作原理:
#   本文件只负责：接收 Drone 触发 → 判断改了哪个项目 → 调用对应项目的 ci/deploy.sh
#   各项目的具体逻辑（Maven 编译、Docker 构建、服务重启）都在各自项目的 ci/deploy.sh 里
#
# 🔧 手动触发:
#   Drone 网页 → New Build → Custom → 传参: DEPLOY_TARGET=production
#
# ⏰ 定时任务: Drone UI → Settings → Cron Jobs
# ============================================================

# ================================
# Pipeline A: mykng 知识库微服务
# ================================
kind: pipeline
type: docker
name: mykng-cicd

trigger:
  branch:
    - dev
    - master
  event:
    - push
    - custom
  paths:
    include:
      - "mykng/**"
    exclude:
      - "*.md"

environment:
  DEPLOY_TARGET: production

steps:
  # ---- Step 1: Maven 编译 ----
  - name: build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - name: maven-cache
        path: /root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - |
        echo "============================================="
        echo "  [mykng] Maven 编译"
        echo "  分支: ${DRONE_COMMIT_BRANCH:-dev}"
        echo "  Commit: ${DRONE_COMMIT_SHA}"
        echo "============================================="
      - cd mykng/kb-parent && mvn clean package -DskipTests -B -V -ntp -Dmaven.repo.local=/root/.m2/repository && cd ../..
      - echo "=== 编译产物 ==="
      - ls -lh mykng/kb-gateway/target/*.jar mykng/kb-auth/target/*.jar mykng/kb-file/target/*.jar mykng/kb-knowledge/target/*.jar mykng/kb-intelligence/target/*.jar

  # ---- Step 2: 部署（调用 mykng/ci/deploy.sh） ----
  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      password:
        from_secret: deploy_pass
      port: 22
      script_timeout: 15m
      command_timeout: 5m
    when:
      event:
        - push
        - custom
    script:
      - chmod +x /root/devtools/mykng/ci/deploy.sh
      - bash /root/devtools/mykng/ci/deploy.sh "${DRONE_COMMIT_SHA}" "${DRONE_COMMIT_BRANCH:-dev}" "${DEPLOY_TARGET:-production}"

volumes:
  - name: maven-cache
    host:
      path: /root/.m2/repository

# ================================
# Pipeline B: active-manager 激活码系统
# ================================
kind: pipeline
type: docker
name: active-manager-cicd

trigger:
  branch:
    - dev
    - master
  event:
    - push
    - custom
  paths:
    include:
      - "active-manager/**"
    exclude:
      - "*.md"
      - "active-manager/docs/**"

steps:
  # ---- Step 1: Maven 编译 ----
  - name: build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - name: maven-cache
        path: /root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx1024m
    commands:
      - |
        echo "============================================="
        echo "  [active-manager] Maven 编译"
        echo "  分支: ${DRONE_COMMIT_BRANCH:-dev}"
        echo "  Commit: ${DRONE_COMMIT_SHA}"
        echo "============================================="
      - cd active-manager/activation-code-server && mvn clean package -DskipTests -B -V -ntp -Dmaven.repo.local=/root/.m2/repository && cd ../..
      - echo "=== 编译产物 ==="
      - ls -lh active-manager/activation-code-server/target/*.jar

  # ---- Step 2: 部署（调用 active-manager/ci/deploy.sh） ----
  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 192.168.31.182
      username: root
      password:
        from_secret: deploy_pass
      port: 22
      script_timeout: 10m
      command_timeout: 5m
    when:
      event:
        - push
        - custom
    script:
      - chmod +x /root/devtools/active-manager/ci/deploy.sh
      - bash /root/devtools/active-manager/ci/deploy.sh "${DRONE_COMMIT_SHA}" "${DRONE_COMMIT_BRANCH:-dev}"

volumes:
  - name: maven-cache
    host:
      path: /root/.m2/repository

# ============================================================
# Secrets 配置清单
# ============================================================
# | Secret 名   | 用途           | 说明                    |
# |-------------|---------------|-------------------------|
# | deploy_pass  | SSH 登录密码   | 两台机器的 root 密码    |
# | smtp_pass    | Zoho SMTP密码 | 应用专用密码（待配置）   |
# ============================================================
