# ============================================================
# Drone CI/CD 流水线 — devtools 仓库
# ============================================================
# 仓库结构: devtools 是多项目大仓库
#   - mykng/        知识库微服务 (Java/Spring Boot)
#   - active-manager/  激活码管理 (待接入)
#   - portal/       Portal工具看板 (待接入)
#   - 其他项目...
#
# 触发: push 到 dev 分支
# 策略: 按修改路径触发对应项目流水线
#
# 📋 优化记录 (2026-07-05):
#   - 原问题: docker-build-push 步骤 push 到 Nexus 极慢（23分钟+）
#   - 根因1: Nexus Docker Registry 写入带宽低 (~100KB/s)
#   - 根因2: 无 .dockerignore → build context 过大 (kb-file 126MB)
#   - 根因3: 双重推送 (tag + latest) 浪费带宽
#   - 根因4: Dockerfile 每次安装 tzdata 增加构建时间
#   - 解决: 改为 SSH 到目标机器本地 build+deploy，跳过 CI 中 docker push
# ============================================================

kind: pipeline
type: docker
name: mykng-cicd

trigger:
  branch:
    - dev
  event:
    - push
  # 只有修改了 mykng/ 目录才触发
  paths:
    - "mykng/**"

# ---------- 全局 ----------
environment:
  DEPLOY_HOST: 100.93.36.113

# ============================================================
# Step 1: Maven 编译
# ============================================================
steps:
  - name: build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - name: maven-cache
        path: /root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - echo "=== Maven 编译 ==="
      - cd mykng/kb-parent
      - mvn clean package -DskipTests -B -V -ntp -Dmaven.repo.local=/root/.m2/repository
      - cd ../..
      - echo "=== 编译产物大小 ==="
      - ls -lh mykng/kb-gateway/target/*.jar mykng/kb-auth/target/*.jar mykng/kb-file/target/*.jar mykng/kb-knowledge/target/*.jar mykng/kb-intelligence/target/*.jar

# ============================================================
# Step 2: 部署到 mykng-debain（本地构建 + 滚动重启）
# ============================================================
# 优化说明：
#   不再在 CI 中 docker build + push 到 Nexus（太慢！）
#   改为 SSH 到目标服务器，git pull 后本地 docker compose build + up
#   这样避免了 Drone→Nexus 的慢速网络传输
#   目标服务器 (mykng-debain) 与 Nexus 在同一内网，速度快很多
  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      password:
        from_secret: deploy_pass
      port: 22
      script_timeout: 15m  # 15分钟超时（本地构建5个镜像需要时间）
      command_timeout: 5m   # 单条命令超时5分钟
      script:
        - |
          echo "============================================="
          echo "  mykng 自动部署开始"
          echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "  Commit: $DRONE_COMMIT_SHA"
          echo "============================================="
        - |
          # 1. 同步代码
          echo ">>> [1/4] 同步代码 <<<"
          cd /root/devtools
          git fetch origin dev
          git reset --hard origin/dev
          echo "✅ 代码已同步到 $DRONE_COMMIT_SHA"
        - |
          # 2. 本地构建 Docker 镜像（内网速度快）
          echo ">>> [2/4] 构建 Docker 镜像 <<<"
          cd /root/devtools/mykng

          # 🔒 关键：每次都 --no-cache 构建全新镜像，绝不使用旧缓存
          # 这样保证每次部署的都是当前 commit 对应的最新代码产物
          # 虽然 --no-cache 会稍慢（无法利用层缓存），
          # 但能100%避免"代码更新了但镜像还是旧的"的致命问题
          echo "--- 当前 commit: $(git rev-parse HEAD) ---"
          echo "--- 各服务 jar 包时间戳 ---"
          ls -lh kb-gateway/target/*.jar kb-auth/target/*.jar kb-file/target/*.jar kb-knowledge/target/*.jar kb-intelligence/target/*.jar 2>/dev/null || echo "⚠️ jar 包不存在，需要先编译"

          docker compose -p kb-deploy build --no-cache \
            kb-gateway kb-auth kb-file kb-knowledge kb-intelligence \
            2>&1 | tail -30

          echo "✅ 镜像构建完成（全新构建，无缓存）"
          docker images | grep "kb-deploy" | head -10
        - |
          # 3. 按依赖顺序滚动重启（每个服务独立重启，避免全部停机）
          echo ">>> [3/4] 滚动重启服务 <<<"

          # 3a. auth（其他服务的依赖基础）
          echo "--- 重启 kb-auth ---"
          docker compose -p kb-deploy up -d --no-deps --force-recreate kb-auth
          sleep 20

          # 3b. file
          echo "--- 重启 kb-file ---"
          docker compose -p kb-deploy up -d --no-deps --force-recreate kb-file
          sleep 15

          # 3c. knowledge
          echo "--- 重启 kb-knowledge ---"
          docker compose -p kb-deploy up -d --no-deps --force-recreate kb-knowledge
          sleep 15

          # 3d. intelligence
          echo "--- 重启 kb-intelligence ---"
          docker compose -p kb-deploy up -d --no-deps --force-recreate kb-intelligence
          sleep 15

          # 3e. gateway（最后重启，因为它是入口）
          echo "--- 重启 kb-gateway ---"
          docker compose -p kb-deploy up -d --no-deps --force-recreate kb-gateway
          sleep 25

          echo "✅ 所有服务已重启"
        - |
          # 4. 健康检查
          echo ">>> [4/4] 健康检查 <<<"
          sleep 15

          # 检查各服务状态
          echo "--- 服务状态 ---"
          docker compose -p kb-deploy ps

          echo "--- Gateway 健康检查 ---"
          for i in $(seq 1 6); do
            if curl -sf http://localhost:8090/kb/actuator/health > /dev/null 2>&1; then
              echo "✅ Gateway 健康 (尝试 $i)"
              break
            fi
            echo "⏳ 等待 Gateway 启动... ($i/6)"
            sleep 10
          done

          echo "============================================="
          echo "  mykng 部署完成!"
          echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================="

# ============================================================
# Step 3: 邮件通知
# ============================================================
  - name: notify
    image: drillster/drone-email
    settings:
      host: smtp.163.com
      port: 465
      username:
        from_secret: smtp_user
      password:
        from_secret: smtp_pass
      from:
        from_secret: smtp_user
      recipients:
        - huliang2019@163.com
      subject: >
        [{{#success build.status}}✅{{else}}❌{{/success}}]
        mykng #{{build.number}} - {{build.status}}
      body: |
        仓库: {{repo.name}}
        分支: {{build.branch}}
        提交: {{build.commit}}
        作者: {{build.author}}
        信息: {{build.message}}
        链接: https://ci.marschat.online/{{repo.owner}}/{{repo.name}}/{{build.number}}
    when:
      status: [success, failure]

# ============================================================
# Volumes
# ============================================================
volumes:
  - name: maven-cache
    host:
      path: /root/.m2/repository
