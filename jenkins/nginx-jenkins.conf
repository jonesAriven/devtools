# ============================================================
# Jenkins CI/CD — 腾讯云 Nginx 反向代理配置
# ============================================================
# 域名: https://jkci.marschat.online
# 后端: mykng:8097 (Tailscale → 100.93.36.113:8097)
# 证书: 泛域名 *.marschat.online (Let's Encrypt / acme.sh)
#
# 部署位置: 腾讯云2号 Nginx
# 配置路径: /etc/nginx/conf.d/jenkins.conf
#
# 使用方法:
#   1. 复制此文件到腾讯云2号: scp nginx-jenkins.conf root@<腾讯云IP>:/etc/nginx/conf.d/jenkins.conf
#   2. 测试配置: nginx -t
#   3. 重载 Nginx: systemctl reload nginx
# ============================================================

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name jkci.marschat.online;

    # Let's Encrypt ACME 验证（自动续期用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # 其他请求全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jkci.marschat.online;

    # ========== SSL 证书 (泛域名) ==========
    ssl_certificate     /etc/letsencrypt/live/marschat.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marschat.online/privkey.pem;

    # SSL 安全优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (严格传输安全，180天)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

    # ========== 访问日志 ==========
    access_log /var/log/nginx/jenkins_access.log;
    error_log  /var/log/nginx/jenkins_error.log;

    # ========== 反向代理到 Jenkins ==========
    location / {
        proxy_pass http://100.93.36.113:8097;  # Tailscale 内网地址

        # WebSocket 支持（Jenkins CLI、Pipeline 控制台等需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 基础代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Jenkins 特殊需求：大文件上传（JAR 包传输）
        client_max_body_size 500m;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 禁用缓冲（Jenkins SSE/流式输出需要）
        proxy_buffering off;
        proxy_cache off;
    }

    # ========== Jenkins CLI 端点特殊处理 ==========
    location /cli {
        proxy_pass http://100.93.36.113:8097/cli;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # CLI 可能长时间运行
        proxy_read_timeout 3600s;
    }

    # ========== Gitee Webhook 接收端点 ==========
    location /gitee-project {
        proxy_pass http://100.93.36.113:8097/gitee-project;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== 安全：禁止敏感路径直接访问 ==========
    # （Jenkins 自身有安全控制，这里做额外防护）
    location ~ ^/(script|manage|reload) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://100.93.36.113:8097;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== 静态资源缓存 ==========
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://100.93.36.113:8097;

        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ========== 健康检查端点 ==========
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

# ========== 限流配置 (在 http 块中定义) ==========
# 放在 nginx.conf 的 http {} 中：
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;
