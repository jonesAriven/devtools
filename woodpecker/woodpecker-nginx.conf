# ============================================================
# Woodpecker CI — Nginx 反向代理配置
# ============================================================
#
# 📌 用途:
#   在腾讯云2号主机上配置 Nginx 反向代理
#   将 https://woodci.marschat.online 请求转发到 mykng 的 Woodpecker
#
# 📍 部署位置:
#   腾讯云2号服务器: /etc/nginx/conf.d/woodci.marschat.online.conf
#
# 🔗 代理链路:
#   用户 → https://woodci.marschat.online (腾讯云2号 Nginx:443/SSL)
#     → Tailscale VPN → mykng (100.93.36.113):8000 (Woodpecker)
#
# ⚠️ 前置条件:
#   1. 已有 SSL 泛域名证书 *.marschat.online
#   2. Tailscale 网络已连通（腾讯云2号 ↔ mykng）
#   3. DNS 解析已配置: woodci.marschat.online → 腾讯云2号 IP
#   4. Woodpecker 服务已在 mykng 上启动并监听 8000 端口
#
# 🔧 配置步骤:
#   1. 复制本文件到腾讯云2号:
#      scp woodpecker-nginx.conf root@腾讯云2号:/etc/nginx/conf.d/woodci.marschat.online.conf
#
#   2. 修改 SSL 证书路径（根据实际情况）
#
#   3. 测试并重载 Nginx:
#      nginx -t && systemctl reload nginx
#
#   4. 测试访问:
#      curl -I https://woodci.marschat.online
# ============================================================

server {
    listen 443 ssl;
    server_name woodci.marschat.online;
    
    # ================================
    # SSL 证书配置
    # ================================
    # 使用泛域名证书（请修改为实际路径）
    ssl_certificate     /etc/nginx/ssl/marschat.online.pem;
    ssl_certificate_key /etc/nginx/ssl/marschat.online.key;
    
    # SSL 协议和加密套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL 会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling（可选，提高 HTTPS 性能）
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;
    # resolver_timeout 5s;

    # ================================
    # 安全头
    # ================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # HSTS（建议生产环境开启，首次部署可先注释掉测试）
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ================================
    # 日志配置
    # ================================
    access_log /var/log/nginx/woodci.marschat.online.access.log;
    error_log  /var/log/nginx/woodci.marschat.online.error.log;

    # ================================
    # 客户端限制
    # ================================
    client_max_body_size 100M;          # 支持大文件上传（构建产物等）
    client_body_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 300s;            # 构建日志可能需要较长时间

    # ================================
    # 反向代理到 Woodpecker Server
    # ================================
    location / {
        # 代理地址（Tailscale 内网地址）
        proxy_pass http://100.93.36.113:8000;
        
        # 标准代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket 支持（Woodpecker 实时日志需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 禁用缓冲（WebSocket 需要）
        proxy_buffering off;
        proxy_cache off;
        
        # 超时设置
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ================================
    # 健康检查端点（可选）
    # ================================
    location /healthz {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}

# ================================
# HTTP → HTTPS 重定向
# ================================
server {
    listen 80;
    server_name woodci.marschat.online;
    
    # Let's Encrypt 验证（如果使用 ACME 证书）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 其他所有请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
