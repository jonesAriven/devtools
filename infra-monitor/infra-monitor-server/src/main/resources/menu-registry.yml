# infra-monitor 菜单注册表（menu-permission-management-plan §5 schema）
# key = 权限点稳定标识（sys_permission.code，下发为 marschat-inframon:menu:<key>），与
# infra-monitor-web src/router/index.ts 的 permCode('menu','<key>') 严格对齐，禁止随意改名。
# 菜单源 = infra-monitor-web src/menus.ts（INFRA_MENUS，6 节点）。
# dashboard 为前端 skipPerm「常显」基础项（useMenus 短路、不参与权限过滤）；此处仍登记，
# 以保持「中心菜单树 = 应用菜单树」一致（与 kb-ops dashboard 同为 1 个顶层基础项）。
# 上报：auth-core MenuRegistryReporter 启动时全量覆盖上报到
# auth-center /internal/clients/marschat-inframon/menus（X-Client-Secret）。
client: marschat-inframon
menus:
  - key: dashboard
    title: 总览看板
    path: /dashboard
    order: 1
    # public=true → 「已登录即可见」：strict 默认最小权限下仍授予默认可见角色
    # （平台 user/admin + 本应用 user），保证普通用户登录后有落地页而不是一片空白。
    # 其余菜单与所有 api 点必须由应用角色显式授权（见 ADR §35.2 / AuthzPolicyService）。
    public: true
  - key: hosts
    title: 主机管理
    path: /hosts
    order: 2
  - key: credentials
    title: 凭据管理
    path: /credentials
    order: 3
  - key: configs
    title: 配置信息
    path: /configs
    order: 4
  - key: services
    title: 服务监控
    path: /services
    order: 5
  - key: users
    title: 用户管理
    path: /users
    order: 6
    min-role: admin

# 🔴 2026-09-15（P1 接口级鉴权）：api 权限点，随本 yml 全量上报为 type=api
# （sys_permission.code = 下面的 key，下发全码 = marschat-inframon:api:<key>），
# 供 @RequirePermission 消费。此前本应用 api 权限点为 **0 条**，写接口（主机/配置/服务/凭据的
# 增删改、数据导入）只有认证没有鉴权。
#
# 命名与 kb-ops 同构（hosts:create / credentials:update ...）。infra 的主机/配置/服务共用
# 通用 /items?type=... 端点，故统一收敛为 items:* 三个点（type 由请求参数区分）。
# 判定实现见 config/InfraPermissionChecker.java，fail-open 显式 false。
apis:
  - key: items:create
    title: 新增主机/配置/服务条目
  - key: items:update
    title: 编辑主机/配置/服务条目
  - key: items:delete
    title: 删除主机/配置/服务条目
  - key: credentials:create
    title: 新增凭据
  - key: credentials:update
    title: 编辑凭据
  - key: credentials:delete
    title: 删除凭据
  - key: io:import
    title: 导入数据（覆盖式）
