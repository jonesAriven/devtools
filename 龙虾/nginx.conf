user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # 你自己的配置 ↓↓↓ 全部放这里
server {
    listen 80;
    listen [::]:80;
    server_name openclaw.marschat.online;
    return 301 https://$host$request_uri;
}

# 主要的HTTPS服务器块
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openclaw.marschat.online;

    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/secure/.htpasswd;

    ssl_certificate     /home/safe/SSL/openclaw.marschat.online_bundle.pem;
    ssl_certificate_key /home/safe/SSL/openclaw.marschat.online.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

location = /__openclaw/control-ui-config.json {
    auth_basic off;
    proxy_pass http://127.0.0.1:18789;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Bearer fb3494b3620d7f4f8d8c5de9a83f4160a0cce49ccb3bbeff";
}

location /avatar/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18789;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Bearer fb3494b3620d7f4f8d8c5de9a83f4160a0cce49ccb3bbeff";
}

location /api/chat/media/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18789;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "Bearer fb3494b3620d7f4f8d8c5de9a83f4160a0cce49ccb3bbeff";
}

    location / {
        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-forwarded-user "laingzi";
        proxy_set_header x-forwarded-host $host;
        proxy_set_header X-Auth-Request-Email "huliang2019@163.com";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

}