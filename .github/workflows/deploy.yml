# ============================================================
# GitHub Actions — devtools 仓库 CI/CD 部署流水线
# ============================================================
#
# 🎯 核心特性:
#   ✅ workflow_dispatch 手动触发 + UI 下拉框（原生支持！）
#   ✅ 环境矩阵：dev / test / production
#   ✅ 项目选择：单选/多选/全部
#   ✅ Secrets 安全管理 SSH 密码等敏感信息
#   ✅ 并行构建各项目，互不阻塞
#
# 🔧 使用方式:
#   GitHub 仓库 → Actions → Deploy to Server → Run workflow
#   在弹出的表单中选择项目和环境即可
#
# ⏰ 定时任务: 取消注释 schedule 即可启用
#
# ➕ 新增项目:
#   1. 在 strategy.matrix.project 中添加一项
#   2. 确保 项目名/ci/deploy.sh 存在
#   完事！
# ============================================================

name: 🚀 Deploy to Server

on:
  # ---- 手动触发（UI 下拉框） ----
  workflow_dispatch:
    inputs:
      project:
        description: '📦 选择要部署的项目'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'mykng'
          - 'active-manager'
          # ↓ 新增项目在这里加选项
          # - 'kb-ops'
          # - 'myfrp'
          # - 'portal'
      environment:
        description: '🌍 部署目标环境'
        required: true
        default: 'production'
        type: choice
        options:
          - 'production'
          - 'dev'
          - 'test'

  # ---- 定时任务（可选，取消注释启用）----
  # schedule:
  #   - cron: '0 2 * * *'  # 每天凌晨 2 点 UTC (北京时间 10 点)
  #   - cron: '0 16 * * *' # 每天下午 4 点 UTC (北京时间午夜)

  # ---- push 触发（可选，如需自动部署可取消注释）----
  # push:
  #   branches: [master]
  #   paths:
  #     - 'mykng/**'
  #     - 'active-manager/**'

# ============================================================
# 全局环境变量
# ============================================================
env:
  MAVEN_OPTS: '-Xmx2048m'
  MAVEN_CLI: 'clean package -DskipTests -B -V -ntp'
  NEXUS_URL: 'https://nexus.marschat.online/repository/maven-public/'

# ============================================================
# 并发控制：同一分支只保留最新的运行
# ============================================================
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# ============================================================
# 权限最小化
# ============================================================
permissions:
  contents: read

jobs:
  # ================================
  # Job 0: 解析项目选择，生成构建矩阵
  # ================================
  prepare:
    name: 🎯 准备部署计划
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set-matrix.outputs.projects }}
      include: ${{ steps.set-matrix.outputs.include }}
    steps:
      - name: 解析项目选择
        id: set-matrix
        run: |
          PROJECT="${{ github.event.inputs.project }}"
          
          if [ "$PROJECT" = "all" ] || [ -z "$PROJECT" ]; then
            # 全部项目
            echo 'projects=["mykng","active-manager"]' >> $GITHUB_OUTPUT
            echo 'include=["mykng","active-manager"]' >> $GITHUB_OUTPUT
            echo "🔄 模式: 全部部署"
          else
            # 支持逗号分隔的多项目选择
            IFS=',' read -ra SELECTED <<< "$PROJECT"
            JSON="["
            FIRST=true
            for P in "${SELECTED[@]}"; do
              P=$(echo "$P" | xargs)  # trim
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                JSON+=","
              fi
              JSON+="\"$P\""
            done
            JSON+="]"
            
            echo "projects=$JSON" >> $GITHUB_OUTPUT
            echo "include=$JSON" >> $GITHUB_OUTPUT
            echo "🎯 模式: 选择部署 $JSON"
          fi
          
          echo "🌍 环境: ${{ github.event.inputs.environment }}"

  # ================================
  # Job 1: mykng 知识库微服务
  # ================================
  deploy-mykng:
    name: 📘 部署 mykng 知识库
    needs: prepare
    if: |
      contains(fromJSON(needs.prepare.outputs.projects), 'mykng')
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 📝 配置 Maven settings.xml (Nexus私服)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <mirrors>
              <mirror>
                <id>nexus</id>
                <mirrorOf>*</mirrorOf>
                <url>${NEXUS_URL}</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
          echo "✅ Maven 已配置 Nexus 私服（匿名访问）: ${NEXUS_URL}"

      - name: 🔨 Maven 编译 mykng
        run: |
          echo "============================================="
          echo "  [mykng] Maven 编译"
          echo "  环境: ${DEPLOY_ENV}"
          echo "  Maven 仓库: ${NEXUS_URL}"
          echo "============================================="
          cd mykng/kb-parent && mvn ${{ env.MAVEN_CLI }} && cd ../..
          echo "=== 编译产物 ==="
          ls -lh mykng/kb-gateway/target/*.jar \
                 mykng/kb-auth/target/*.jar \
                 mykng/kb-file/target/*.jar \
                 mykng/kb-knowledge/target/*.jar \
                 mykng/kb-intelligence/target/*.jar

      - name: 🚀 部署到目标服务器 (via FRP)
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.FRP_HOST }}
          username: root
          password: ${{ secrets.DEPLOY_PASS }}
          port: ${{ secrets.MYKNG_SSH_PORT }}
          script_timeout: 15m
          script: |
            cd /root/devtools
            
            # 同步最新代码
            git fetch origin
            git reset --hard origin/dev
            
            # 执行部署脚本
            chmod +x mykng/ci/deploy.sh
            bash mykng/ci/deploy.sh "${{ github.sha }}" "${{ github.ref_name }}" "${DEPLOY_ENV}"

  # ================================
  # Job 2: active-manager 激活码系统
  # ================================
  deploy-active-manager:
    name: 🔑 部署 active-manager 激活码
    needs: prepare
    if: |
      contains(fromJSON(needs.prepare.outputs.projects), 'active-manager')
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 📝 配置 Maven settings.xml (Nexus私服)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <mirrors>
              <mirror>
                <id>nexus</id>
                <mirrorOf>*</mirrorOf>
                <url>${NEXUS_URL}</url>
              </mirror>
            </mirrors>
          </settings>
          echo "✅ Maven 已配置 Nexus 私服（匿名访问）: ${NEXUS_URL}"

      - name: 🔨 Maven 编译 active-manager
        run: |
          echo "============================================="
          echo "  [active-manager] Maven 编译"
          echo "  环境: ${DEPLOY_ENV}"
          echo "  Maven 仓库: ${NEXUS_URL}"
          echo "============================================="
          cd active-manager/activation-code-server && mvn ${{ env.MAVEN_CLI }} && cd ../..
          echo "=== 编译产物 ==="
          ls -lh active-manager/activation-code-server/target/*.jar

      - name: 🚀 部署到目标服务器 (via FRP)
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.FRP_HOST }}
          username: root
          password: ${{ secrets.DEPLOY_PASS }}
          port: ${{ secrets.ACTIVE_MANAGER_SSH_PORT }}
          script_timeout: 10m
          script: |
            cd /root/devtools
            
            # 同步最新代码
            git fetch origin
            git reset --hard origin/dev
            
            # 执行部署脚本
            chmod +x active-manager/ci/deploy.sh
            bash active-manager/ci/deploy.sh "${{ github.sha }}" "${{ github.ref_name }}"

  # ================================
  # 🚀 快速新增项目模板
  # ================================
  # 复制下面的 job 块，改 5 个地方：
  #   ① job 名: deploy-<项目名>
  #   ② name: 显示名称
  #   ③ if: contains(..., '<项目名>')
  #   ④ host: ${{ secrets.<主机> }}
  #   ⑤ Maven 路径和 deploy.sh 路径
  #
  # 示例（kb-ops）:
  # deploy-kb-ops:
  #   name: ⚙️ 部署 kb-ops 运维平台
  #   needs: prepare
  #   if: contains(fromJSON(needs.prepare.outputs.projects), 'kb-ops')
  #   runs-on: ubuntu-latest
  #   ...
  # ============================================================

# ============================================================
# 📖 Secrets 配置清单（在 GitHub 仓库 Settings 中配置）
# ============================================================
# | Secret 名              | 用途             | 值                      |
# |------------------------|-----------------|-------------------------|
# | DEPLOY_PASS            | SSH 登录密码     | 目标机器的 root 密码    |
# | FRP_HOST               | FRP 服务端公网IP | 120.26.66.182           |
# | MYKNG_SSH_PORT         | mykng SSH 穿透端口 | 3385                    |
# | ACTIVE_MANAGER_SSH_PORT| 激活码 SSH 穿透端口 | 3383                    |
#
# 配置路径: Settings → Secrets and variables → Actions → New repository secret
# ============================================================
