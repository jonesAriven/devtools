# ============================================================
# Zadig Nginx 反向代理配置
# ============================================================
#
# 📌 部署位置: 腾讯云2号主机 (/etc/nginx/conf.d/zadig.conf)
# 🌐 域名: https://zadig.marschat.online
# 🔗 代理目标: mykng (100.93.36.113):8080 (通过 Tailscale)
#
# ⚠️ 使用前请确保:
#   1. SSL 证书已申请（泛域名 *.marschat.online 或单域名）
#   2. Tailscale 网络已连通（腾讯云2号 ↔ mykng）
#   3. DNS 已解析 zadig.marschat.online → 腾讯云2号 IP
#
# 🔧 安装方法:
#   1. 复制本文件到 /etc/nginx/conf.d/zadig.conf
#   2. 修改证书路径（如果需要）
#   3. nginx -t && nginx -s reload
#
# ============================================================

# HTTP → HTTPS 重定向（可选，如果已有全局重定向可删除此段）
server {
    listen 80;
    server_name zadig.marschat.online;
    
    # Let's Encrypt 验证（如果使用 certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name zadig.marschat.online;

    # ================================
    # SSL 证书配置（根据实际情况修改路径）
    # ================================
    # 方案1: 泛域名证书（推荐，与现有服务共用）
    ssl_certificate     /etc/nginx/ssl/marschat.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/marschat.online/privkey.pem;
    
    # 方案2: 单域名证书（如果有单独的证书）
    # ssl_certificate     /etc/nginx/ssl/zadig.marschat.online/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/zadig.marschat.online/privkey.pem;

    # ================================
    # SSL 安全配置
    # ================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ================================
    # 日志配置
    # ================================
    access_log /var/log/nginx/zadig.access.log;
    error_log  /var/log/nginx/zadig.error.log;

    # ================================
    # 反向代理到 Zadig（mykng 服务器）
    # ================================
    location / {
        proxy_pass http://100.93.36.113:8080;  # Tailscale IP
        
        # 标准代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持（Zadig 实时日志、构建状态等需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # ================================
        # 超时时间配置（重要！Zadig 构建可能耗时较长）
        # ================================
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;   # 5 分钟（构建日志推送）
        proxy_read_timeout    300s;   # 5 分钟（等待响应）
        
        # 缓冲配置（禁用缓冲以支持流式输出）
        proxy_buffering off;
        proxy_cache off;
        
        # 文件上传大小限制（如果需要上传文件）
        client_max_body_size 100m;
    }

    # ================================
    # API 接口（可选：更长的超时时间）
    # ================================
    location /api {
        proxy_pass http://100.93.36.113:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API 可以有更长的超时
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;   # 10 分钟
        proxy_read_timeout    600s;   # 10 分钟
    }

    # ================================
    # 健康检查端点（用于负载均衡器或监控）
    # ================================
    location /healthz {
        proxy_pass http://100.93.36.113:8080;
        access_log off;
    }
}

# ============================================================
# 📋 配置说明与故障排查
# ============================================================
#
# ✅ 正常访问流程:
#   用户浏览器 → https://zadig.marschat.online
#     → 腾讯云2号 Nginx (443/SSL 终结)
#       → Tailscale VPN (加密隧道)
#         → mykng:8080 (Zadig 容器)
#
# ⚠️ 常见问题:
#
# Q1: 502 Bad Gateway？
# A1: 检查 Tailscale 连通性：
#     ping 100.93.36.113
#     curl http://100.93.36.113:8080
#
# Q2: 504 Gateway Timeout？
# A2: 构建/编译任务耗时过长导致。
#     解决：增加 proxy_read_timeout（已设置为 300s）
#
# Q3: WebSocket 断连？
# A3: 确保以下头已设置：
#     - Upgrade: websocket
#     - Connection: upgrade
#     - proxy_http_version 1.1
#
# Q4: SSL 证书错误？
# A4: 检查证书路径和权限：
#     ls -la /etc/nginx/ssl/marschat.online/
#     nginx -t  # 测试配置语法
#
# 🔧 性能优化建议:
#   1. 启用 Gzip 压缩（在 http 块中添加）
#   2. 配置缓存静态资源
#   3. 启用 HTTP/2（已启用）
#   4. 考虑添加 Rate Limiting（防 DDoS）
#
# ============================================================
