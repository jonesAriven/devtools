# ============================================================
# Woodpecker CI — devtools 统一流水线
# ============================================================
# 架构: 6条 build→deploy 链，depends_on 控制串并行
#
# 串并行规则:
#   - 6个 build 全并行 (各自独立 CI 容器)
#   - 同 compose project 的 deploy 串行 (depends_on 控制)
#   - 不同 compose project 的 deploy 并行
#   - 改串并行只需动 depends_on，不用改脚本
#
# 依赖图:
#
#   sync-ci-scripts
#     ├── mykng-build ─────→ mykng-deploy ──────────────────┐
#     ├── kb-ops-build ────→ kb-ops-deploy (after mykng)    │ kb-app 串行
#     ├── kb-ops-web-build → kb-ops-web-deploy ──────────┐   │
#     ├── infra-web-build → infra-web-deploy (after ops-web) │ kb-web 串行
#     ├── infra-mon-build → infra-mon-deploy             │   │ 独立并行
#     └── active-mgr-build → active-mgr-deploy           │   │ 独立并行
#                                                         ↓   ↓
#                                                      cleanup
#
# 参数化 (手动触发时设置 DEPLOY_TARGET):
#   all (默认)          → 全部
#   mykng / kb-ops / kb-ops-web / infra-monitor-web / infra-monitor / active-manager
# ============================================================

when:
  event:
    - manual
    - push
  branch:
    - dev

steps:
  # ==================== 共享: 同步CI脚本 ====================
  - name: sync-ci-scripts
    image: bash:5.2
    volumes:
      - /mnt/shared:/mnt/shared
    commands:
      - mkdir -p /mnt/shared/woodDeploy/ci /mnt/shared/woodDeploy/publish
      - rm -f /mnt/shared/woodDeploy/ci/*.sh
      - for f in ci/*.sh; do cat "$f" > "/mnt/shared/woodDeploy/ci/$(basename "$f")"; done
      - sed -i 's/\r$//' /mnt/shared/woodDeploy/ci/*.sh
      - chmod +x /mnt/shared/woodDeploy/ci/*.sh
      - echo "=== Syntax check ==="
      - 'bash -n /mnt/shared/woodDeploy/ci/env.sh && echo "env.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/lib-build.sh && echo "lib-build.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/lib-deploy.sh && echo "lib-deploy.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/build-mykng.sh && echo "build-mykng.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/build-kb-ops.sh && echo "build-kb-ops.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/build-kb-ops-web.sh && echo "build-kb-ops-web.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/build-infra-monitor-web.sh && echo "build-infra-monitor-web.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/build-infra-monitor.sh && echo "build-infra-monitor.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/build-active-manager.sh && echo "build-active-manager.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/deploy-mykng.sh && echo "deploy-mykng.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/deploy-kb-ops.sh && echo "deploy-kb-ops.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/deploy-kb-ops-web.sh && echo "deploy-kb-ops-web.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/deploy-infra-monitor-web.sh && echo "deploy-infra-monitor-web.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/deploy-infra-monitor.sh && echo "deploy-infra-monitor.sh: OK"'
      - 'bash -n /mnt/shared/woodDeploy/ci/deploy-active-manager.sh && echo "deploy-active-manager.sh: OK"'
      - echo "=== CI scripts synced ==="
      - ls -la /mnt/shared/woodDeploy/ci/

  # ==================== 1. mykng (5个Java微服务) ====================
  - name: mykng-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx2048m
    depends_on: [sync-ci-scripts]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "mykng"'
    commands:
      - bash ci/build-mykng.sh

  - name: mykng-deploy
    image: appleboy/drone-ssh
    depends_on: [mykng-build]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "mykng"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodDeploy/ci/deploy-mykng.sh mykng-latest.tar.gz

  # ==================== 2. kb-ops (运维平台后端) ====================
  - name: kb-ops-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops"'
    commands:
      - bash ci/build-kb-ops.sh

  - name: kb-ops-deploy
    image: appleboy/drone-ssh
    depends_on: [kb-ops-build, mykng-deploy]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodDeploy/ci/deploy-kb-ops.sh kb-ops-latest.tar.gz

  # ==================== 3. kb-ops-web (运维平台前端) ====================
  - name: kb-ops-web-build
    image: node:20-alpine
    volumes:
      - /mnt/shared:/mnt/shared
    depends_on: [sync-ci-scripts]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops-web"'
    commands:
      - bash ci/build-kb-ops-web.sh

  - name: kb-ops-web-deploy
    image: appleboy/drone-ssh
    depends_on: [kb-ops-web-build]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops-web"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodDeploy/ci/deploy-kb-ops-web.sh kb-ops-web-latest.tar.gz

  # ==================== 4. infra-monitor-web (监控前端) ====================
  - name: infra-monitor-web-build
    image: node:20-alpine
    volumes:
      - /mnt/shared:/mnt/shared
    depends_on: [sync-ci-scripts]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor-web"'
    commands:
      - bash ci/build-infra-monitor-web.sh

  - name: infra-monitor-web-deploy
    image: appleboy/drone-ssh
    depends_on: [infra-monitor-web-build, kb-ops-web-deploy]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor-web"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodDeploy/ci/deploy-infra-monitor-web.sh infra-monitor-web-latest.tar.gz

  # ==================== 5. infra-monitor (监控后端) ====================
  - name: infra-monitor-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor"'
    commands:
      - bash ci/build-infra-monitor.sh

  - name: infra-monitor-deploy
    image: appleboy/drone-ssh
    depends_on: [infra-monitor-build]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodDeploy/ci/deploy-infra-monitor.sh infra-monitor-latest.tar.gz

  # ==================== 6. active-manager (激活码系统) ====================
  - name: active-manager-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "active-manager"'
    commands:
      - bash ci/build-active-manager.sh

  - name: active-manager-deploy
    image: appleboy/drone-ssh
    depends_on: [active-manager-build]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "active-manager"'
    settings:
      host: 192.168.31.182
      username: root
      key:
        from_secret: ssh_key_debian
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodDeploy/ci/deploy-active-manager.sh active-manager-latest.tar.gz

  # ==================== 清理 ====================
  - name: cleanup
    image: appleboy/drone-ssh
    depends_on:
      - kb-ops-deploy
      - infra-monitor-web-deploy
      - infra-monitor-deploy
      - active-manager-deploy
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 5m
      script:
        - docker container prune -f 2>/dev/null || true
        - docker image prune -f 2>/dev/null || true
        - docker builder prune -f 2>/dev/null || true
        - echo "cleanup done"
