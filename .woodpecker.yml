      - ls -lh publish/infra-monitor/
      - echo ">>> [3/3] 打包并推送到共享目录 <<<"
      - tar czf publish/infra-monitor-latest.tar.gz -C publish/infra-monitor .
      - cp publish/infra-monitor-latest.tar.gz /mnt/shared/devtools/publish/
      - test -f /mnt/shared/devtools/publish/infra-monitor-latest.tar.gz || { echo "❌ 产物未写入"; exit 1; }
