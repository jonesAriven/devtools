# ============================================================
# Woodpecker CI/CD — devtools 仓库
# ============================================================
#
# 📌 设计原则（用户要求）:
#   1. 每个应用独立一个手动触发的 Pipeline
#   2. 初次写脚本时先检查服务器上应用的实际情况
#   3. 部署前必须删除旧应用，防止孤儿容器
#   4. 使用旧的应用路径和端口
#
# 🎯 触发方式:
#   Woodpecker UI → 仓库 → Run → 选择 Pipeline → 填写参数
#
# 📖 项目清单:
#   ├── mykng-cicd          → 📘 知识库微服务 (mykng:100.93.36.113)
#   ├── active-manager-cicd → 🔑 激活码系统 (内网Debian:192.168.31.182)
#   ├── kb-ops-cicd         → ⚙️ 运维平台 (mykng:100.93.36.113)
#   ├── infra-monitor-cicd  → 📊 基础设施监控 (mykng:100.93.36.113)
#   ├── myfrp-cicd          → 🌐 FRP管理面板 (内网Debian:192.168.31.182)
#   └── portal-cicd         → 🚪 门户系统 (mykng:100.93.36.113)
#
# 🔐 Secrets 配置:
#   deploy_pass_mykng    → mykng 服务器 SSH 密码 (Hwx@1120930)
#   deploy_pass_lan      → 内网Debian SSH 密码
# ============================================================

# ============================================================
# Pipeline 1: mykng 知识库微服务
# ============================================================
# 服务器检查结果 (2026-07-07):
#   📍 部署位置: mykng (100.93.36.113)
#   📁 代码目录: /root/devtools/mykng
#   🐳 Docker Compose Project: kb-deploy (production)
#   🔌 端口映射:
#     kb-gateway    : 8090(宿主机) → 8080(容器) ← API网关入口
#     kb-auth       : 8081(容器内网)
#     kb-file       : 8082(容器内网)
#     kb-knowledge  : 8083(容器内网)
#     kb-intelligence: 8086(容器内网)
#   ✅ 当前状态: 全部运行中
#   📦 包含5个子服务 + 基础设施(mysql/redis/nacos/mongo/minio/meilisearch)
# ============================================================

when:
  event:
    - manual
  branch:
    - dev
    - master

variables:
  DEPLOY_TARGET: production
  BRANCH: dev

steps:
  - name: check-env
    image: alpine:3.19
    commands:
      - echo "=== 📘 mykng 知识库微服务 CI/CD ==="
      - echo "部署目标: ${DEPLOY_TARGET:-production}"
      - echo "分支: ${BRANCH:-dev}"

  - name: build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /root/.m2:/root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - echo "=== Maven 编译 mykng ==="
      - cd mykng/kb-parent && mvn clean package -DskipTests -B -V -ntp && cd ../..
      - echo "=== 编译产物 ==="
      - ls -lh mykng/kb-gateway/target/*.jar mykng/kb-auth/target/*.jar mykng/kb-file/target/*.jar mykng/kb-knowledge/target/*.jar mykng/kb-intelligence/target/*.jar || true

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      password:
        from_secret: deploy_pass_mykng
      port: 22
      script_timeout: 20m
      command_timeout: 5m
    script:
      - chmod +x /root/devtools/mykng/ci/deploy.sh
      - bash /root/devtools/mykng/ci/deploy.sh "${CI_COMMIT_SHA}" "${BRANCH:-dev}" "${DEPLOY_TARGET:-production}"

