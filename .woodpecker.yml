      - ls -lh publish/infra-monitor-web/
      - echo ">>> [3/3] 打包并推送到共享目录 <<<"
      - tar czf publish/infra-monitor-web-latest.tar.gz -C publish/infra-monitor-web .
      - cp publish/infra-monitor-web-latest.tar.gz /mnt/shared/devtools/publish/
      - test -f /mnt/shared/devtools/publish/infra-monitor-web-latest.tar.gz || { echo "❌ 产物未写入"; exit 1; }
      - echo "✅ infra-monitor-web 构建完成"

  - name: infra-monitor-web-deploy
    image: appleboy/drone-ssh
    depends_on: [infra-monitor-web-build]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor-web"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/devtools/ci/deploy-infra-monitor-web.sh infra-monitor-web-latest.tar.gz

  # ==================== 5. infra-monitor 基础设施监控 ====================
  - name: infra-monitor-build
    image: maven:3.9-eclipse-temurin-21
