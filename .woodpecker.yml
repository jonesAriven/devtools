when:
  event:
    - manual
    - push
  branch:
    - dev
    - master

steps:
  # ========== mykng 知识库部署 ==========
  - name: mykng-build
    image: maven:3.9-eclipse-temurin-21
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - cd mykng/kb-parent && mvn clean package -DskipTests -B -V -ntp && cd ../..
      - ls target/*.jar || true

  - name: mykng-deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_timeout: 20m
    script: |
      hostname
      whoami
      chmod +x /root/devtools/mykng/ci/deploy.sh
      bash /root/devtools/mykng/ci/deploy.sh test dev production

  # ========== active-manager 激活码系统部署 ==========
  - name: active-manager-build
    image: maven:3.9-eclipse-temurin-21
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - cd active-manager/activation-code-server && mvn clean package -DskipTests -B -V -ntp && cd ../..
      - ls active-manager/activation-code-server/target/*.jar || true

  - name: active-manager-deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.105.196.63
      username: root01
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_timeout: 20m
    script: |
      hostname
      whoami
      chmod +x /root/devtools/active-manager/ci/deploy.sh
      bash /root/devtools/active-manager/ci/deploy.sh $(git rev-parse --short HEAD) dev
