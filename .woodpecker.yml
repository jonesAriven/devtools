when:
  event:
    - manual
  branch:
    - dev
    - master

variables:
  BRANCH: dev

steps:
  - name: check-env
    image: alpine:3.19
    commands:
      - echo "=== ⚙️ kb-ops 运维平台 CI/CD ==="
      - echo "部署目标: mykng (100.93.36.113)"
      - echo "分支: ${BRANCH:-dev}"

  - name: build-backend
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /root/.m2:/root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx1024m
    commands:
      - echo "=== Maven 编译 kb-ops 后端 ==="
      - cd kb-ops && mvn clean package -DskipTests -B -V -ntp && cd ..
      - ls -lh kb-ops/target/*.jar || true

  - name: build-frontend
    image: node:20-alpine
    commands:
      - echo "=== 构建 kb-ops 前端 ==="
      - cd kb-ops/kb-ops-web
      - if [ -f pnpm-lock.yaml ]; then corepack enable pnpm && pnpm install --registry=https://registry.npmmirror.com && pnpm build; else npm ci --registry=https://registry.npmmirror.com && npm run build; fi
      - ls -la dist/ | head -10 || echo "⚠️ dist 不存在"

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      password:
        from_secret: deploy_pass_mykng
      port: 22
      script_timeout: 15m
      command_timeout: 5m
    script:
