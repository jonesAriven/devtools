# ============================================================
# Woodpecker CI — devtools 统一流水线
# ============================================================
# 架构:
#   sync-ci-scripts (共享第一步)
#     ├── mykng-build ──> mykng-deploy       (5个Java微服务)
#     ├── kb-ops-build ──> kb-ops-deploy     (1个Java微服务)
#     ├── web-build ──> web-deploy           (2个前端+1个静态)
#     ├── infra-monitor-build ──> infra-monitor-deploy  (1个Java)
#     └── active-manager-build ──> active-manager-deploy (1个Java)
#
# 隔离性:
#   - 5条 build→deploy 链完全并行，互不依赖
#   - 每条链只 depends_on: [sync-ci-scripts]
#   - 任一链失败不影响其他链
# ============================================================

when:
  event:
    - manual
    - push
  branch:
    - dev

steps:
  # ==================== 共享: 同步CI脚本 ====================
  - name: sync-ci-scripts
    image: alpine
    volumes:
      - /mnt/shared:/mnt/shared
    commands:
      - mkdir -p /mnt/shared/devtools/ci /mnt/shared/devtools/publish
      - cp ci/*.sh /mnt/shared/devtools/ci/
      - chmod +x /mnt/shared/devtools/ci/*.sh
      - echo "✅ CI 脚本已同步到共享目录"
      - ls -la /mnt/shared/devtools/ci/

  # ==================== 1. mykng 知识库 (5个Java微服务) ====================
  - name: mykng-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx2048m
    depends_on: [sync-ci-scripts]
    commands:
      - set -e
      - echo ">>> [1/3] Maven 编译 mykng (5个微服务) <<<"
      - cd mykng/kb-parent && mvn clean package -DskipTests -B -V -ntp -T 2C -Djacoco.skip=true -Dmaven.repo.local=/root/.m2/repository
      - cd ../..
      - echo ">>> [2/3] 收集构建产物 <<<"
      - mkdir -p publish/mykng
      - cp mykng/kb-gateway/target/kb-gateway.jar publish/mykng/ && echo "  ✅ kb-gateway"
      - cp mykng/kb-auth/target/kb-auth.jar publish/mykng/ && echo "  ✅ kb-auth"
      - cp mykng/kb-file/target/kb-file.jar publish/mykng/ && echo "  ✅ kb-file"
      - cp mykng/kb-knowledge/target/kb-knowledge.jar publish/mykng/ && echo "  ✅ kb-knowledge"
      - cp mykng/kb-intelligence/target/kb-intelligence.jar publish/mykng/ && echo "  ✅ kb-intelligence"
      - ls -lh publish/mykng/
      - echo ">>> [3/3] 打包并推送到共享目录 <<<"
      - tar czf publish/mykng-latest.tar.gz -C publish/mykng .
      - cp publish/mykng-latest.tar.gz /mnt/shared/devtools/publish/
      - test -f /mnt/shared/devtools/publish/mykng-latest.tar.gz || { echo "❌ 产物未写入"; exit 1; }
      - echo "✅ mykng 构建完成"

  - name: mykng-deploy
    image: appleboy/drone-ssh
    depends_on: [mykng-build]
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: true
      command_timeout: 30m
      script:
        - bash /mnt/shared/devtools/ci/deploy-mykng.sh mykng-latest.tar.gz

  # ==================== 2. kb-ops 运维平台 (独立Java微服务) ====================
  - name: kb-ops-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    commands:
      - set -e
      - echo ">>> [1/3] Maven 编译 kb-ops <<<"
      - cd kb-ops && mvn clean package -DskipTests -B -V -ntp -Djacoco.skip=true -Dmaven.repo.local=/root/.m2/repository
      - cd ..
      - echo ">>> [2/3] 收集构建产物 <<<"
      - mkdir -p publish/kb-ops
      - cp kb-ops/target/kb-ops.jar publish/kb-ops/
      - ls -lh publish/kb-ops/
      - echo ">>> [3/3] 打包并推送到共享目录 <<<"
      - tar czf publish/kb-ops-latest.tar.gz -C publish/kb-ops .
      - cp publish/kb-ops-latest.tar.gz /mnt/shared/devtools/publish/
      - test -f /mnt/shared/devtools/publish/kb-ops-latest.tar.gz || { echo "❌ 产物未写入"; exit 1; }
      - echo "✅ kb-ops 构建完成"

  - name: kb-ops-deploy
    image: appleboy/drone-ssh
    depends_on: [kb-ops-build]
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: true
      command_timeout: 30m
      script:
        - bash /mnt/shared/devtools/ci/deploy-kb-ops.sh kb-ops-latest.tar.gz

  # ==================== 3. 前端容器层 (2个Vue前端 + 1个静态) ====================
  - name: web-build
    image: node:20-alpine
    volumes:
      - /mnt/shared:/mnt/shared
    depends_on: [sync-ci-scripts]
    failure: ignore
    commands:
      - npm install -g pnpm
      - pnpm config set registry http://nexus.marschat.online/repository/npm-public/
      - pnpm config set fetch-retries 5
      - pnpm config set fetch-retry-factor 2
      - pnpm config set fetch-retry-mintimeout 20000
      - pnpm config set fetch-retry-maxtimeout 120000
      - pnpm config set network-concurrency 1
      - echo ">>> [1/4] 构建 kb-ops-web <<<"
      - cd kb-ops/kb-ops-web
      - pnpm install --no-frozen-lockfile || pnpm install --no-frozen-lockfile || pnpm install
      - pnpm build
      - cd ../..
      - echo ">>> [2/4] 构建 infra-monitor-web <<<"
      - cd infra-monitor/infra-monitor-web
      - pnpm install --no-frozen-lockfile || pnpm install --no-frozen-lockfile || pnpm install
      - pnpm build
      - cd ../..
      - echo ">>> [3/4] 收集前端产物 <<<"
      - mkdir -p publish/web/kb-ops-web publish/web/infra-monitor-web
      - cp -r kb-ops/kb-ops-web/dist/* publish/web/kb-ops-web/
      - cp -r infra-monitor/infra-monitor-web/dist/* publish/web/infra-monitor-web/
      - echo ">>> [4/4] 打包并推送到共享目录 <<<"
      - tar czf publish/web-latest.tar.gz -C publish/web .
      - cp publish/web-latest.tar.gz /mnt/shared/devtools/publish/
      - test -f /mnt/shared/devtools/publish/web-latest.tar.gz || { echo "❌ 产物未写入"; exit 1; }
      - echo "✅ 前端构建完成"

  - name: web-deploy
    image: appleboy/drone-ssh
    depends_on: [web-build]
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: true
      command_timeout: 30m
      script:
        - bash /mnt/shared/devtools/ci/deploy-kb-web.sh web-latest.tar.gz

  # ==================== 4. infra-monitor 基础设施监控 ====================
  - name: infra-monitor-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    commands:
      - set -e
      - echo ">>> [1/3] Maven 编译 infra-monitor <<<"
      - cd infra-monitor/infra-monitor-server && mvn clean package -DskipTests -B -V -ntp -Djacoco.skip=true -Dmaven.repo.local=/root/.m2/repository
      - cd ../..
      - echo ">>> [2/3] 收集构建产物 <<<"
      - mkdir -p publish/infra-monitor
      - cp infra-monitor/infra-monitor-server/target/infra-monitor.jar publish/infra-monitor/
      - ls -lh publish/infra-monitor/
      - echo ">>> [3/3] 打包并推送到共享目录 <<<"
      - tar czf publish/infra-monitor-latest.tar.gz -C publish/infra-monitor .
      - cp publish/infra-monitor-latest.tar.gz /mnt/shared/devtools/publish/
      - test -f /mnt/shared/devtools/publish/infra-monitor-latest.tar.gz || { echo "❌ 产物未写入"; exit 1; }
      - echo "✅ infra-monitor 构建完成"

  - name: infra-monitor-deploy
    image: appleboy/drone-ssh
    depends_on: [infra-monitor-build]
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: true
      command_timeout: 30m
      script:
        - bash /mnt/shared/devtools/ci/deploy-infra-monitor.sh infra-monitor-latest.tar.gz

  # ==================== 5. active-manager 激活码系统 ====================
  - name: active-manager-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    commands:
      - set -e
      - echo ">>> [1/3] Maven 编译 active-manager <<<"
      - cd active-manager/activation-code-server && mvn clean package -DskipTests -B -V -ntp -Djacoco.skip=true -Dmaven.repo.local=/root/.m2/repository
      - cd ../..
      - echo ">>> [2/3] 收集构建产物 <<<"
      - mkdir -p publish/active-manager
      - cp active-manager/activation-code-server/target/activation-code-server-*.jar publish/active-manager/
      - ls -lh publish/active-manager/
      - echo ">>> [3/3] 打包并推送到共享目录 <<<"
      - tar czf publish/active-manager-latest.tar.gz -C publish/active-manager .
      - cp publish/active-manager-latest.tar.gz /mnt/shared/devtools/publish/
      - test -f /mnt/shared/devtools/publish/active-manager-latest.tar.gz || { echo "❌ 产物未写入"; exit 1; }
      - echo "✅ active-manager 构建完成"

  - name: active-manager-deploy
    image: appleboy/drone-ssh
    depends_on: [active-manager-build]
    settings:
      host: 192.168.31.182
      username: root
      key:
        from_secret: ssh_key_debian
      port: 22
      script_stop: true
      command_timeout: 30m
      script:
        - bash /mnt/shared/devtools/ci/deploy-active-manager.sh active-manager-latest.tar.gz
