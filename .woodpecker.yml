when:
  event:
    - manual
  branch:
    - dev
    - master

steps:
  - name: check-env
    image: alpine:3.19
    commands:
      - echo hello
      - pwd

  - name: build
    image: maven:3.9-eclipse-temurin-21
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - cd mykng/kb-parent && mvn clean package -DskipTests -B -V -ntp && cd ../..
      - ls target/*.jar || true

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      key: |
        -----BEGIN OPENSSH PRIVATE KEY-----
        b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
        QyNTUxOQAAACArq6+5xwBN8u9EzMR5EG2eSYk/TqFdIrvonGyzswEMJgAAAJh/t5QYf7eU
        GAAAAAtzc2gtZWQyNTUxOQAAACArq6+5xwBN8u9EzMR5EG2eSYk/TqFdIrvonGyzswEMJg
        AAAEDxpQBplZMOgGe/gN2D4AH5CA14PDDcJfhdRLYNo2X4qSurr7nHAE3y70TMxHkQbZ5J
        iT9OoV0iu+icbLOzAQwmAAAAEXJvb3RAbXlrbmctZGViYWluAQIDBA==
        -----END OPENSSH PRIVATE KEY-----
      port: 22
      script_timeout: 20m
    script: |
      hostname
      whoami
      chmod +x /root/devtools/mykng/ci/deploy.sh
      bash /root/devtools/mykng/ci/deploy.sh test dev production
