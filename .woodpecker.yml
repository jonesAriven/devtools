# ============================================================
# Woodpecker CI - devtools 自动化构建与部署
# ============================================================
# 架构:
#   Build Step:  Maven 编译 -> 收集 jar -> 打包 tar.gz (带时间戳) -> /mnt/shared
#   Deploy Step: SSH 到目标服务器 -> 从共享目录取包 -> 解压 -> docker compose 部署
#
# 项目映射:
#   mykng          -> 部署到 mykng (120.26.66.182:3385)
#   active-manager  -> 部署到内网Debian (192.168.31.182)
#
# 域名访问:
#   mykng:         公网 IP 直连各端口
#   active-manager: https://tools.marschat.online/activecode/
# ============================================================

when:
  event:
    - manual
    - push
  branch:
    - dev

steps:
  # ==================== mykng 知识库微服务 ====================
  - name: mykng-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - set -e
      - echo ">>> [1/4] Maven 编译 mykng <<<"
      - cd mykng/kb-parent && mvn clean package -DskipTests -B -V -ntp
      - cd ../..
      - echo ">>> [2/4] 收集构建产物 <<<"
      - mkdir -p publish/mykng
      - cp mykng/kb-gateway/target/kb-gateway.jar publish/mykng/ && echo "  ✅ kb-gateway"
      - cp mykng/kb-auth/target/kb-auth.jar publish/mykng/ && echo "  ✅ kb-auth"
      - cp mykng/kb-file/target/kb-file.jar publish/mykng/ && echo "  ✅ kb-file"
      - cp mykng/kb-knowledge/target/kb-knowledge.jar publish/mykng/ && echo "  ✅ kb-knowledge"
      - cp mykng/kb-intelligence/target/kb-intelligence.jar publish/mykng/ && echo "  ✅ kb-intelligence"
      - ls -lh publish/mykng/
      - echo ">>> [3/4] 打包发布产物 <<<"
      - TIMESTAMP=$(date +%Y%m%d-%H%M)
      - tar czf "publish/mykng-${TIMESTAMP}.tar.gz" -C publish/mykng .
      - cp "publish/mykng-${TIMESTAMP}.tar.gz" publish/mykng-latest.tar.gz
      - echo ">>> [4/4] 推送到共享目录 <<<"
      - mkdir -p /mnt/shared/devtools/publish
      - cp "publish/mykng-${TIMESTAMP}.tar.gz" /mnt/shared/devtools/publish/
      - cp "publish/mykng-latest.tar.gz" /mnt/shared/devtools/publish/
      - echo ">>> 验证共享目录产物 <<<"
      - ls -lh /mnt/shared/devtools/publish/mykng-*.tar.gz
      - test -f /mnt/shared/devtools/publish/mykng-latest.tar.gz || { echo "❌ 产物未写入共享目录"; exit 1; }
      - echo "BUILD_OK=mykng-${TIMESTAMP}.tar.gz"

  - name: mykng-deploy
    image: appleboy/drone-ssh
    depends_on: [mykng-build]
    settings:
      host: 120.26.66.182
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 3385
      script_stop: true
      command_timeout: 30m
      debug: true
      script:
        - set -e
        - echo "=== 开始部署 mykng ==="
        - date && whoami && hostname
        - test -f /mnt/shared/devtools/publish/mykng-latest.tar.gz || { echo "❌ 产物不存在"; exit 1; }
        - bash /mnt/shared/devtools/ci/deploy-mykng.sh mykng-latest.tar.gz

  # ==================== active-manager 激活码系统 ====================
  - name: active-manager-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - set -e
      - echo ">>> [1/4] Maven 编译 active-manager <<<"
      - cd active-manager/activation-code-server && mvn clean package -DskipTests -B -V -ntp
      - cd ../..
      - echo ">>> [2/4] 验证构建产物 <<<"
      - ls -lh active-manager/activation-code-server/target/activation-code-server-*.jar
      - JAR_COUNT=$(ls active-manager/activation-code-server/target/activation-code-server-*.jar 2>/dev/null | wc -l)
      - test "$JAR_COUNT" -gt 0 || { echo "❌ 未找到 jar 文件"; exit 1; }
      - echo "✅ 找到 ${JAR_COUNT} 个 jar 文件"
      - echo ">>> [3/4] 收集构建产物 <<<"
      - mkdir -p publish/active-manager
      - cp active-manager/activation-code-server/target/activation-code-server-*.jar publish/active-manager/
      - ls -lh publish/active-manager/
      - echo ">>> [4/4] 打包并推送到共享目录 <<<"
      - TIMESTAMP=$(date +%Y%m%d-%H%M)
      - tar czf "publish/active-manager-${TIMESTAMP}.tar.gz" -C publish/active-manager .
      - cp "publish/active-manager-${TIMESTAMP}.tar.gz" publish/active-manager-latest.tar.gz
      - mkdir -p /mnt/shared/devtools/publish
      - cp "publish/active-manager-${TIMESTAMP}.tar.gz" /mnt/shared/devtools/publish/
      - cp "publish/active-manager-latest.tar.gz" /mnt/shared/devtools/publish/
      - echo ">>> 验证共享目录产物 <<<"
      - ls -lh /mnt/shared/devtools/publish/active-manager-*.tar.gz
      - test -f /mnt/shared/devtools/publish/active-manager-latest.tar.gz || { echo "❌ 产物未写入共享目录"; exit 1; }
      - echo "BUILD_OK=active-manager-${TIMESTAMP}.tar.gz"

  - name: active-manager-deploy
    image: appleboy/drone-ssh
    depends_on: [active-manager-build]
    settings:
      host: 192.168.31.182
      username: root
      key:
        from_secret: ssh_key_debian
      port: 22
      script_stop: true
      command_timeout: 20m
      debug: true
      script:
        - set -e
        - echo "=== 开始部署 active-manager ==="
        - date && whoami && hostname
        - test -f /mnt/shared/devtools/publish/active-manager-latest.tar.gz || { echo "❌ 产物不存在"; exit 1; }
        - ls -lh /mnt/shared/devtools/publish/active-manager-latest.tar.gz
        - bash /mnt/shared/devtools/ci/deploy-active-manager.sh active-manager-latest.tar.gz
