    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/devtools/ci/deploy-infra-monitor.sh infra-monitor-latest.tar.gz

  # ==================== 6. active-manager 激活码系统 ====================
