# ============================================================
# Woodpecker CI — devtools 统一流水线
# ============================================================
# 架构: 6条独立 CI→CD 链，完全并行，互不依赖
#
#   sync-ci-scripts (共享第一步)
#     ├── mykng-build → mykng-deploy                        (5个Java微服务)
#     ├── kb-ops-build → kb-ops-deploy                       (1个Java微服务)
#     ├── kb-ops-web-build → kb-ops-web-deploy               (1个前端)
#     ├── infra-monitor-web-build → infra-monitor-web-deploy  (1个前端)
#     ├── infra-monitor-build → infra-monitor-deploy          (1个Java)
#     └── active-manager-build → active-manager-deploy        (1个Java)
#                                                            ↓
#                                                         cleanup
#
# 参数化 (手动触发时设置 DEPLOY_TARGET 变量):
#   all (默认)          → 部署全部 6 个项目
#   mykng               → 仅部署 mykng (5个微服务)
#   kb-ops              → 仅部署 kb-ops
#   kb-ops-web          → 仅部署 kb-ops-web 前端
#   infra-monitor-web   → 仅部署 infra-monitor-web 前端
#   infra-monitor       → 仅部署 infra-monitor
#   active-manager      → 仅部署 active-manager
#
# push 事件: 自动部署全部
# ============================================================

when:
  event:
    - manual
    - push
  branch:
    - dev

steps:
  # ==================== 共享: 同步CI脚本 ====================
  - name: sync-ci-scripts
    image: alpine
    volumes:
      - /mnt/shared:/mnt/shared
    commands:
      - mkdir -p /mnt/shared/devtools/ci /mnt/shared/devtools/publish
      # 用 sed 删除可能的 Windows CRLF (\r)，避免 bash 解析 EOF 错误
      - for f in ci/*.sh; do sed 's/\r$//' "$f" > "/mnt/shared/devtools/ci/$(basename "$f")"; done
      - chmod +x /mnt/shared/devtools/ci/*.sh
      - echo "✅ CI 脚本已同步到共享目录 (CRLF已清理)"
      # 验证: 输出每个文件的行数和 md5，确保文件完整
      - for f in /mnt/shared/devtools/ci/*.sh; do echo "$(basename $f): $(wc -l < "$f") lines, $(md5sum "$f" | cut -d' ' -f1)"; done

  # ==================== 1. mykng 知识库 (5个Java微服务) ====================
  - name: mykng-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx2048m
    depends_on: [sync-ci-scripts]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "mykng"'
    commands:
      - set -e
      - echo ">>> [1/3] Maven 编译 mykng (5个微服务) <<<"
      - cd mykng/kb-parent && mvn clean package -DskipTests -B -V -ntp -T 2C -Djacoco.skip=true -Dmaven.repo.local=/root/.m2/repository
      - cd ../..
      - echo ">>> [2/3] 收集构建产物 <<<"
      - mkdir -p publish/mykng
      - cp mykng/kb-gateway/target/kb-gateway.jar publish/mykng/ && echo "  ✅ kb-gateway"
      - cp mykng/kb-auth/target/kb-auth.jar publish/mykng/ && echo "  ✅ kb-auth"
      - cp mykng/kb-file/target/kb-file.jar publish/mykng/ && echo "  ✅ kb-file"
      - cp mykng/kb-knowledge/target/kb-knowledge.jar publish/mykng/ && echo "  ✅ kb-knowledge"
      - cp mykng/kb-intelligence/target/kb-intelligence.jar publish/mykng/ && echo "  ✅ kb-intelligence"
      - ls -lh publish/mykng/
      - echo ">>> [3/3] 打包并推送到共享目录 <<<"
      - tar czf publish/mykng-latest.tar.gz -C publish/mykng .
      - cp publish/mykng-latest.tar.gz /mnt/shared/devtools/publish/
      - test -f /mnt/shared/devtools/publish/mykng-latest.tar.gz || { echo "❌ 产物未写入"; exit 1; }
      - echo "✅ mykng 构建完成"

  - name: mykng-deploy
    image: appleboy/drone-ssh
    depends_on: [mykng-build]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "mykng"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/devtools/ci/deploy-mykng.sh mykng-latest.tar.gz

  # ==================== 2. kb-ops 运维平台 (独立Java微服务) ====================
  - name: kb-ops-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops"'
    commands:
      - set -e
      - echo ">>> [1/3] Maven 编译 kb-ops <<<"
      - cd kb-ops && mvn clean package -DskipTests -B -V -ntp -Djacoco.skip=true -Dmaven.repo.local=/root/.m2/repository
      - cd ..
      - echo ">>> [2/3] 收集构建产物 <<<"
      - mkdir -p publish/kb-ops
      - cp kb-ops/target/kb-ops.jar publish/kb-ops/
      - ls -lh publish/kb-ops/
      - echo ">>> [3/3] 打包并推送到共享目录 <<<"
      - tar czf publish/kb-ops-latest.tar.gz -C publish/kb-ops .
      - cp publish/kb-ops-latest.tar.gz /mnt/shared/devtools/publish/
      - test -f /mnt/shared/devtools/publish/kb-ops-latest.tar.gz || { echo "❌ 产物未写入"; exit 1; }
      - echo "✅ kb-ops 构建完成"

  - name: kb-ops-deploy
    image: appleboy/drone-ssh
    depends_on: [kb-ops-build]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/devtools/ci/deploy-kb-ops.sh kb-ops-latest.tar.gz

  # ==================== 3. kb-ops-web 运维平台前端 ====================
  - name: kb-ops-web-build
    image: node:20-alpine
    volumes:
      - /mnt/shared:/mnt/shared
    depends_on: [sync-ci-scripts]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops-web"'
    commands:
      - set -e
      - npm install -g pnpm
      - pnpm config set registry http://192.168.31.105:8081/repository/npm-public/
      - pnpm config set fetch-retries 5
      - pnpm config set fetch-retry-factor 2
      - pnpm config set fetch-retry-mintimeout 20000
      - pnpm config set fetch-retry-maxtimeout 120000
      - pnpm config set network-concurrency 1
      - echo ">>> [1/3] 构建 kb-ops-web <<<"
      - cd kb-ops/kb-ops-web
      - pnpm install --no-frozen-lockfile || pnpm install --no-frozen-lockfile || pnpm install
      - pnpm build
      - cd ../..
      - echo ">>> [2/3] 收集前端产物 <<<"
      - mkdir -p publish/kb-ops-web
      - cp -r kb-ops/kb-ops-web/dist/* publish/kb-ops-web/
      - ls -lh publish/kb-ops-web/
      - echo ">>> [3/3] 打包并推送到共享目录 <<<"
      - tar czf publish/kb-ops-web-latest.tar.gz -C publish/kb-ops-web .
      - cp publish/kb-ops-web-latest.tar.gz /mnt/shared/devtools/publish/
      - test -f /mnt/shared/devtools/publish/kb-ops-web-latest.tar.gz || { echo "❌ 产物未写入"; exit 1; }
      - echo "✅ kb-ops-web 构建完成"

  - name: kb-ops-web-deploy
    image: appleboy/drone-ssh
    depends_on: [kb-ops-web-build]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops-web"'
    settings:
      host: 192.168.31.105
      username: root
      key:
        from_secret: ssh_key_mykng
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/devtools/ci/deploy-kb-ops-web.sh kb-ops-web-latest.tar.gz

  # ==================== 4. infra-monitor-web 监控前端 ====================
  - name: infra-monitor-web-build
    image: node:20-alpine
    volumes:
      - /mnt/shared:/mnt/shared
    depends_on: [sync-ci-scripts]
    when:
      - event: push
      - event: manual
        evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor-web"'
    commands:
      - set -e
      - npm install -g pnpm
      - pnpm config set registry http://192.168.31.105:8081/repository/npm-public/
      - pnpm config set fetch-retries 5
      - pnpm config set fetch-retry-factor 2
      - pnpm config set fetch-retry-mintimeout 20000
      - pnpm config set fetch-retry-maxtimeout 120000
