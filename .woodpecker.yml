# ============================================================
# Woodpecker CI �?devtools 统一流水�?# ============================================================
# 6�?build→deploy 链，depends_on 控制串并�?# 改串并行只需�?depends_on，不用改脚本
#
# 依赖�?
#   sync-ci-scripts
#     ├── mykng-build ──�?mykng-deploy ─────────────────────�?#     ├── kb-ops-build ─�?kb-ops-deploy (after mykng)       �?kb-app 串行
#     ├── kb-ops-web ──�?kb-ops-web-deploy ──────────────�? �?#     ├── infra-web ──�?infra-web-deploy (after ops-web) �? �?kb-web 串行
#     ├── infra-mon ──�?infra-mon-deploy                �? �?独立并行
#     └── active-mgr ─�?active-mgr-deploy                �? �?独立并行
#                                                        �? �?#                                                     cleanup
#
# DEPLOY_TARGET: all(默认) / mykng / kb-ops / kb-ops-web / infra-monitor-web / infra-monitor / active-manager / portal-web / portal-server
# ============================================================

when:
  event: [manual, push]
  branch: [dev]

steps:
  # ==================== 共享: 同步CI脚本 ====================
  - name: sync-ci-scripts
    image: bash:5.2
    volumes:
      - /mnt/shared:/mnt/shared
    commands:
      - mkdir -p /mnt/shared/woodScript/publish /mnt/shared/woodScript/ci /mnt/shared/woodScript/cd
      - find /mnt/shared/woodScript -mindepth 1 -delete 2>/dev/null || true
      - find woodScript -name '*.sh' | while read f; do dst="/mnt/shared/$f"; mkdir -p "$(dirname "$dst")"; sed 's/\r$//' "$f" > "$dst"; done
      - mkdir -p /mnt/shared/woodScript/publish
      - find /mnt/shared/woodScript -name '*.sh' -exec chmod +x {} +
      - echo "=== Syntax check ==="
      - find /mnt/shared/woodScript -name '*.sh' -exec bash -n {} \; -print

  # ==================== mykng (5个Java微服�? ====================
  - name: mykng-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx2048m
    depends_on: [sync-ci-scripts]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "mykng"' }]
    commands:
      - bash woodScript/ci/build-mykng.sh

  - name: mykng-deploy
    image: appleboy/drone-ssh
    depends_on: [mykng-build]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "mykng"' }]
    settings:
      host: 192.168.31.105
      username: root
      key: { from_secret: ssh_key_mykng }
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodScript/cd/deploy-mykng.sh mykng-latest.tar.gz

  # ==================== kb-ops (运维平台后端) ====================
  - name: kb-ops-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops"' }]
    commands:
      - bash woodScript/ci/build-kb-ops.sh

  - name: kb-ops-deploy
    image: appleboy/drone-ssh
    depends_on: [kb-ops-build, mykng-deploy]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops"' }]
    settings:
      host: 192.168.31.105
      username: root
      key: { from_secret: ssh_key_mykng }
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodScript/cd/deploy-kb-ops.sh kb-ops-latest.tar.gz

  # ==================== kb-ops-web (运维平台前端) ====================
  - name: kb-ops-web-build
    image: node:20-slim
    volumes:
      - /mnt/shared:/mnt/shared
    depends_on: [sync-ci-scripts]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops-web"' }]
    commands:
      - bash woodScript/ci/build-kb-ops-web.sh

  - name: kb-ops-web-deploy
    image: appleboy/drone-ssh
    depends_on: [kb-ops-web-build]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "kb-ops-web"' }]
    settings:
      host: 192.168.31.105
      username: root
      key: { from_secret: ssh_key_mykng }
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodScript/cd/deploy-kb-ops-web.sh kb-ops-web-latest.tar.gz

  # ==================== infra-monitor-web (监控前端) ====================
  - name: infra-monitor-web-build
    image: node:20-slim
    volumes:
      - /mnt/shared:/mnt/shared
    depends_on: [sync-ci-scripts]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor-web"' }]
    commands:
      - bash woodScript/ci/build-infra-monitor-web.sh

  - name: infra-monitor-web-deploy
    image: appleboy/drone-ssh
    depends_on: [infra-monitor-web-build, kb-ops-web-deploy]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor-web"' }]
    settings:
      host: 192.168.31.105
      username: root
      key: { from_secret: ssh_key_mykng }
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodScript/cd/deploy-infra-monitor-web.sh infra-monitor-web-latest.tar.gz

  # ==================== infra-monitor (监控后端) ====================
  - name: infra-monitor-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor"' }]
    commands:
      - bash woodScript/ci/build-infra-monitor.sh

  - name: infra-monitor-deploy
    image: appleboy/drone-ssh
    depends_on: [infra-monitor-build]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "infra-monitor"' }]
    settings:
      host: 192.168.31.105
      username: root
      key: { from_secret: ssh_key_mykng }
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodScript/cd/deploy-infra-monitor.sh infra-monitor-latest.tar.gz

  # ==================== active-manager (激活码系统) ====================
  - name: active-manager-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "active-manager"' }]
    commands:
      - bash woodScript/ci/build-active-manager.sh

  - name: active-manager-deploy
    image: appleboy/drone-ssh
    depends_on: [active-manager-build]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "active-manager"' }]
    settings:
      host: 192.168.31.182
      username: root
      key: { from_secret: ssh_key_debian }
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodScript/cd/deploy-active-manager.sh active-manager-latest.tar.gz

  # ==================== portal-web (门户前端) ====================
  - name: portal-web-build
    image: node:20-slim
    volumes:
      - /mnt/shared:/mnt/shared
    depends_on: [sync-ci-scripts]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "portal-web"' }]
    commands:
      - bash woodScript/ci/build-portal-web.sh

  - name: portal-web-deploy
    image: appleboy/drone-ssh
    depends_on: [portal-web-build]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "portal-web"' }]
    settings:
      host: 192.168.31.105
      username: root
      key: { from_secret: ssh_key_mykng }
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodScript/cd/deploy-portal-web.sh portal-web-latest.tar.gz

  # ==================== portal-server (门户后端) ====================
  - name: portal-server-build
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /mnt/shared:/mnt/shared
      - /root/.m2:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx1024m
    depends_on: [sync-ci-scripts]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "portal-server"' }]
    commands:
      - bash woodScript/ci/build-portal-server.sh

  - name: portal-server-deploy
    image: appleboy/drone-ssh
    depends_on: [portal-server-build]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all" || DEPLOY_TARGET == "portal-server"' }]
    settings:
      host: 192.168.31.105
      username: root
      key: { from_secret: ssh_key_mykng }
      port: 22
      script_stop: false
      command_timeout: 30m
      script:
        - bash /mnt/shared/woodScript/cd/deploy-portal-server.sh portal-server-latest.tar.gz

  # ==================== cleanup ====================
  - name: cleanup
    image: appleboy/drone-ssh
    depends_on: [kb-ops-deploy, infra-monitor-web-deploy, infra-monitor-deploy, active-manager-deploy, portal-web-deploy, portal-server-deploy]
    when: [{ event: push }, { event: manual, evaluate: 'DEPLOY_TARGET == "" || DEPLOY_TARGET == "all"' }]
    settings:
      host: 192.168.31.105
      username: root
      key: { from_secret: ssh_key_mykng }
      port: 22
      script_stop: false
      command_timeout: 5m
      script:
        - docker container prune -f 2>/dev/null || true
        - docker image prune -f 2>/dev/null || true
        - docker builder prune -f 2>/dev/null || true
        - echo "cleanup done"
