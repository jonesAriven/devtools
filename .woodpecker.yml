# ============================================================
# Pipeline 4: infra-monitor 基础设施监控
# ============================================================
# 部署位置: mykng (100.93.36.113)
# 代码目录: /root/devtools/infra-monitor
# 容器名: infra-monitor (host网络模式)
# 端口: 8088 (host网络直接监听)
# 访问地址: https://monitor.marschat.online
# 特点: 前后端分离（前端->/data/infra-monitor-web, 后端JAR->/data/infra-monitor/app.jar）
# 内存限制: 256m
# ============================================================

when:
  event:
    - manual
  branch:
    - dev
    - master

steps:
  - name: check-env
    image: alpine:3.19
    commands:
      - echo "=== Infra-Monitor CI/CD ==="
      - echo "Deploy Target: mykng (100.93.36.113)"
      - echo "Branch: dev"

  - name: build-frontend
    image: node:20-alpine
    commands:
      - echo "=== Build infra-monitor Frontend ==="
      - cd infra-monitor/infra-monitor-web
      - if [ -f pnpm-lock.yaml ]; then corepack enable pnpm && pnpm install --registry=https://registry.npmmirror.com && pnpm build; else npm ci --registry=https://registry.npmmirror.com && npm run build; fi
      - ls -la dist/ | head -10 || echo "WARNING: dist not found"

  - name: build-backend
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /root/.m2:/root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx512m
    commands:
      - echo "=== Maven Build infra-monitor Backend ==="
      - cd infra-monitor/infra-monitor-server && mvn clean package -DskipTests -B -V -ntp && cd ../..
      - find infra-monitor/infra-monitor-server/target -name "*.jar" ! -name "*sources.jar" | head -1 | xargs ls -lh || echo "WARNING: JAR not found"

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      password:
        from_secret: deploy_pass_mykng
      port: 22
      script_timeout: 15m
      command_timeout: 5m
    script:
      - chmod +x /root/devtools/infra-monitor/ci/deploy.sh
      - bash /root/devtools/infra-monitor/ci/deploy.sh "${CI_COMMIT_SHA}" "dev"

