# ============================================================
# Pipeline 3: kb-ops 运维平台
# ============================================================
# 部署位置: mykng (100.93.36.113)
# 代码目录: /root/devtools/kb-ops
# 容器名: kb-ops
# 端口映射: 8084(宿主机) -> 8084(容器)
# 访问地址: https://kb.marschat.online/ops/
# 特点: 前后端分离（前端Vue3->/var/www/kb-ops-web, 后端Docker->:8084）
# ============================================================

when:
  event:
    - manual
  branch:
    - dev
    - master

steps:
  - name: check-env
    image: alpine:3.19
    commands:
      - echo "=== kb-Ops Platform CI/CD ==="
      - echo "Deploy Target: mykng (100.93.36.113)"
      - echo "Branch: dev"

  - name: build-backend
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - /root/.m2:/root/.m2/repository
    environment:
      MAVEN_OPTS: -Xmx1024m
    commands:
      - echo "=== Maven Build kb-ops Backend ==="
      - cd kb-ops && mvn clean package -DskipTests -B -V -ntp && cd ..
      - ls -lh kb-ops/target/*.jar || true

  - name: build-frontend
    image: node:20-alpine
    commands:
      - echo "=== Build kb-ops Frontend ==="
      - cd kb-ops/kb-ops-web
      - if [ -f pnpm-lock.yaml ]; then corepack enable pnpm && pnpm install --registry=https://registry.npmmirror.com && pnpm build; else npm ci --registry=https://registry.npmmirror.com && npm run build; fi
      - ls -la dist/ | head -10 || echo "WARNING: dist not found"

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      password:
        from_secret: deploy_pass_mykng
      port: 22
      script_timeout: 15m
      command_timeout: 5m
    script:
      - chmod +x /root/devtools/kb-ops/ci/deploy.sh
      - bash /root/devtools/kb-ops/ci/deploy.sh "${CI_COMMIT_SHA}" "dev"

