when:
  event:
    - manual
  branch:
    - dev
    - master

steps:
  - name: check-env
    image: alpine:3.19
    commands:
      - echo hello
      - pwd

  - name: build
    image: maven:3.9-eclipse-temurin-21
    environment:
      MAVEN_OPTS: -Xmx2048m
    commands:
      - cd mykng/kb-parent && mvn clean package -DskipTests -B -V -ntp && cd ../..
      - ls target/*.jar || true

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host: 100.93.36.113
      username: root
      password: Hwx@1120930
      port: 22
      script_timeout: 20m
    script: |
      hostname
      whoami
      chmod +x /root/devtools/mykng/ci/deploy.sh
      bash /root/devtools/mykng/ci/deploy.sh test dev production
