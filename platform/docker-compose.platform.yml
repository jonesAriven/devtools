# ============================================================
# docker-compose.platform.yml — 全局基础设施层
# ============================================================
# 服务: MySQL, Redis, MongoDB, MinIO, MeiliSearch, Nacos, Kafka
# 网络: platform-net (其他层通过 external 引入)
# 启动: bash platform/start-platform.sh
#       或: docker compose -p platform -f platform/docker-compose.platform.yml up -d
# 停止: docker compose -p platform -f platform/docker-compose.platform.yml down
# ============================================================
# 注意: 不归任何流水线管理，手动启动，持久运行
#       所有项目(mykng/kb-ops/infra-monitor等)共享此基础设施
# ============================================================

services:
  # ========== MySQL ==========
  platform-mysql:
    image: mysql:8.0
    container_name: platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kb123456}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
      - "33061:33061"
    volumes:
      - platform-mysql-data:/var/lib/mysql
      - /mnt/shared/platform/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - /mnt/shared/platform/mysql/cluster.cnf:/etc/mysql/conf.d/cluster.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --character-set-client-handshake=FALSE
      - --init-connect='SET NAMES utf8mb4'
      - --skip-character-set-client-handshake=FALSE
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-kb123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - platform-net
    mem_limit: 512m

  # ========== Redis ==========
  platform-redis:
    image: redis:7-alpine
    container_name: platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - platform-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - platform-net

  # ========== MongoDB ==========
  platform-mongo:
    image: mongo:7.0
    container_name: platform-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-kb}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-kb123456}
    volumes:
      - platform-mongo-data:/data/db
    command: --wiredTigerCacheSizeGB=0.25
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net
    mem_limit: 512m

  # ========== MinIO ==========
  platform-minio:
    image: minio/minio:latest
    container_name: platform-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - platform-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net
    mem_limit: 512m

  # ========== MeiliSearch ==========
  platform-meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: platform-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-kbMeiliKey2026!!Secure}
      MEILI_ENV: production
    volumes:
      - platform-meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net
    mem_limit: 256m

  # ========== Nacos 用户初始化 (一次性容器) ==========
  # Nacos v2.4.3 standalone 不会自动创建默认用户，此容器在 Nacos 启动前检查并插入
  # 幂等: 标记文件 + SELECT 双重检查，已有用户时自动跳过
  nacos-init:
    image: nacos/nacos-server:v2.4.3
    container_name: nacos-init
    entrypoint: ["bash", "/init-nacos.sh"]
    volumes:
      - platform-nacos-data:/home/nacos/data
      - ./nacos/init-nacos.sh:/init-nacos.sh:ro
    restart: "no"
    mem_limit: 128m

  # ========== Nacos ==========
  # 基础设施, 不归流水线管, 持久运行
  # 微服务通过平台网络直连注册/发现
  platform-nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: platform-nacos
    restart: unless-stopped
    depends_on:
      nacos-init:
        condition: service_completed_successfully
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 64m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos}
    volumes:
      - platform-nacos-data:/home/nacos/data
      - platform-nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - platform-net
    mem_limit: 384m

  # ========== Kafka ==========
  platform-kafka:
    image: apache/kafka:3.7.1
    container_name: platform-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@platform-kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://192.168.31.105:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_DELETE_TOPIC_ENABLE=true
      - KAFKA_LOG_RETENTION_HOURS=72
      - KAFKA_LOG_RETENTION_BYTES=1073741824
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - CLUSTER_ID=platform-kafka-cluster-001
    volumes:
      - platform-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - platform-net
    mem_limit: 512m

  # ========== Kafka UI (可选，调试用) ==========
  platform-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: platform-kafka-ui
    restart: unless-stopped
    ports:
      - "19092:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=platform
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=platform-kafka:9092
    depends_on:
      platform-kafka:
        condition: service_healthy
    networks:
      - platform-net
    mem_limit: 128m

# ========== 数据卷 ==========
volumes:
  platform-mysql-data:
    driver: local
  platform-redis-data:
    driver: local
  platform-mongo-data:
    driver: local
  platform-minio-data:
    driver: local
  platform-meili-data:
    driver: local
  platform-nacos-data:
    driver: local
  platform-nacos-logs:
    driver: local
  platform-kafka-data:
    driver: local

# ========== 网络 ==========
networks:
  platform-net:
    name: platform-net
    driver: bridge