# ============================================================
# Gitee Go CI/CD — devtools 仓库（调度中心）
# ============================================================
#
# 📁 架构设计: 从 Drone 迁移到 Gitee Go
#   本文件 = 调度中心 + 项目注册表
#   各项目/ci/deploy.sh = 具体部署逻辑
#
# 🎯 核心机制:
#   1. 所有项目共享一个统一 pipeline 模板
#   2. 通过 PROJECTS 注册表声明哪些项目可部署
#   3. 手动触发时传 DEPLOY_PROJECT 参数选择目标
#   4. 每个 pipeline 自动：检查项目 → 编译 → 部署
#
# 🔧 手动触发:
#   Gitee → 仓库 → 流水线 → 运行 → 填写参数:
#     DEPLOY_PROJECT=mykng          # 只部署 mykng
#     DEPLOY_PROJECT=active-manager # 只部署激活码
#     DEPLOY_PROJECT=all            # 全部部署
#     (不填则全部部署)
#
# ➕ 新增项目的步骤（只需改3处）:
#   1. 在 PROJECTS 注册表中添加一行
#   2. 创建 项目名/ci/deploy.sh
#   3. 在本文件末尾复制一个 stage 并改参数
#   完事！不用重复写 check/build/deploy 逻辑
#
# ⏰ 定时任务: Gitee Go → 流水线设置 → 定时触发
# ============================================================

# ================================
# 📋 项目注册表（Projects Registry）
# =================---------------
# 所有支持 CI/CD 的项目都在这里注册。
# 新增项目？只需加一行，然后复制一个 stage 块即可。
# ================================
#
# | 项目名           | 描述           | 部署目标主机      | Maven模块路径              | 内存  |
# |------------------|---------------|------------------|--------------------------|-------|
# | mykng            | 知识库微服务    | 100.93.36.113    | mykng/kb-parent          | 2048m |
# | active-manager   | 激活码系统      | 192.168.31.182   | active-manager/activation-code-server | 1024m |
# | kb-ops           | 运维平台        | (待配置)         | kb-ops                   | 1024m |
# | myfrp            | FRP管理面板     | (待配置)         | myfrp                    | 512m  |

# ================================
# 全局变量定义
# ================================
variables:
  # 部署目标环境 (production/dev/test)
  - name: DEPLOY_TARGET
    description: "🌍 部署目标环境"
    default: "production"
    options:
      - production
      - dev
      - test
  
  # 选择要部署的项目
  - name: DEPLOY_PROJECT
    description: "📦 选择要部署的项目"
    default: "all"
    options:
      - all
      - mykng
      - active-manager
      - "mykng,active-manager"

# ================================
# Stage 1: mykng 知识库微服务
# ================================
stages:
  - name: mykng-cicd
    label: "📘 知识库微服务 (mykng)"
    type: ci
    strategy: naturally
    trigger:
      branch:
        include:
          - dev
          - master
    steps:
      # ---- Step 1: 检查是否需要部署此项目 ----
      - step: check-project@1
        name: 检查部署目标
        image: alpine:3.19
        commands:
          - |
            PROJECT="mykng"
            echo "=== [$PROJECT] 检查部署目标: DEPLOY_PROJECT=${DEPLOY_PROJECT:-未设置} ==="
            
            # 支持多项目选择：逗号分隔
            if [ "${DEPLOY_PROJECT}" != "" ] && [ "${DEPLOY_PROJECT}" != "all" ]; then
              MATCH=0
              IFS=',' read -ra TARGETS <<< "${DEPLOY_PROJECT}"
              for TARGET in "${TARGETS[@]}"; do
                TARGET=$(echo "$TARGET" | xargs)
                if [ "$TARGET" = "$PROJECT" ]; then
                  MATCH=1
                  break
                fi
              done
              if [ "$MATCH" = "0" ]; then
                echo "⏭️  跳过 $PROJECT（不在部署列表中）"
                exit 1
              fi
            fi
            echo "✅ 匹配 $PROJECT，继续部署"

      # ---- Step 2: Maven 编译 ----
      - step: build@1
        name: Maven 编译
        image: maven:3.9-eclipse-temurin-21
        commands:
          - echo "=== [mykng] Maven 编译 ==="
          - cd mykng/kb-parent && mvn clean package -DskipTests -B -V -ntp && cd ../..
          - ls -lh mykng/kb-gateway/target/*.jar mykng/kb-auth/target/*.jar mykng/kb-file/target/*.jar mykng/kb-knowledge/target/*.jar mykng/kb-intelligence/target/*.jar
        artifacts:
          - name: mykng-jars
          path:
            - mykng/kb-gateway/target/*.jar
            - mykng/kb-auth/target/*.jar
            - mykng/kb-file/target/*.jar
            - mykng/kb-knowledge/target/*.jar
            - mykng/kb-intelligence/target/*.jar

      # ---- Step 3: SSH 部署到目标服务器 ----
      - step: ssh-deploy@1
        name: 部署到 mykng 服务器
        image: alpine:3.19
        with:
          host: ${{DEPLOY_HOST_MYKNG}}
          user: root
          password: ${{DEPLOY_PASS_MYKNG}}
          port: 22
          command: |
            chmod +x /root/devtools/mykng/ci/deploy.sh
            bash /root/devtools/mykng/ci/deploy.sh "${GIT_COMMIT}" "${GIT_BRANCH:-dev}" "${DEPLOY_TARGET:-production}"

  # ================================
  # Stage 2: active-manager 激活码系统
  # ================================
  - name: active-manager-cicd
    label: "🔑 激活码系统 (active-manager)"
    type: ci
    strategy: naturally
    trigger:
      branch:
        include:
          - dev
          - master
    steps:
      # ---- Step 1: 检查是否需要部署此项目 ----
      - step: check-project@1
        name: 检查部署目标
        image: alpine:3.19
        commands:
          - |
            PROJECT="active-manager"
            echo "=== [$PROJECT] 检查部署目标: DEPLOY_PROJECT=${DEPLOY_PROJECT:-未设置} ==="
            
            if [ "${DEPLOY_PROJECT}" != "" ] && [ "${DEPLOY_PROJECT}" != "all" ]; then
              MATCH=0
              IFS=',' read -ra TARGETS <<< "${DEPLOY_PROJECT}"
              for TARGET in "${TARGETS[@]}"; do
                TARGET=$(echo "$TARGET" | xargs)
                if [ "$TARGET" = "$PROJECT" ]; then
                  MATCH=1
                  break
                fi
              done
              if [ "$MATCH" = "0" ]; then
                echo "⏭️  跳过 $PROJECT（不在部署列表中）"
                exit 1
              fi
            fi
            echo "✅ 匹配 $PROJECT，继续部署"

      # ---- Step 2: Maven 编译 ----
      - step: build@1
        name: Maven 编译
        image: maven:3.9-eclipse-temurin-21
        commands:
          - echo "=== [active-manager] Maven 编译 ==="
          - cd active-manager/activation-code-server && mvn clean package -DskipTests -B -V -ntp && cd ../..
          - ls -lh active-manager/activation-code-server/target/*.jar
        artifacts:
          - name: active-manager-jar
          path:
            - active-manager/activation-code-server/target/*.jar

      # ---- Step 3: SSH 部署到内网Debian ----
      - step: ssh-deploy@1
        name: 部署到内网 Debian
        image: alpine:3.19
        with:
          host: ${{DEPLOY_HOST_LAN}}
          user: root
          password: ${{DEPLOY_PASS_LAN}}
          port: 22
          command: |
            chmod +x /root/devtools/active-manager/ci/deploy.sh
            bash /root/devtools/active-manager/ci/deploy.sh "${GIT_COMMIT}" "${GIT_BRANCH:-dev}"

# ============================================================
# 🔧 环境变量配置（在 Gitee Go 后台设置）
# ============================================================
# | 变量名             | 用途           | 说明                    |
# |-------------------|---------------|-------------------------|
# | DEPLOY_HOST_MYKNG | mykng 服务器IP | 100.93.36.113 (Tailscale)|
# | DEPLOY_PASS_MYKNG | mykng SSH密码  | 目标机器的 root 密码    |
# | DEPLOY_HOST_LAN   | 内网Debian IP  | 192.168.31.182          |
# | DEPLOY_PASS_LAN   | 内网SSH密码    | 目标机器的 root 密码    |
#
# 📖 使用指南:
# ┌──────────────────────────────────────────────────────┐
# │  运行流水线时填写参数:                                │
# │                                                      │
# │  单个项目:                                             │
# │    DEPLOY_PROJECT=mykng                              │
# │                                                      │
# │  多个项目（逗号分隔）:                                  │
# │    DEPLOY_PROJECT=mykng,active-manager               │
# │                                                      │
# │  全部部署:                                             │
# │    DEPLOY_PROJECT=all                                 │
# │                                                      │
# │  可选: DEPLOY_TARGET=production / dev / test          │
# └──────────────────────────────────────────────────────┘
# ============================================================
