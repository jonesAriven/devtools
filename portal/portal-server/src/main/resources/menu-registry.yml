# portal 菜单注册表（menu-permission-management-plan §5 schema）
#
# key = 权限点稳定标识（sys_permission.code，下发为 marschat-portal:menu:<key>），与
# portal-web src/router/index.ts 的 permCode('menu','<key>') 严格对齐，禁止随意改名。
#
# 与其它应用的差异说明：
#   portal 是「卡片式门户」，侧边栏不是权限驱动的菜单树（是系统分类导航），
#   故本表只登记**受权限守卫管辖的路由**（router meta.perm 已声明）：
#     /manage         → permCode('menu','manage')
#     /users          → permCode('menu','users')（另有 requiresAdmin 本地兜底）
#                       ↑ Phase 8 起语义收窄为「门户用户」= **应用作用域**
#                         （GET /admin/users?client=marschat-portal，只看与本门户有关的用户）
#
#   ⚠️ Phase 8 起 portal 还承载了「统一认证中心」（/admin，平台作用域管理台），
#      该路由**刻意不登记在本表**：它是平台管理入口，不应出现在「可授予普通用户的应用菜单」中。
#      默认授权种子（PermissionService.ensureDefaultGrants）会把新注册的 menu 权限点
#      绑到平台 `user` 角色——一旦登记就等于"发给所有普通用户"。
#      故 /admin 只用 router 的 `requiresAdmin` 做本地强闸（先于 createAuthGuard 执行）。
#
# 上报后中心授权界面会出现 portal 的权限树，管理员可选择性授权；
# 未绑定任何角色前 configured=false → R10 fail-open，行为与接入前完全一致。
#
# 上报通道：auth-core MenuRegistryReporter（启动时 PUT /internal/clients/marschat-portal/menus，
# 凭据 X-Client-Secret = sys_app_client.client_secret，由 MARSCHAT_MENU_REPORT_SECRET 注入）。
client: marschat-portal
menus:
  - key: manage
    title: 系统管理
    path: /manage
    order: 1
  - key: users
    title: 门户用户
    path: /users
    order: 2

# api 权限点（Phase 9 / G3）：随本 yml 一并全量上报，注册为 type=api 权限点，
# 供接口级鉴权 `@RequirePermission("api:<key>")` 消费（此处 → `marschat-portal:api:admin`）。
#
# 为什么必须是 api 点而不是复用 menu:manage：
#   `/admin` 是**平台作用域管理台**，不是可授予普通用户的应用菜单；且默认授权种子
#   （PermissionService.ensureDefaultGrants）只把 type='menu' 的点发给平台 user 角色，
#   api 点天然不会被发给普通用户 —— 用它做闸门才是「真闸门」。详见 menu 段注释第 14-18 行。
#
# 上报为全量覆盖（retire 判定含 menu+api 两类）：本段只增 api:admin，不会误下线上面的 menus。
apis:
  - key: admin
    title: 统一认证中心管理台
