server:
  port: 8087
  servlet:
    context-path: /portal

spring:
  application:
    name: portal-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.kb.portal: debug
    com.kb.common: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 统一认证中心（auth-center Phase 2）：SSO 登录 + 用户管理代理
auth-center:
  issuer: ${AUTH_CENTER_ISSUER:http://192.168.31.105:8085}
  client-id: ${AUTH_CENTER_CLIENT_ID:marschat-portal}
  client-secret: ${AUTH_CENTER_CLIENT_SECRET:portal-secret-2026}
