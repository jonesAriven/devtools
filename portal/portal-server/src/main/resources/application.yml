server:
  port: 8087
  servlet:
    context-path: /portal

spring:
  application:
    name: portal-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.kb.portal: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 统一认证中心（auth-center Phase 2）：SSO 登录 + 管理接口代理
auth-center:
  # ⚠️ issuer = **浏览器可见地址**（用于拼 /oauth2/authorize 跳转），必须是公网域名。
  issuer: ${AUTH_CENTER_ISSUER:http://192.168.31.105:8085}
  # ⚠️ internal-base = **服务端互调地址（内网）**，与 issuer 必须分离。
  #
  # 🔴 实测缺陷（2026-09-14，P0）：此前 admin-api 直接回落 issuer（公网域名），而公网
  #    **未暴露 /auth/login**（`POST https://auth.marschat.online/auth/login` → 404）。
  #    于是 portal-server 一旦重启（内存 refresh_token 清空）或管理员用密码登录（无 SSO 会话），
  #    就会走服务身份兜底 → 打 404 → 整个 /admin/** 代理返回
  #    `{"code":502,"message":"统一认证中心不可达"}` → **门户的用户管理与统一认证中心全量不可用**。
  #    修法：服务端互调一律走 compose 内网（与 marschat.oidc.jwks-uri 的既有约定一致）。
  internal-base: ${AUTH_CENTER_INTERNAL_BASE:http://auth-center:8085}
  client-id: ${AUTH_CENTER_CLIENT_ID:marschat-portal}
  client-secret: ${AUTH_CENTER_CLIENT_SECRET:portal-secret-2026}

# 认证公共库 auth-core（com.marschat:auth-core）配置
marschat:
  auth:
    # HS256 兜底验签密钥（>= 32 字节）。portal 自身不签发/校验 HS256 token，
    # 此处仅满足 TokenProvider 装配所需（auth-core 传递引入 jjwt，AuthJwtAutoConfig 会装配）。
    secret: ${MARSCHAT_AUTH_SECRET:${JWT_SECRET:YourSuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong!!}}
  # ⚠️ 刻意不配置 marschat.authz.client-id：AuthzAutoConfig 的 @RequirePermission 拦截器
  #    仅在 client-id 非空时注册。portal 现有端点无 @RequirePermission 注解，保持零行为变化。
  #
  # 统一鉴权（2026-09-14 补齐）：auth-core 的 OidcTokenVerifier 默认 jwks-uri 曾指向已下线的
  # `kb-auth`（仅靠 compose 网络别名兜底），这里**显式配置真实服务名**，消除对历史别名的隐性依赖。
  oidc:
    issuer: ${MARSCHAT_OIDC_ISSUER:${AUTH_CENTER_ISSUER:https://auth.marschat.online}}
    jwks-uri: ${MARSCHAT_OIDC_JWKS_URI:http://auth-center:8085/oauth2/jwks}
  menu:
    report:
      # Phase 4 P-B：启动时全量上报 menu-registry.yml（幂等，失败仅 WARN 不阻断启动）
      enabled: ${MARSCHAT_MENU_REPORT_ENABLED:true}
      # ⚠️ portal-server 走 bridge 网络（kb-app-net/platform-net），容器内 127.0.0.1 指向容器自身，
      #    必须用 auth-center 的容器名（与 portal-server 同网，Docker DNS 可解析）。
      #    对照：infra-monitor 是 network_mode: host，故其配置用 127.0.0.1 亦可。
      issuer: ${MARSCHAT_MENU_REPORT_ISSUER:http://auth-center:8085}
      client-id: marschat-portal
      report-mode: secret
      report-secret: ${MARSCHAT_MENU_REPORT_SECRET:}
  # 账号映射上报（Phase 7）：把 portal 的本地账号（含超管应急账号）全量登记到中心
  # app_account_mapping，由中心按 username/email 自动认领统一身份。
  # secret 复用菜单上报同一个（容器已注入 MARSCHAT_MENU_REPORT_SECRET），无需新增服务器密钥。
  account:
    report:
      enabled: ${MARSCHAT_ACCOUNT_REPORT_ENABLED:true}
      issuer: ${MARSCHAT_ACCOUNT_REPORT_ISSUER:http://auth-center:8085}
      client-id: marschat-portal
      report-secret: ${MARSCHAT_ACCOUNT_REPORT_SECRET:${MARSCHAT_MENU_REPORT_SECRET:}}
