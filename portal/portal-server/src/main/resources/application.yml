server:
  port: 8087
  servlet:
    context-path: /portal

spring:
  application:
    name: portal-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.kb.portal: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 统一认证中心（auth-center Phase 2）：SSO 登录 + 管理接口代理
auth-center:
  # ⚠️ issuer = **浏览器可见地址**（用于拼 /oauth2/authorize 跳转），必须是公网域名。
  issuer: ${AUTH_CENTER_ISSUER:http://192.168.31.105:8085}
  # ⚠️ internal-base = **服务端互调地址（内网）**，与 issuer 必须分离。
  #
  # 🔴 实测缺陷（2026-09-14，P0）：此前 admin-api 直接回落 issuer（公网域名），而公网
  #    **未暴露 /auth/login**（`POST https://auth.marschat.online/auth/login` → 404）。
  #    于是 portal-server 一旦重启（内存 refresh_token 清空）或管理员用密码登录（无 SSO 会话），
  #    就会走服务身份兜底 → 打 404 → 整个 /admin/** 代理返回
  #    `{"code":502,"message":"统一认证中心不可达"}` → **门户的用户管理与统一认证中心全量不可用**。
  #    修法：服务端互调一律走 compose 内网（与 marschat.oidc.jwks-uri 的既有约定一致）。
  internal-base: ${AUTH_CENTER_INTERNAL_BASE:http://auth-center:8085}
  client-id: ${AUTH_CENTER_CLIENT_ID:marschat-portal}
  client-secret: ${AUTH_CENTER_CLIENT_SECRET:portal-secret-2026}

# ---------------------------------------------------------------------------
# portal 自有会话 token（HS256）—— 🔴 2026-09-15 安全修复（P0 密钥分离）
#   · secret **只从环境变量 PORTAL_JWT_SECRET 注入**，此处不留任何可用默认值；
#     缺失/过短/命中已泄露的共享密钥 → JwtUtil 启动即抛异常（fail-fast）。
#   · 与 infra-monitor 的 JWT_SECRET 必须**各自独立、绝不共享**（此前两者同为
#     PortalJwtSecretKey2026!MustBe32Bytes!!，导致跨应用 token 互认）。
#   · issuer 写入 token 的 iss 声明，JwtInterceptor 据此拒绝非本应用签发的 token。
# ---------------------------------------------------------------------------
portal:
  jwt:
    secret: ${PORTAL_JWT_SECRET:}
    issuer: ${PORTAL_JWT_ISSUER:marschat-portal}
    expire-hours: ${PORTAL_JWT_EXPIRE_HOURS:24}

# 认证公共库 auth-core（com.marschat:auth-core）配置
marschat:
  auth:
    # HS256 兜底验签密钥（>= 32 字节）。portal 自身不签发/校验 HS256 token，
    # 此处仅满足 TokenProvider 装配所需（auth-core 传递引入 jjwt，AuthJwtAutoConfig 会装配）。
    # 🔴 不再回落到与 infra-monitor 共享的 JWT_SECRET；改为复用 portal 自己的密钥。
    secret: ${MARSCHAT_AUTH_SECRET:${PORTAL_JWT_SECRET:}}
  # RBAC 接口级鉴权（Phase 9 / G3）：AuthzAutoConfig 的 @RequirePermission 拦截器
  # 仅在 client-id 非空时注册。portal 现在要把「中心权限点」变成管理接口的真实闸门。
  # portal_token 是 HS256（auth-center 不认），故配 PortalPermissionChecker，用**该用户本人的
  # RS256 access token** 查中心权限（见 config/PortalPermissionChecker.java + config/AuthzConfig.java）。
  authz:
    enabled: true
    client-id: ${MARSCHAT_AUTHZ_CLIENT_ID:marschat-portal}
    # 🔴 必须显式 false（默认 true）：fetch 失败 / 中心抖动时默认会**静默放行**，管理面不可接受，
    #    故刻意 fail-closed（管理面可短暂不可用，核心业务链路不受影响；写操作与读操作同策略）。
    #    configured=false（应用未配置任何权限点）仍放行，属 R10「未配置=行为不变」，与本项无关。
    fail-open: false
    # 默认 checker 才用 issuer；portal 走 PortalPermissionChecker（经 AuthCenterService），此处仅留存。
    issuer: ${MARSCHAT_OIDC_ISSUER:${AUTH_CENTER_ISSUER:https://auth.marschat.online}}
    cache-ttl-ms: 60000
  #
  # 统一鉴权（2026-09-14 补齐）：auth-core 的 OidcTokenVerifier 默认 jwks-uri 曾指向已下线的
  # `kb-auth`（仅靠 compose 网络别名兜底），这里**显式配置真实服务名**，消除对历史别名的隐性依赖。
  oidc:
    issuer: ${MARSCHAT_OIDC_ISSUER:${AUTH_CENTER_ISSUER:https://auth.marschat.online}}
    jwks-uri: ${MARSCHAT_OIDC_JWKS_URI:http://auth-center:8085/oauth2/jwks}
  menu:
    report:
      # Phase 4 P-B：启动时全量上报 menu-registry.yml（幂等，失败仅 WARN 不阻断启动）
      enabled: ${MARSCHAT_MENU_REPORT_ENABLED:true}
      # ⚠️ portal-server 走 bridge 网络（kb-app-net/platform-net），容器内 127.0.0.1 指向容器自身，
      #    必须用 auth-center 的容器名（与 portal-server 同网，Docker DNS 可解析）。
      #    对照：infra-monitor 是 network_mode: host，故其配置用 127.0.0.1 亦可。
      issuer: ${MARSCHAT_MENU_REPORT_ISSUER:http://auth-center:8085}
      client-id: marschat-portal
      report-mode: secret
      report-secret: ${MARSCHAT_MENU_REPORT_SECRET:}
  # ── BFF 管理面代理（Phase 13 · auth-core 2.2.0）─────────────────────────
  # 承接原 SsoController#proxyAdminCenter 的 `/admin/**` 前缀透传：
  # 请求方法 / 查询串 / 请求体原样转发到 auth-center，以**调用者本人的身份**鉴权。
  #
  # 🔴 开启顺序铁律：`enabled: true` 之前必须**先删掉** SsoController 的
  #    `@RequestMapping("/admin/**")`。删前两者都映射 `/api/admin/**`，
  #    同时存在会被 Spring 判为 `Ambiguous mapping` 而**启动崩溃**。
  #    本次迁移已先删方法、再开此开关（见 SsoController 的 Phase 13 注释）。
  #    观察期回滚：MARSCHAT_BFF_ENABLED=false 即可关代理（不需回滚镜像）。
  #
  # ⚠️ 白名单是**默认拒绝**清单：未登记的路径一律 404 且不做任何中心调用，
  #    文件缺失 = 管理面全 404。清单见同目录 bff-whitelist.yml。
  bff:
    enabled: ${MARSCHAT_BFF_ENABLED:true}
    client-id: marschat-portal
    # 中心内网基址（compose 服务名）。与 auth-center.internal-base 同源；
    # 严禁写公网域名 —— 公网未暴露 /auth/login（实测 404，见上方 P0 注释）。
    auth-center-base: ${AUTH_CENTER_INTERNAL_BASE:http://auth-center:8085}
    # 代理前缀。🔴 此处**不含 context-path**（/portal）：Spring 的 @RequestMapping
    #    按「context-path 剥离后的路径」匹配，写成 /portal/api 会让全部请求 404。
    #    auth-core 用 uri.indexOf(path-prefix) 从**含 context-path 的 getRequestURI()**
    #    截取剩余段，故 /portal/api/admin/users → 中心 /admin/users。
    path-prefix: /api/admin
    # 中心侧管理端点前缀（一般不改）
    center-path-prefix: /admin
    # 调用者身份的取法：portal 无 Spring Security，三种内置 credential-mode
    # 全不适用（证据见 MarschatPortalBffConfig 类注释），实际生效的是自定义
    # BffCredentialResolver。显式声明以免默认值歧义；**改这一项不改变行为**。
    credential-mode: PASSTHROUGH
    # ── 本地账号上报（承接被删除的 config/LocalAccountReporter）──
    # 上报动作（PUT /internal/clients/{id}/accounts + X-Client-Secret、异常只 WARN
    # 不阻断启动）由 auth-core 的 MarschatBffAccountReporter 承担；
    # 账号清单来自本应用的 BffAccountSource（sys_user 活跃账号）。
    account-report-enabled: ${MARSCHAT_ACCOUNT_REPORT_ENABLED:true}
    # secret 沿用既有环境变量口径（与菜单上报同值），无需新增服务器密钥
    report-secret: ${MARSCHAT_ACCOUNT_REPORT_SECRET:${MARSCHAT_MENU_REPORT_SECRET:}}
  # 账号映射上报（Phase 7 · 旧 LocalAccountReporter 的配置，已随其删除）
  # ✅ 本地账号上报已迁到上方 marschat.bff.{account-report-enabled, report-secret}，
  #    由 auth-core 的 MarschatBffAccountReporter 承担，**行为与旧实现一致**。
  #    旧键 marschat.account.report.* 已移除（其唯一读取方 LocalAccountReporter 已删）。
  #    环境变量 MARSCHAT_ACCOUNT_REPORT_ENABLED / _SECRET 口径不变。
