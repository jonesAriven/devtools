server:
  port: 8084
  servlet:
    context-path: /kb-ops

spring:
  application:
    name: kb-ops
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AES-256-GCM 密钥 (Base64, 32字节)。生产环境通过环境变量覆盖。
crypto:
  aes-key: ${CRYPTO_AES_KEY:YWVzLTI1Ni1nY20ta2V5LTMyLWJ5dGVzISE=}

# 认证公共库 com.marschat:auth-core（TokenProvider 自动装配）
# secret 用于 HS256 兜底验签（历史自签 token；kb-auth 已于 2026-09-10 清除），长度 >= 32 字节（HS256 要求）
marschat:
  auth:
    secret: ${MARSCHAT_AUTH_SECRET:${JWT_SECRET:YourSuperSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong!!}}
  # OIDC RS256 双验签（auth-core 2.0.0）：对接 auth-center 签发的 RS256 token。
  # 过渡期内 HS256（历史自签 token）与 RS256（auth-center）并存，TokenProvider 自动先 RS256 后回退 HS256。
  # issuer 必须与 auth-center 签发方一致；jwks-uri 走 compose 内网直连 auth-center 绕过公网回环。
  oidc:
    issuer: ${MARSCHAT_OIDC_ISSUER:https://auth.marschat.online}
    jwks-uri: ${MARSCHAT_OIDC_JWKS_URI:http://auth-center:8085/oauth2/jwks}
  # RBAC 权限校验（Phase 4 三层同源·接口层）：@RequirePermission 拦截器 + PermissionChecker
  # 权限点经 auth-center 下发（60s 缓存）；fail-open=true 枢纽抖动时不打挂业务接口
  authz:
    client-id: marschat-kbops
    issuer: ${MARSCHAT_OIDC_ISSUER:https://auth.marschat.online}
  # 菜单上报（Phase 4 P-B）：启动时把 classpath menu-registry.yml 全量覆盖上报到
  # auth-center /internal/clients/{client-id}/menus，凭据走 X-Client-Secret
  # （sys_app_client.client_secret，由运维注入；缺失时 reporter 跳过并 WARN，不阻断启动）。
  menu:
    report:
      enabled: ${MARSCHAT_MENU_REPORT_ENABLED:true}
      # 容器内网直连（同 oidc.jwks-uri 模式）：/internal/** 不在公网 nginx 白名单，secret 不出公网
      issuer: ${MARSCHAT_MENU_REPORT_ISSUER:http://auth-center:8085}
      client-id: marschat-kbops
      report-mode: secret
      report-secret: ${MARSCHAT_MENU_REPORT_SECRET:}
  # 管理代理（BFF，Phase 13）：把前端同源的 /kb-ops/admin/** 代理到 auth-center /admin/**，
  # 以**调用者本人**的中心令牌转发（绝不服务账号兜底）。
  # 实现已上移到 auth-core 2.2.0 的 MarschatBffAutoConfig；白名单见 classpath:bff-whitelist.yml。
  bff:
    enabled: ${MARSCHAT_BFF_ENABLED:true}
    client-id: marschat-kbops
    # 容器内网直连（同 oidc.jwks-uri / menu.report.issuer 模式）
    auth-center-base: ${MARSCHAT_AUTH_CENTER_BASE:http://auth-center:8085}
    # 本应用对前端暴露的代理前缀。前端请求 /ops-api/admin/** → nginx 剥 /ops-api 加 /kb-ops
    # → 应用收到 /kb-ops/admin/**（context-path=/kb-ops）→ 转发中心 /admin/**
    path-prefix: /admin
    # kb-ops 为纯 SSO 应用（showLocalLogin=false）：浏览器持有的就是中心 OIDC token，直接透传
    credential-mode: passthrough
    # 账号上报凭据（与菜单上报同值）；kb-ops 无本地账号表，未提供 BffAccountSource，故实际不上报
    report-secret: ${MARSCHAT_MENU_REPORT_SECRET:}

# 服务间调用 (单机部署，直接 HTTP URL)
# 独立运行时可选：kb-ops 脱离 mykng 后，以下 Feign 调用 kb-intelligence 为可选依赖。
# 若不需要智能同步，可忽略；需要时请确保目标服务可达。
kb:
  feign:
    intelligence-url: ${INTELLIGENCE_URL:http://kb-intelligence:8086}

logging:
  level:
    com.kb.ops: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
