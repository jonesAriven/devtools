# kb-ops 菜单注册表（menu-permission-management-plan §5 schema）
# key = 权限点稳定标识（sys_permission.code，下发为 marschat-kbops:menu:<key>），与
# kb-ops-web router meta.perm 的 permCode('menu','<key>') 严格对齐，禁止随意改名。
# 菜单源 = kb-ops-web src/layouts/MainLayout.vue（auth-core MenuRegistryReporter 启动时
# 全量覆盖上报到 auth-center /internal/clients/marschat-kbops/menus）。
client: marschat-kbops
menus:
  - key: dashboard
    title: 看板
    path: /dashboard
    order: 1
    # public=true → 「已登录即可见」：strict 默认最小权限下仍授予默认可见角色
    # （平台 user/admin + 本应用 user），保证普通用户登录后有落地页而不是一片空白。
    # 其余菜单与所有 api 点必须由应用角色显式授权（见 ADR §35.2 / AuthzPolicyService）。
    public: true
  - key: resource-group
    title: 资源管理
    order: 2
    children:
      - key: hosts
        title: 主机管理
        path: /hosts
        order: 1
      - key: services
        title: 服务管理
        path: /services
        order: 2
      - key: ports
        title: 端口管理
        path: /ports
        order: 3
      - key: credentials
        title: 凭据管理
        path: /credentials
        order: 4
      - key: domains
        title: 域名管理
        path: /domains
        order: 5
      - key: dependencies
        title: 依赖管理
        path: /dependencies
        order: 6
  - key: deploy-group
    title: 部署运维
    order: 3
    children:
      - key: deployments
        title: 部署记录
        path: /deployments
        order: 1
      - key: conflicts
        title: 矛盾检测
        path: /conflicts
        order: 2
  - key: system-group
    title: 系统工具
    order: 4
    children:
      - key: knowledge
        title: 运维知识库
        path: /knowledge
        order: 1
      - key: import
        title: 数据导入
        path: /import
        order: 2
      - key: logs
        title: 操作日志
        path: /logs
        order: 3
      - key: users
        title: 用户管理
        path: /users
        order: 4
        min-role: admin

# api 粒度权限点（Phase 4 扩展）：写操作细粒度，@RequirePermission("api:<key>") 消费。
# 类级 menu:hosts 仍是访问闸门；api 点为方法级叠加（授权面板可单独勾选）。
apis:
  - key: hosts:create
    title: 新增主机
  - key: hosts:update
    title: 编辑主机
  - key: hosts:delete
    title: 删除主机
  - key: services:create
    title: 新增服务
  - key: services:update
    title: 编辑服务
  - key: services:delete
    title: 删除服务
  - key: ports:create
    title: 新增端口
  - key: ports:update
    title: 编辑端口
  - key: ports:delete
    title: 删除端口
  - key: credentials:create
    title: 新增凭据
  - key: credentials:update
    title: 编辑凭据
  - key: credentials:delete
    title: 删除凭据
  - key: domains:create
    title: 新增域名
  - key: domains:update
    title: 编辑域名
  - key: domains:delete
    title: 删除域名
  - key: dependencies:create
    title: 新增依赖
  - key: dependencies:update
    title: 编辑依赖
  - key: dependencies:delete
    title: 删除依赖
  - key: deployments:create
    title: 新增部署记录
  - key: conflicts:detect
    title: 检测冲突
  - key: conflicts:resolve
    title: 处理冲突
  - key: knowledge:create
    title: 新增知识条目
  - key: knowledge:update
    title: 编辑知识条目
  - key: knowledge:delete
    title: 删除知识条目
  - key: import:exec
    title: 导入数据（JSON）
  - key: import:csv
    title: 导入数据（CSV）
  - key: dashboard:refresh
    title: 刷新看板快照
  - key: sync:run
    title: 触发从知识库同步
