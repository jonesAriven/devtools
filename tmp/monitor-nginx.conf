# monitor.marschat.online - infra-monitor 基础设施监控
server {
    listen 80;
    server_name monitor.marschat.online;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name monitor.marschat.online;

    ssl_certificate /etc/nginx/ssl/marschat.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/marschat.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/monitor-access.log;
    error_log  /var/log/nginx/monitor-error.log;

    # 根路径重定向到 /infra/
    location = / {
        return 302 /infra/;
    }

    # 所有请求反代到 mykng（mykng 会根据 URI 路由到 /infra/）
    location / {
        proxy_pass http://100.93.36.113:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
