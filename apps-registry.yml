# =====================================================================
# apps-registry.yml —— 平台应用注册单一真源（Phase 3 配置化接入，R4=①）
# =====================================================================
# 产物派生（python scripts/gen-from-registry.py）：
#   ① auth-center/src/main/resources/clients.yml —— OIDC 客户端 L1 种子
#   ② 各前端 public/app-config.json —— 运行时配置（同产物多环境）
# ⚠️ 本文件是唯一手工编辑点；派生产物全部标 AUTO-GENERATED 禁止手改。
# ⚠️ 新应用接入 = 本文件加一段 + 跑生成器 + auth-center 重启，全程不改 auth-center Java。
# 默认值（未在 client 段覆盖时生效，与 DatabaseInitializer 既有硬编码一致）：
defaults:
  auth:
    scopes: [openid, profile]
    grant-types: [authorization_code, refresh_token]
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7
    reuse-refresh-tokens: false
    require-consent: false

apps:
  # ─────────────── 六应用（紧密型接入） ───────────────
  - client-id: marschat-portal
    name: MarsChat Portal
    type: confidential                      # confidential=机密客户端(BASIC+secret)；public=PKCE
    secret: ${PORTAL_CLIENT_SECRET:portal-secret-2026}   # ${ENV:默认} 占位——容器注入 PORTAL_CLIENT_SECRET 时优先
    auth:
      redirect-uris:
        - http://localhost:5173/auth/callback
        - https://main.marschat.online/portal/auth/callback
        - http://192.168.31.105:8095/portal/auth/callback
      post-logout-redirect-uris:
        - https://main.marschat.online/portal/login
        - http://192.168.31.105:8095/portal/login
        - http://localhost:5173/login
    frontend:
      entry: https://main.marschat.online/portal/
      context-path: /portal
      api-base: /portal/api

  - client-id: marschat-kbweb
    name: MarsChat KB Web (SPA)
    type: public
    # 菜单上报凭据（Phase 4 P-B internal 通道 X-Client-Secret；值现场生成，48 位十六进制）：
    # 派生进 auth-center clients.yml → ClientsYmlLoader 幂等补写 sys_app_client.client_secret。
    # 应用侧通过环境变量 MARSCHAT_MENU_REPORT_SECRET 注入同值（见 mykng/.env）。
    menu-report-secret: ${KBWEB_MENU_REPORT_SECRET:fff08d4f9ca92f27ffb9111d1a9b8ed9e54769c3dc279bf3}
    auth:
      redirect-uris:
        - http://localhost:5173/kb/sso-callback
        - https://kb.marschat.online/kb/sso-callback
        - http://192.168.31.105/kb/sso-callback
      post-logout-redirect-uris:
        - https://kb.marschat.online/kb/login
        - http://192.168.31.105/kb/login
        - http://localhost:5173/kb/login
    frontend:
      entry: https://kb.marschat.online/kb/
      context-path: /kb
      api-base: /kb/api

  - client-id: marschat-kbops
    name: MarsChat KB Ops (SPA)
    type: public
    auth:
      redirect-uris:
        - http://localhost:3001/ops/sso-callback
        - https://kb.marschat.online/ops/sso-callback
        - http://192.168.31.105/ops/sso-callback
      post-logout-redirect-uris:
        - https://kb.marschat.online/ops/login
        - http://192.168.31.105/ops/login
        - http://localhost:3001/ops/login
    frontend:
      entry: https://kb.marschat.online/ops/
      context-path: /ops
      # ⚠️ 2026-09-14 修正：原值 /ops/ops-api 与 nginx 不一致（mykng nginx 只注册 `/ops-api/`
      # → 127.0.0.1:8084/kb-ops/），/ops/ops-api/** 会落进 `location /ops/` 被转发给前端容器。
      api-base: /ops-api
      auth-api-base: /ops/auth-api

  - client-id: marschat-inframon
    name: MarsChat Infra Monitor (SPA)
    type: public
    # 菜单上报凭据（Phase 4 P-B internal 通道 X-Client-Secret；值现场生成，48 位十六进制）：
    # 派生进 auth-center clients.yml → ClientsYmlLoader 幂等补写 sys_app_client.client_secret。
    # 应用侧通过环境变量 MARSCHAT_MENU_REPORT_SECRET 注入同值（见 infra-monitor compose）。
    menu-report-secret: ${INFRAMON_MENU_REPORT_SECRET:fd20b92c239eaad778f750817a33e67f6bc108179c008448}
    auth:
      redirect-uris:
        - https://monitor.marschat.online/infra/sso-callback
        - http://192.168.31.105/infra/sso-callback
        - http://localhost:3002/infra/sso-callback
      post-logout-redirect-uris:
        - https://monitor.marschat.online/infra/login
        - http://192.168.31.105/infra/login
        - http://localhost:3002/infra/login
    frontend:
      entry: https://monitor.marschat.online/infra/
      context-path: /infra
      # ⚠️ 2026-09-14 修正：原值 /infra/infra-api 是**死路径**——nginx 只注册了
      # `location /infra/api/`（proxy_pass → 127.0.0.1:8088/infra/），/infra/infra-api/**
      # 会落进 `location /infra/` 被转发给前端静态容器，POST 一律 405。
      # 实测：POST /infra/api/auth/login → 200；POST /infra/infra-api/auth/login → 405。
      api-base: /infra/api
      auth-api-base: /infra/api

  - client-id: marschat-activecode
    name: MarsChat ActiveCode (SPA)
    type: public
    # 账号映射上报凭据（Phase 7）：activecode 有自有 admin_user 账号库，启动时经
    # /internal/clients/{id}/accounts 全量登记到中心 app_account_mapping（X-Client-Secret）。
    # 派生进 auth-center clients.yml → ClientsYmlLoader 幂等写入 sys_app_client.client_secret；
    # 应用侧经 compose 注入同值 MARSCHAT_MENU_REPORT_SECRET。
    menu-report-secret: ${ACTIVECODE_MENU_REPORT_SECRET:b2ad6222f50d9f5d9000c3c9abe7ef6242494e9b5b988172}
    auth:
      # 回调用 .html 后缀：静态资源映射要求带扩展名，无后缀路由 404（DatabaseInitializer 注释）
      redirect-uris:
        - https://tools.marschat.online/activecode/sso-callback.html
        - http://192.168.31.182:18080/activecode/sso-callback.html
        - http://192.168.31.105:18080/activecode/sso-callback.html
      post-logout-redirect-uris:
        - https://tools.marschat.online/activecode/login.html
        - http://192.168.31.182:18080/activecode/login.html
        - http://192.168.31.105:18080/activecode/login.html
    frontend:
      entry: https://tools.marschat.online/activecode/
      context-path: /activecode

  - client-id: cosmic-studio
    name: MarsChat COSMIC Studio
    type: public
    # 菜单/账号上报凭据（Phase 4 P-B internal 通道 X-Client-Secret；Phase 7 复用为账号登记）。
    # ⚠️ 与 kbweb/inframon/activecode **不同**：本条**不写明文默认值**，只声明 env 变量名，
    #    即 `${COSMIC_MENU_REPORT_SECRET:}` 空默认。理由：
    #      ① cosmic 的既有约定本就是 env 注入（部署机 /root/devtools/cosmic-studio/.env +
    #         docker-compose.yml 的 `MENU_REPORT_SECRET: ${COSMIC_MENU_REPORT_SECRET:-}`），
    #         库内 client_secret 为 32 位、由 env 直接决定，并非 48 位生成值；
    #      ② 避免把明文凭据写进 git（kbweb/inframon/activecode 那三条属 P2，见文末 TODO）。
    #    派生进 auth-center clients.yml 后由 ClientsYmlLoader.resolveSecret() 解析：
    #    auth-center 容器内没有该 env → 解析为空串 → 仅 INSERT IGNORE 建行、不写 secret
    #    （且 syncAppClientSecret ③「库内已有非空值不覆盖」）。
    # 背景（2026-09-16 线上实测）：cosmic 上报**本来就已生效**——cosmic-api 启动日志
    #    `菜单上报成功: cosmic-studio (upserted=19 retired=0)`、`账号上报成功 (upserted=2)`，
    #    中心 sys_app_client.client_secret 非空且与容器 env 同值，/auth/permissions
    #    返回 configured=true。本条补齐的是**配置真源**：原先缺这个键，会让"换机器/重建环境"
    #    时 cosmic 静默退化为不上报（fail-soft，无报错）。
    # TODO(P2)：统一把 kbweb/inframon/activecode 的明文 menu-report-secret 改为本条这种
    #    env-only 写法，消除"凭据入 git"。
    menu-report-secret: ${COSMIC_MENU_REPORT_SECRET:}
    auth:
      redirect-uris:
        - https://cosmic.marschat.online/sso-callback
        - http://192.168.31.105:8310/sso-callback
        - http://localhost:5173/sso-callback
        - http://localhost:8310/sso-callback
    frontend:
      entry: https://cosmic.marschat.online/
      context-path: /

  # ─────────────── 工具/面板（Phase 2 批量播种） ───────────────
  - client-id: marschat-memory
    name: MarsChat Memory Extract Panel
    type: public
    auth:
      redirect-uris:
        - https://memory.marschat.online/sso-callback
        - http://192.168.31.105:8720/sso-callback
    frontend:
      entry: https://memory.marschat.online/

  - client-id: marschat-tokenhub
    name: MarsChat TokenHub
    type: public
    auth:
      # TokenHub（Go+Next.js）原生 generic_oidc，回调为内置地址
      redirect-uris:
        - https://tokenhub.marschat.online/api/admin/auth/oauth/callback
        - http://192.168.31.105:13000/api/admin/auth/oauth/callback
    frontend:
      entry: https://tokenhub.marschat.online/

  - client-id: frp-manager
    name: MarsChat FRP Manager
    type: public
    auth:
      redirect-uris:
        - https://frp.marschat.online/sso-callback
        - http://192.168.31.105:18082/sso-callback
        - http://localhost:5173/sso-callback
    frontend:
      entry: https://frp.marschat.online/

  # ─────────────── 测试应用（Phase 3 验收：全程零 Java 改动接入） ───────────────
  - client-id: p3-probe-client
    name: Phase3 Onboarding Probe
    type: public
    auth:
      redirect-uris:
        - https://p3-probe.marschat.online/sso-callback
        - http://localhost:5173/sso-callback
