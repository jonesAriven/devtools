server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA：前端路由回退 index.html
    # ⚠️ index.html 必须不缓存：发版后构建产物是「内容哈希」新文件名（如 index-XXXX.js），
    # 若浏览器复用旧 index.html，就会继续请求旧 hash 的分包 → 用户端表现为
    # "改了没生效 / bug 还在"，必须清空缓存或硬刷才行。
    # 这里设 no-store：任何一次整页刷新都拿到最新 index.html，从而指向新分包。
    # 注意：SPA 内切菜单不会重新拉 JS，发版后仍需整页刷新一次（F5 即可，不必 Ctrl+Shift+R）。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带内容哈希，内容不变文件名不变，可安全长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 后端 API 反代（compose 网络内服务名）
    location /api/ {
        proxy_pass http://cosmic-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;   # 导入 xlsx 上传
        proxy_read_timeout 300s;    # lint/批次优化长请求
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}
